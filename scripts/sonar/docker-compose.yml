#
# Local, headless SonarQube quality gate. Loopback-only (127.0.0.1:9000) --
# not exposed to the network. Data/logs/extensions persist in named volumes
# across `sonar.sh down` (removed by `sonar.sh purge`); the image is pinned
# (see below) because that data cannot survive a version change. The `sonar-net`
# network lets the sonar-scanner-cli container (run ad hoc by `sonar.sh scan`,
# not part of this compose file) reach the server by its service name.
#
# See scripts/sonar/sonar.sh for the CLI that drives this file.

services:
  sonarqube:
    # Pinned to one exact release, never a floating tag such as `community`.
    # The server keeps everything (credentials, analyses, the new-code
    # baseline) in its EMBEDDED H2 database on the sonar_data volume, and
    # SonarQube cannot upgrade an embedded database: POST /api/system/migrate_db
    # answers "Upgrade is not supported on embedded database". A newer image
    # therefore stays in DB_MIGRATION_NEEDED on an older volume, and an older
    # image exits on a newer one ("Database was upgraded to a more recent
    # version of SonarQube"). With a floating tag that happens the day someone
    # pulls. `sonar.sh up` detects both and names the two ways out.
    #
    # Moving this pin is a deliberate upgrade that resets every developer's
    # local Sonar data -- see "Pinned images and deliberate upgrades" in
    # docs/architecture/cross-cutting/development-and-quality.md.
    # SONAR_IMAGE overrides the pin for as long as it is set, e.g. to keep
    # using the image an existing volume was created with. It is not
    # remembered: export it for every sonar.sh / make sonar-* call until this
    # worktree's branch pins that release, or until you purge (unset it
    # before the purge). In a worktree whose branch predates a pin bump,
    # rebase rather than purge.
    image: ${SONAR_IMAGE:-sonarqube:26.8.0.126808-community}
    container_name: op-ai-gateway-sonarqube
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      # Single-node local use: skip the ES bootstrap checks (max map count,
      # file descriptor limits) that a throwaway dev container will fail.
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_logs:/opt/sonarqube/logs
      - sonar_extensions:/opt/sonarqube/extensions
    networks:
      - sonar-net
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
      nproc: 8192
    # mem_limit (not `deploy.resources`) is the form `docker compose` honors
    # outside swarm mode.
    mem_limit: 4g

networks:
  sonar-net:
    name: sonar-net

volumes:
  sonar_data:
    name: op-ai-gateway-sonar-data
  sonar_logs:
    name: op-ai-gateway-sonar-logs
  sonar_extensions:
    name: op-ai-gateway-sonar-extensions
