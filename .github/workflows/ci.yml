#
# Continuous integration: format check, lint, build, and test for the Go
# backend + server-agent and the React/TypeScript frontend. Ready to run as
# soon as a runner is attached to the repository.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go (backend + agent)
    runs-on: ubuntu-latest
    # The store conformance suite runs against every driver, but its PostgreSQL
    # leg SKIPS itself unless OP_AI_GATEWAY_TEST_POSTGRES_DSN is set. Without
    # this service that leg never ran here, and the gaps it exists to catch --
    # narrow column types (ADR-005), dialect-specific SQL -- reached main
    # unnoticed. The image tracks the deployment view's postgres:17-alpine so CI
    # tests the version operators actually run.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: op_test
        ports:
          - 5432:5432
        # Steps start as soon as the container does, which is well before the
        # server accepts connections; without this the first test would race it.
        options: >-
          --health-cmd "pg_isready -U postgres -d op_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1
      - name: Format check + lint + test (backend)
        working-directory: gateway/backend
        # Only the backend reads this: the server-agent has no store. The suite
        # gives itself a clean slate per PostgreSQL subtest (drop schema public
        # cascade), which is safe because internal/store is the single package
        # that touches the database -- its tests are serialized within the
        # package, so no two of them share the schema at once.
        env:
          OP_AI_GATEWAY_TEST_POSTGRES_DSN: postgres://postgres:postgres@127.0.0.1:5432/op_test?sslmode=disable
        # -timeout: Go's default is 10 minutes PER PACKAGE, and internal/store
        # normally takes ~151s of it while internal/gateway takes ~130s. That
        # looks like ample headroom until a runner degrades: one observed run
        # had the disk-heavy packages ~4x slower (internal/portal 6.6s -> 28.4s,
        # cmd/gateway 24.7s -> 90.9s) while CPU-bound ones were unaffected, and
        # internal/store crossed 600s and failed the job. Nothing had hung --
        # Go's panic named a subtest that was 1s old, and a genuinely stuck one
        # is named with its full elapsed time -- so the red carried no
        # information about the commit. 25m keeps a 4x-degraded runner green and
        # matches the figure development-and-quality.md already gives for the
        # race leg. It does NOT slow a healthy run, and it does not mask a real
        # hang in the store's Postgres setup: that path bounds itself in seconds
        # (internal/store/postgres_testenv_test.go).
        run: |
          golangci-lint fmt --diff
          golangci-lint run
          go test -timeout=25m ./...
      # The server-agent module is left on the default: its slowest package is
      # ~47s, so even a 4x-degraded runner stays an order of magnitude clear.
      - name: Format check + lint + test (server-agent)
        working-directory: server-agent
        run: |
          golangci-lint fmt --diff
          golangci-lint run
          go test ./...

  docs:
    name: Docs (links, index, openapi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The checker resolves link targets from `git ls-files`, so it needs the
      # repository, not a shallow export -- checkout@v4 gives it that. No Go,
      # no Node, no dependency install: bash + git + awk.
      - name: Pin the checker (its negative cases must still fail)
        run: sh scripts/check-docs.test.sh
      - name: Docs consistency
        run: ./scripts/check-docs.sh

  frontend:
    name: Frontend (portal)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test
        run: npm test

  e2e-runtime:
    name: E2E (runtime)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The agent-managed model runtime is the newest, least-exercised subsystem
    # and the ONLY suite that crosses a real process boundary: the gateway hands
    # a launch spec to a real server-agent binary, which exec()s a real child,
    # an inference routes to it, and the state returns to the portal. A locator
    # that no longer matches the shipped DOM is exactly the class of defect only
    # this layer sees -- e2e:runtime was red for three commits once and no gate
    # noticed (issue #24). This job runs `e2e:runtime` ONLY; the other 19
    # Playwright suites stay local-only (development-and-quality.md §6).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Every e2e config's webServer builds a Go binary and sets GOCACHE. The
      # in-repo default is the macOS-only /private/tmp path; the configs fall
      # back to $GOCACHE when it is set (playwright.*.config.ts), so point it at
      # a writable path on the runner (Go creates it). Without this the
      # webServer's `go build` dies with a filesystem error before any test runs.
      # Set via $GITHUB_ENV so it reaches every later step, including the Node
      # process whose process.env the configs read. RUNNER_TEMP is a default env
      # var; the `runner` context is NOT available in a job-level `env:`.
      - name: Point GOCACHE at a writable path
        run: echo "GOCACHE=$RUNNER_TEMP/op-e2e-go-build" >> "$GITHUB_ENV"
      # The frontend deps are for the suite's own webServer, which runs
      # `npm run build && npm run preview` to serve the real portal it tests.
      - name: Install frontend dependencies
        working-directory: gateway/frontend
        run: npm ci
      - name: Install e2e dependencies
        working-directory: gateway/e2e
        run: npm ci
      - name: Install the Playwright browser
        working-directory: gateway/e2e
        run: npx playwright install --with-deps chromium
      # The suite's webServer builds the gateway with a 120s timeout, and the
      # spec's beforeAll builds the agent and the stub server. Warming GOCACHE
      # and the module cache here (all three build to /dev/null) keeps those
      # in-suite builds incremental and well under their timeouts on a cold
      # runner, and fails early and clearly if any of the three stops compiling.
      - name: Warm the Go build cache
        run: |
          (cd gateway/backend && go build -o /dev/null ./cmd/gateway)
          (cd server-agent && go build -o /dev/null .)
          (cd gateway/e2e/e2e-runtime/fixtures/stubserver && go build -o /dev/null .)
      - name: Run the runtime e2e suite
        working-directory: gateway/e2e
        run: npm run e2e:runtime
