# TEMPLATE — do NOT apply as-is, and it is deliberately NOT listed in kustomization.yaml
# `resources:` so `kubectl apply -k` never ships these placeholder values.
#
# Usage:
#   cp secret.example.yaml secret.yaml     # secret.yaml is gitignored / kept out of the repo
#   # edit secret.yaml, replace every CHANGE-ME-* with a real value
#   kubectl apply -f secret.yaml           # apply the Secret separately, before `apply -k`
#
# The workloads reference this Secret by name (op-gateway-secrets); it only needs to
# EXIST in the namespace at apply time. Generate the random tokens/keys with:
#   openssl rand -hex 32
#
# THIS IS NOT THE ONLY SECRET A FIRST APPLY NEEDS. `op-gateway-web` (web.yaml) also
# mounts a SEPARATE Secret, `op-gateway-edge-tls` (the gateway's own edge/nginx TLS
# certificate — README.md §6, README-certificates.md §6) -- read-only, and referenced
# unconditionally by nginx-configmap.yaml's `:443` block, so a first apply with it
# missing leaves `op-gateway-web` stuck in ContainerCreating forever (there is no old
# pod to fall back to, unlike an upgrade, and unlike docker-compose this Secret mount
# has no writable-volume bootstrap fallback). See README.md §3 for the exact
# `openssl req` + `kubectl create secret` bootstrap commands -- create it BEFORE
# `kubectl apply -k`, same as this file.
apiVersion: v1
kind: Secret
metadata:
  name: op-gateway-secrets
  namespace: op-ai-gateway
  labels:
    app.kubernetes.io/part-of: op-ai-gateway
type: Opaque
stringData:
  # NetBird setup key for the sidecar's FIRST enrollment. Consumed only when
  # /var/lib/netbird is empty; ignored once the PVC holds an identity (idempotent).
  NB_SETUP_KEY: "CHANGE-ME-netbird-setup-key"

  # PostgreSQL password. MUST match the password embedded in OP_AI_GATEWAY_POSTGRES_DSN below.
  POSTGRES_PASSWORD: "CHANGE-ME-postgres-password"
  # DSN host is the op-gateway-db Service (StatefulSet). Keep the password in sync with
  # POSTGRES_PASSWORD above.
  OP_AI_GATEWAY_POSTGRES_DSN: "postgres://gateway:CHANGE-ME-postgres-password@op-gateway-db:5432/gateway?sslmode=disable"

  # openssl rand -hex 32
  OP_AI_GATEWAY_BOOTSTRAP_API_TOKEN: "CHANGE-ME-openssl-rand-hex-32"
  # Agent token for the seeded default AI server (used only when the DB is empty on
  # first start). openssl rand -hex 32
  OP_AI_GATEWAY_DEV_AGENT_TOKEN: "CHANGE-ME-openssl-rand-hex-32"
  # AES-256-GCM key for encrypting captured request/response bodies at rest. Without it
  # capture falls back to a volatile in-RAM store. openssl rand -hex 32
  OP_AI_GATEWAY_CAPTURE_ENCRYPTION_KEY: "CHANGE-ME-openssl-rand-hex-32"
  # AES-256-GCM key for the certificate module: every private key it handles (leaf keys,
  # the ACME account key, the internal CA key) is sealed with it. REQUIRED on a disk store
  # whenever the certificate module is enabled -- there is NO fallback to the capture key
  # above, and nothing is issued without it. Use a DIFFERENT value than the capture key.
  #
  # Left COMMENTED OUT on purpose. The cipher is built UNCONDITIONALLY at startup, so a
  # leftover "CHANGE-ME-..." (or any other non-hex value) is a FATAL misconfiguration and
  # the gateway REFUSES TO START -- even for a deployment that never enables certificates.
  # Omitting the key entirely is the safe default: the gateway starts normally, and if the
  # certificate module is later switched on, the portal's certificate view names this exact
  # variable as the reason nothing is issued.
  #
  # To use certificates: uncomment the line and paste a REAL 64-character hex value
  # (openssl rand -hex 32) -- never the placeholder text.
  # OP_AI_GATEWAY_CERT_ENCRYPTION_KEY: "put-a-real-openssl-rand-hex-32-value-here"
