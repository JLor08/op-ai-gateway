# Gateway nginx (compose, NO-NetBird variant). Bind-mounted by
# docker-compose.no-netbird.yml over the config baked into the frontend image;
# identical to default.conf except that $backend points at backend:8080 (the
# backend runs in its own netns here). locations.conf, which both server blocks
# include, is baked into the image AND bind-mounted alongside this file so the
# two always match.
#
# X-Forwarded-Proto: prefer what the UPSTREAM proxy sent and fall back to this
# hop's own scheme. Before this map nginx always overwrote the header with
# $scheme, i.e. always "http" here -- which made every URL the gateway derives
# from it (e.g. the agent config's gateway_url) wrong behind a TLS-terminating
# proxy. This header is therefore client-influenced BY DESIGN; the unforgeable
# statement about the last hop is X-OP-Edge-Scheme (set, never blanked, below).
map $http_x_forwarded_proto $op_fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Docker embedded DNS so a backend container restart is re-resolved. The gateway
    # backend shares the `netbird` sidecar's network namespace (docker-compose:
    # network_mode "service:netbird"), so its management listener (0.0.0.0:8080) is
    # reachable at the `netbird` service name, not `backend`.
    # NOTE: /api/agent/v1/telemetry IS still proxied here via `location /api/`
    # (locations.conf). Its NetBird-only isolation is NOT enforced by nginx — it is
    # enforced at the app layer (the gateway returns 403 netbird.only on this public
    # listener when the runtime `netbird_only` toggle is on) PLUS the NetBird
    # ACL/host-firewall ceiling. The gateway ALSO binds a second listener on the wt0
    # NetBird IP for agents on the mesh; that one is never on this bridge and is not
    # proxied here.
    resolver 127.0.0.11 valid=10s;
    set $backend http://backend:8080;

    # Streaming-safe proxy defaults (inherited by the backend locations below).
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $op_fwd_proto;
    # Defense in depth: the internal trusted-loopback auth headers must ONLY ever
    # come from the gateway calling itself over loopback. Blank them on every
    # proxied request so an external client can never inject them via the proxy.
    # (The Go auth branch is also gated by a per-process secret, but this removes
    # the header at the edge entirely.)
    proxy_set_header X-OP-Internal-Auth "";
    proxy_set_header X-OP-Internal-User "";
    # Same defense in depth for the server_override feature: these headers let
    # the gateway's own background chat-run executor (calling itself over the
    # internal trusted-loopback path above) pin a request to one specific
    # AI-server. They must never be settable by an external client -- blank
    # them here too (the Go re-authorization gate, AuthorizeServerManage, is
    # the actual boundary; this just removes the header at the edge entirely).
    proxy_set_header X-OP-Server-Override "";
    proxy_set_header X-OP-Server-Override-Force "";
    # The gateway's own synthetic TLS self-probe marker. Blanked like the internal
    # headers above: it SUPPRESSES an observation of encrypted traffic (so the probe
    # cannot satisfy the arming precondition it exists to diagnose), which means a
    # client that sets it can suppress the gateway's own https observations while
    # sending plaintext -- on a quiet gateway that makes an armed plaintext gate
    # extinguish itself against the attacker. Bounded by the fail-safe (worst case is
    # a denial of ARMING, never a bypass), but free to close at the edge.
    proxy_set_header X-OP-Edge-Self-Probe "";
    # The last hop's real scheme. SET from $scheme, never blanked: this is the
    # gateway's only trustworthy statement about whether the request reached
    # nginx over TLS, so a client-supplied value must be OVERWRITTEN (which
    # setting it does) rather than cleared. A blank would make it useless.
    proxy_set_header X-OP-Edge-Scheme $scheme;
    proxy_buffering off;
    proxy_read_timeout 3600s;

    include /etc/nginx/op-locations.conf;
}

# TLS listener. The certificate is the gateway's OWN edge certificate: the backend
# writes edge-fullchain.pem/edge-key.pem into the shared `certs` volume
# (OP_AI_GATEWAY_CERT_EDGE_OUTPUT_DIR) which this container mounts at
# /etc/nginx/certs. The gateway is the only writer of the REAL pair; the mount is
# writable purely so the entrypoint can bootstrap -- see below.
#
# The files must EXIST for nginx to start -- `ssl_certificate` pointing at a
# missing file is a load error, and nginx is the entrance to everything including
# the login. The image entrypoint (deploy/nginx-cert-entrypoint.sh) therefore writes
# a throwaway bootstrap pair when none is present, so this block is always loadable;
# a verifying upstream proxy rejects that bootstrap cert (fail-closed, which is
# correct -- it is not the real one), and when the real one arrives the entrypoint
# reloads nginx (it polls the chain's fingerprint) and the portal shows it.
# In KUBERNETES the pair is a read-only Secret mount instead, so no bootstrap is
# possible there: create the op-gateway-edge-tls Secret before the first apply (the
# exact command is in deploy/k8s/web.yaml). A missing Secret holds a new pod in
# ContainerCreating -- louder and safer than a crash-loop -- while the old one serves.
#
# `listen 80` above is UNCHANGED: the ACME HTTP-01 challenge route lives there and
# certificate renewal for the whole fleet depends on it.
server {
    listen 443 ssl;
    http2 on;   # nginx >= 1.25.1 (image: nginx:1.27-alpine)
    server_tokens off;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    ssl_certificate     /etc/nginx/certs/edge-fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/edge-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    resolver 127.0.0.11 valid=10s;
    set $backend http://backend:8080;

    # Identical proxy defaults to the :80 block. Every proxy_set_header block must
    # carry ALL six X-OP-* directives, because setting any header discards the
    # inherited set -- see the comments on the :80 block for what each is for.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $op_fwd_proto;
    proxy_set_header X-OP-Internal-Auth "";
    proxy_set_header X-OP-Internal-User "";
    proxy_set_header X-OP-Server-Override "";
    proxy_set_header X-OP-Server-Override-Force "";
    # The gateway's own synthetic TLS self-probe marker. Blanked like the internal
    # headers above: it SUPPRESSES an observation of encrypted traffic (so the probe
    # cannot satisfy the arming precondition it exists to diagnose), which means a
    # client that sets it can suppress the gateway's own https observations while
    # sending plaintext -- on a quiet gateway that makes an armed plaintext gate
    # extinguish itself against the attacker. Bounded by the fail-safe (worst case is
    # a denial of ARMING, never a bypass), but free to close at the edge.
    proxy_set_header X-OP-Edge-Self-Probe "";
    proxy_set_header X-OP-Edge-Scheme $scheme;
    proxy_buffering off;
    proxy_read_timeout 3600s;

    include /etc/nginx/op-locations.conf;
}
