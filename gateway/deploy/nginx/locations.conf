# Shared location list for BOTH server blocks (plain :80 and TLS :443) of the
# gateway's nginx. Included from default.conf / default.no-netbird.conf.
#
# WHY an include: there are three hand-maintained copies of this server config
# (this file's two compose variants plus k8s/nginx-configmap.yaml). Adding the
# :443 block without an include would make that SIX copies of the location list,
# and the copies already drift. The include keeps it at three.
#
# CONTAINER PATH: /etc/nginx/op-locations.conf -- deliberately NOT under
# /etc/nginx/conf.d/. The stock nginx.conf does `include /etc/nginx/conf.d/*.conf;`
# at HTTP level, so a file named conf.d/locations.conf would ALSO be included
# there, where `location` is not allowed -- nginx would refuse to start and take
# the whole gateway (portal, API, login) offline. Verified against nginx:1.27-alpine.
#
# CONTRACT for the including file -- it MUST define, before the include:
#   * `$backend`         (compose variants) -- the variant with a literal
#                        proxy_pass (k8s) ships its own copy of this list, see
#                        k8s/nginx-configmap.yaml.
#   * `$op_fwd_proto`    -- the X-Forwarded-Proto map (http context).
#   * the six X-OP-* header directives at server level (see below).
# A missing variable is a load-time error, so a broken wiring fails loudly at
# `nginx -t` rather than silently at request time.

location = / {
    return 302 /portal/;
}

location /portal/ {
    try_files $uri $uri/ /portal/index.html;
}

location ~* ^/portal/assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

# WebSocket agent-telemetry stream: needs the Upgrade/Connection headers, which
# the server-level `proxy_set_header Connection "";` would otherwise clear.
# Setting ANY proxy_set_header here discards the whole inherited set, so all of
# them are re-declared -- including the six X-OP-* directives (the five
# blankings plus X-OP-Edge-Scheme). See the server blocks for what each one is for.
location = /api/agent/v1/stream {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $op_fwd_proto;
    proxy_set_header X-OP-Internal-Auth "";
    proxy_set_header X-OP-Internal-User "";
    proxy_set_header X-OP-Server-Override "";
    proxy_set_header X-OP-Server-Override-Force "";
    # The gateway's own synthetic TLS self-probe marker. Blanked like the internal
    # headers above: it SUPPRESSES an observation of encrypted traffic (so the probe
    # cannot satisfy the arming precondition it exists to diagnose), which means a
    # client that sets it can suppress the gateway's own https observations while
    # sending plaintext -- on a quiet gateway that makes an armed plaintext gate
    # extinguish itself against the attacker. Bounded by the fail-safe (worst case is
    # a denial of ARMING, never a bypass), but free to close at the edge.
    proxy_set_header X-OP-Edge-Self-Probe "";
    proxy_set_header X-OP-Edge-Scheme $scheme;
    proxy_buffering off;
    proxy_read_timeout 3600s;
}

# WebSocket live-transcription stream (the portal composer's microphone -> gateway).
# The same Upgrade shape as the agent stream above, so the same rule applies: ANY
# proxy_set_header here discards the inherited set, so all of it is re-declared,
# including the six X-OP-* directives.
#
# Host is $http_host here, NOT $host (the one deliberate difference from the agent
# stream): the gateway guards a browser upgrade -- which cannot carry the CSRF
# header -- with coder/websocket's default same-origin check, which compares the
# Origin header's host AND PORT with the Host it sees. $host drops the port, so a
# gateway published on a non-default port (the compose files publish :8080 and
# :8443) would see "gateway.example" against "Origin: https://gateway.example:8443"
# and refuse every upgrade with 403. $http_host forwards the browser's Host as sent.
#
# Timeout: proxy_read_timeout is the idle limit of an upgraded connection, in both
# directions. One dictation can run for minutes, and the gateway's own idle watchdog
# (OP_AI_GATEWAY_STREAM_IDLE_TIMEOUT, 120 s by default) is what ends a dead session,
# so nginx must never be the shorter fuse; 3600 s, as for the agent stream.
location = /api/portal/transcription-live {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $op_fwd_proto;
    proxy_set_header X-OP-Internal-Auth "";
    proxy_set_header X-OP-Internal-User "";
    proxy_set_header X-OP-Server-Override "";
    proxy_set_header X-OP-Server-Override-Force "";
    # See the agent stream above for why the self-probe marker is blanked at the edge.
    proxy_set_header X-OP-Edge-Self-Probe "";
    proxy_set_header X-OP-Edge-Scheme $scheme;
    proxy_buffering off;
    proxy_read_timeout 3600s;
}

# WebSocket Voice Chat (the portal's hands-free spoken conversation, issue #312). It is
# the live-transcription stream above again, directive for directive: the same Upgrade
# shape (ANY proxy_set_header here discards the inherited set, so all of it is
# re-declared, including the six X-OP-* directives), the same `Host $http_host` (the
# gateway's same-origin check compares the Origin's host AND PORT with the Host it sees;
# see the live-transcription block for the whole story) and the same 3600 s idle limit
# (the gateway's own idle watchdog is the intended fuse, nginx must never be the shorter).
#
# Two requirements are deliberately NOT in this block, because neither is a location-level
# setting:
#   * Header size. The single-use ticket rides the upgrade as a Sec-WebSocket-Protocol
#     value: ONE header line, and a voice ticket seals THREE routing targets where the live
#     one seals one, so it is up to 7 KiB (the gateway refuses to mint a larger one). nginx
#     caps one header line at one large_client_header_buffers buffer, 8k by default, which
#     would leave a full-size ticket under 1 KiB of margin. Both server blocks therefore set
#     `large_client_header_buffers 4 16k;` (valid at http and server level only).
#   * The ticket-mint POST /api/portal/voice-chat-ticket has no location of its own: it is
#     served by `location /api/` below. It blocks on the co-load gate, which can cold-start
#     three models and wait up to OP_AI_GATEWAY_VOICE_COLOAD_TIMEOUT (120 s by default), so
#     it needs a proxy_read_timeout of at least that -- and inherits the server-level
#     3600 s. nginx's own 60 s default would cut a cold start short. Do not shorten the
#     server-level value, and do not give that path a location with a shorter one.
location = /api/portal/voice-chat {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $op_fwd_proto;
    proxy_set_header X-OP-Internal-Auth "";
    proxy_set_header X-OP-Internal-User "";
    proxy_set_header X-OP-Server-Override "";
    proxy_set_header X-OP-Server-Override-Force "";
    # See the agent stream above for why the self-probe marker is blanked at the edge.
    proxy_set_header X-OP-Edge-Self-Probe "";
    proxy_set_header X-OP-Edge-Scheme $scheme;
    proxy_buffering off;
    proxy_read_timeout 3600s;
}

# ACME HTTP-01: Let's Encrypt fetches the challenge token anonymously over
# plain :80 for every managed name (*.int.<domain> plus, optionally, the
# public domain). The upstream reverse proxy must forward this path for those
# hosts. The gateway answers only tokens of its OWN in-flight orders. In the
# self-signed issuer mode no order ever runs, so this location simply 404s --
# it is harmless to keep enabled either way.
location /.well-known/acme-challenge/ { proxy_pass $backend; }

location /api/       { proxy_pass $backend; }
# Portal chat documents: a saved chat, and a regenerate's history, can be as
# large as the gateway's chat request cap (portal.MaxChatRequestBytes, 5 MiB --
# the 4 MiB content cap plus the JSON envelope). Everything else under /api/
# keeps nginx's 1 MiB default. No proxy_set_header here, so the server-level set
# (the X-OP-* blanking, and the buffering/timeout the run event stream needs) is
# inherited.
location /api/portal/chats { client_max_body_size 5m; proxy_pass $backend; }
# Live transcription, bearer surface: a chunked, FULL-DUPLEX POST -- the client keeps
# streaming PCM up while the gateway streams SSE transcript frames back on the same
# request. On top of the server-level defaults (HTTP/1.1 upstream, proxy_buffering
# off) it needs:
#   * proxy_request_buffering off -- nginx otherwise reads the WHOLE request body
#     before it contacts the gateway, and a live body only ends when the speaker
#     stops, so nothing would be forwarded and no transcript would come back;
#   * no body cap, and a body timeout as long as the stream: client_body_timeout is
#     the longest gap nginx tolerates between two reads of the request body, 60 s by
#     default, and would cut a client that pauses its PCM, while the gateway's own
#     idle watchdog is the intended limit.
# No proxy_set_header here, so the server-level set (the X-OP-* blanking) is inherited.
# The pattern covers the /openai/ alias too; a regex location outranks the /v1/ and
# /openai/ prefixes below, which keep serving every other endpoint exactly as before.
location ~ ^/(?:openai/)?v1/audio/transcriptions/live$ {
    client_max_body_size 0;
    client_body_timeout 3600s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_read_timeout 3600s;
    proxy_pass $backend;
}
# Inference endpoints carry base64 image data — no body cap (the rest of /api/
# stays at nginx's 1 MiB default); matches llama-swap's unbounded proxy behavior.
location /v1/        { client_max_body_size 0; proxy_pass $backend; }
location /openai/    { client_max_body_size 0; proxy_pass $backend; }
location /anthropic/ { client_max_body_size 0; proxy_pass $backend; }
location /healthz    { proxy_pass $backend; }
