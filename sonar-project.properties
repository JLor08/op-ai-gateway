# SonarQube project configuration for the local, agent-runnable quality gate
# (scripts/sonar/sonar.sh). See README.md -> Development -> "SonarQube
# quality gate (local)" for the make targets.
#
# Test coverage: `scripts/sonar/sonar.sh coverage` (or `make sonar-coverage`)
# generates the Go coverprofiles and the frontend lcov report referenced by
# sonar.go.coverage.reportPaths / sonar.javascript.lcov.reportPaths below;
# `sonar.sh gate` (`make sonar-gate`) runs coverage then scan. Report files
# are gitignored -- `scan` alone tolerates them being absent (scanner logs a
# WARN, coverage metrics are just skipped for that run).

sonar.projectKey=op-ai-gateway
sonar.projectName=op-ai-gateway

sonar.sources=gateway/backend,server-agent,gateway/frontend/src
sonar.tests=gateway/backend,server-agent,gateway/frontend/src
sonar.test.inclusions=**/*_test.go,**/*.test.ts,**/*.test.tsx

sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/.worktrees/**,**/test-results/**,**/playwright-report/**,**/*_gen.go

# Test coverage reports (gitignored; regenerated by `sonar.sh coverage`).
# sonar.exclusions' **/coverage/** above keeps the frontend report directory
# itself out of source indexing -- that is unrelated to, and does not
# conflict with, importing the lcov file below by explicit path.
sonar.go.coverage.reportPaths=gateway/backend/coverage.out,server-agent/coverage.out
sonar.javascript.lcov.reportPaths=gateway/frontend/coverage/lcov.info

sonar.go.file.suffixes=.go
sonar.scm.provider=git
sonar.sourceEncoding=UTF-8

# The scanner's embedded Node "bridge" (JS/TS analysis) intermittently dies
# mid-analysis on this repo (the docker VM shares ~8 GB between the SonarQube
# server, the scanner JVM, and the bridge — an unbounded/large Node old-space
# balloons into the VM's OOM killer and the scan ends in EXECUTION FAILURE).
# Cap the bridge explicitly so Node garbage-collects instead of growing: 2048
# keeps the whole pipeline comfortably inside the VM's budget. Do NOT raise
# this without also raising Docker's memory limit.
sonar.javascript.node.maxspace=2048

# The repo is analyzed from a linked git worktree (.git is a "gitdir:"
# pointer file, not a real directory). SonarScanner's SCM-ignore file walker
# (JGit's IncludedFilesRepository) cannot resolve that indirection reliably
# and silently treats every file as git-ignored ("0 non excluded files in
# this Git repository"), which zeroes out the whole analysis. Our explicit
# sonar.exclusions above already cover everything that matters (node_modules,
# dist, coverage, etc.), so disable the redundant SCM-based exclusion pass
# rather than relying on it. sonar.scm.provider=git (blame/authorship) is a
# separate code path and is unaffected.
sonar.scm.exclusions.disabled=true

# --- Versioned triage policy -------------------------------------------------
# Deliberate, reviewed exceptions. Kept in the repo (not in the server DB) so
# the policy is reproducible across `sonar.sh purge` and reviewable in diffs.
#
# e1: cognitive complexity (S3776) in TEST files. Table-driven Go tests and
#     scenario-style vitest suites legitimately grow long, flat bodies; the
#     production-code rule stays fully active (the quality gate fails on NEW
#     violations there).
# e2: too-many-parameters (S107) in TEST files — test helpers mirror the
#     production call sites they drive.
# e3: pseudorandom-number warning (S2245) in the MatrixRain theme animation —
#     Math.random drives a purely decorative rain effect; cryptographic
#     randomness is not required and crypto.getRandomValues would add cost for
#     no security benefit.
sonar.issue.ignore.multicriteria=e1,e2,e3
sonar.issue.ignore.multicriteria.e1.ruleKey=go:S3776
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*_test.go
sonar.issue.ignore.multicriteria.e2.ruleKey=go:S107
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*_test.go
sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S2245
sonar.issue.ignore.multicriteria.e3.resourceKey=**/theme/MatrixRain.tsx
