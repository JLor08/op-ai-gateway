            The caller's own accounts, oldest first. Each row carries its
            rate-limit usage snapshot when one has been stored (omitted
            otherwise, and omitted for a row whose snapshot could not be read:
            the list never fails over it).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/VendorAccount' }
    post:
      tags: [portal]
      summary: Create a vendor account (seeded with a static model set under its prefix; an OpenAI-compatible one is filled by a best-effort discovery)
      security: [{ sessionCookie: [], csrfHeader: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VendorAccountCreateRequest' }
      responses:
        '201':
          description: The credential-free account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorAccount' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/portal/vendor-accounts/enabled:
    get:
      tags: [portal]
      summary: Whether the vendor-accounts module is enabled (boolean only)
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
  /api/portal/vendor-accounts/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [portal]
      summary: Vendor-account detail (includes the usage snapshot)
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: The credential-free account, with its rate-limit usage snapshot when one has been scraped
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorAccount' }
    patch:
      tags: [portal]
      summary: Update a vendor account (write-only api_key sentinel; a model_prefix re-labels the stored models)
      description: >
        Partial update; an absent field keeps its stored value. api_key and
        model_prefix take the keep (absent or null) / clear ("") / replace
        (value) sentinel. A request that carries model_prefix re-labels the
        account's stored model rows to the prefix plus each vendor id without
        asking the vendor again. A prefix longer than 64 characters, containing
        "..", or containing anything but A-Z a-z 0-9 - _ . ~ : / @ + is a 400
        vendor_account.model_prefix_invalid.
      security: [{ sessionCookie: [], csrfHeader: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VendorAccountUpdateRequest' }
      responses:
        '200':
          description: The credential-free account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorAccount' }
        '400': { $ref: '#/components/responses/BadRequest' }
    delete:
      tags: [portal]
      summary: Delete a vendor account
      security: [{ sessionCookie: [], csrfHeader: [] }, { bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
  /api/portal/vendor-accounts/{id}/connect/import:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [portal]
      summary: Connect a subscription account from imported OAuth tokens (validated fail-soft)
      description: >
        Body {access_token, refresh_token?, expires_at?}. The access token is
        checked against the vendor before it is stored; a definitive rejection
        is a 400 with vendor_account.connect_invalid_credentials and nothing is
        stored, an unreachable or inconclusive vendor still stores. Once the
        tokens are stored a best-effort model discovery (bounded to 5 seconds,
        never failing the connect) replaces the seeded models with the vendor's
        real list; the answer carries them when it succeeded.
      security: [{ sessionCookie: [], csrfHeader: [] }, { bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/OpaqueJSON' }
      responses:
        '200':
          description: The credential-free account, with the discovered models when the discovery succeeded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorAccount' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/portal/vendor-accounts/{id}/check:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [portal]
      summary: Test the connection (model-independent credential check)
      description: >
        No request body. Asks the vendor whether the account's stored credential
        is accepted and answers a VendorConnectionCheck. Strictly owner-only
        (system scope included); a non-owner gets the same 404 as an unknown
        id. Changes nothing and never returns a credential. A rejected
        credential is a 200 with status invalid, not an error; a stored
        credential that cannot be opened (lost encryption key, corrupt blob) is
        a 409 vendor_account.credential_unreadable.
      security: [{ sessionCookie: [], csrfHeader: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: The verdict on the account's stored credential
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorConnectionCheck' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >
            The account cannot be checked -- vendor_account.credential_unreadable
            (the stored credential cannot be opened; reconnect the account) or
            vendor_accounts.module_disabled while the master flag is off. The
            Error envelope carries the stable code.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/portal/vendor-accounts/{id}/models/refresh:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [portal]
      summary: Refresh the account's models from the vendor
      description: >
        No request body. Asks the vendor which models the account's stored
        credential can use and, when it answers with a usable list, replaces the
        account's models with it (each served as the account's model_prefix plus
        the vendor's id; at most 1000 models, each slug and display name validated
        and capped). A subscription access token already past its expiry is
        renewed first through the gateway's own locked token refresh. Answers the
        credential-free account and a VendorModelsRefreshResult. Fail-soft: when
        nothing usable can be had the models are kept and the answer is still a
        200 with refresh.status unverifiable (the account then already reads
        needs_reconnect when the vendor rejected the refresh token). Strictly
        owner-only (system scope included); a non-owner gets the same 404 as an
        unknown id. A stored credential that cannot be opened is a 409
        vendor_account.credential_unreadable; an uncategorized failure (a store
        error) is a 500 vendor_account.refresh_failed.
      security: [{ sessionCookie: [], csrfHeader: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: The account as it now serves its models, and what the refresh did
          content:
            application/json:
              schema:
                type: object
                required: [account, refresh]
                properties:
                  account: { $ref: '#/components/schemas/VendorAccount' }
                  refresh: { $ref: '#/components/schemas/VendorModelsRefreshResult' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >
            The account cannot be refreshed -- vendor_account.credential_unreadable
            (the stored credential cannot be opened; reconnect the account) or
            vendor_accounts.module_disabled while the master flag is off. The
            Error envelope carries the stable code.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: >
            vendor_account.refresh_failed -- the refresh failed for a reason
            outside the known states (a store failure). A vendor that cannot be
            asked is not this: it is a 200 with refresh.status unverifiable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/portal/vendor-accounts/{id}/usage/refresh:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [portal]
      summary: Refresh the account's usage snapshot from the vendor (OpenAI subscription only)
      description: >
        No request body. Pulls the account's usage snapshot from the vendor
        without re-listing its models and answers the stored snapshot as it is
        after the pull, plus a VendorUsageRefreshResult. Only an OpenAI
        subscription has an active pull; any other account answers
        refresh.status unsupported and no credential is opened. Without a query
        it is the on-view-lazy call: when the account's last active pull (held
        in memory per account, recorded only when the vendor was actually
        reached) is younger than the server's TTL of 5 minutes the vendor is not
        asked and the answer is fresh. force=1 (the manual refresh button)
        bypasses the TTL and always asks. An expired subscription token is
        renewed first through the gateway's own locked token refresh.
        Fail-soft: a vendor that cannot be asked is a 200 with refresh.status
        unverifiable and the stored snapshot kept. Strictly owner-only (system
        scope included); a non-owner gets the same 404 as an unknown id. A
        stored credential that cannot be opened is a 409
        vendor_account.credential_unreadable; an uncategorized failure (a store
        error) is a 500 vendor_account.usage_refresh_failed.
      security: [{ sessionCookie: [], csrfHeader: [] }, { bearerAuth: [] }]
      parameters:
        - name: force
          in: query
          required: false
          description: >
            1 or true (also t, T, TRUE, True) bypasses the lazy TTL; absent,
            false or any other value is the lazy call.
          schema: { type: string }
      responses:
        '200':
          description: The stored usage snapshot after the call, and what the refresh did
          content:
            application/json:
              schema:
                type: object
                required: [usage, refresh]
                properties:
                  usage:
                    description: The account's stored usage snapshot (the same object as the detail read's usage), or null when none has been stored.
                    oneOf:
                      - { $ref: '#/components/schemas/VendorAccountUsage' }
                      - { type: 'null' }
                  refresh: { $ref: '#/components/schemas/VendorUsageRefreshResult' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { description: 'Any method other than POST (Allow: POST).' }
        '409':
          description: >
            The usage cannot be refreshed -- vendor_account.credential_unreadable
            (the stored credential cannot be opened; reconnect the account) or
            vendor_accounts.module_disabled while the master flag is off. The
            Error envelope carries the stable code.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: >
            vendor_account.usage_refresh_failed -- the refresh failed for a
            reason outside the known states (a store failure). A vendor that
            cannot be asked is not this: it is a 200 with refresh.status
            unverifiable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
