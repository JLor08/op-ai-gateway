    description: >
      The request and response bodies are opaque JSON here; see api-surface.md.
      They include the boolean flag anthropic_prompt_caching_enabled (default
      false, experimental): when true, the gateway directs the Anthropic
      translate request builder to place prompt-cache breakpoints on eligible
      requests (native /v1/messages passthrough is unaffected). On the PUT an
      omitted or null value keeps the stored one.
      They also include the boolean vendor_subscriptions_enabled (default true,
      always present in the GET, writable on the PUT; omitted or null keeps the
      stored value): while false, creating or connecting a subscription vendor
      account is a 409 vendor_accounts.subscriptions_disabled and existing
      subscription accounts stop routing and being listed. It only has an effect
      while the vendor_accounts_enabled master flag is on.
      They also include the two sharing switches vendor_account_sharing_enabled
      (the sharing master switch, default false) and
      vendor_subscription_sharing_enabled (whether subscription accounts may be
      shared, default false, subordinate to the first): both always present in the
      GET (false when the store is absent or unreadable), writable on the PUT with
      an omitted or null value keeping the stored one, and neither has a
      validation error. While the master switch is off the share-level,
      management-group and resource-group endpoints are a 409
      vendor_accounts.sharing_disabled and every account behaves as personal.
