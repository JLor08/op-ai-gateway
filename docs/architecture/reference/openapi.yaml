      - { name: rgId, in: path, required: true, schema: { type: string } }
    put:
      tags: [portal]
      summary: Provision the service into a resource group (idempotent)
      description: >
        Writes the single service provision row, never the group's whole-set
        replace. The caller must manage the service and be a member of an admin
        group the resource group is linked to; a miss on either is a
        404-no-leak (service.not_found, resource_group.not_found).
      security: [{ sessionCookie: [], csrfHeader: [] }, { bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/OkTrue' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [portal]
      summary: Remove the service from a resource group (idempotent)
      description: The single-row inverse of the PUT, with the same gates.
      security: [{ sessionCookie: [], csrfHeader: [] }, { bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/OkTrue' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/portal/resource-groups/{id}/vendor-accounts:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      tags: [portal]
      summary: Replace the shared vendor accounts a resource group offers (resource-group manager side)
      description: >
        Body {vendor_account_ids}. Replaces the group's vendor-account set (add
        the desired-not-current, remove the current-not-desired; all-or-nothing
        validation, nothing is written when any addition is refused) and answers
        the group. The caller must manage the group (404 resource_group.not_found
        for a stranger and an unknown id alike) and, for EACH account they add,
        must operate it (404 vendor_account.not_found, system scope included),
        the account must be full (403 vendor_account.forbidden at shared, where
        only the owner's self-service links it; 400 vendor_account.not_shared
        below that) and rooted where the group is (400
        resource_group.vendor_account_system_group_mismatch). Removal needs only
        the group: whoever manages it can drop any link. This only links:
        whether a member can use an account is the routing grant's decision. 409
        vendor_accounts.module_disabled / vendor_accounts.sharing_disabled while
        the module or the sharing switch is off, whoever asks.
      security: [{ sessionCookie: [], csrfHeader: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vendor_account_ids]
              properties:
                vendor_account_ids:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: The resource group, with its vendor_accounts (see api-surface.md for the resource-group DTO)
          content:
            application/json:
              schema: { type: object }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VendorAccountsUnavailable' }
