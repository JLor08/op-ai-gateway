# SPDX-License-Identifier: AGPL-3.0-only
# Copyright (C) 2026 OnPrem AI Gateway contributors
#
# Machine-readable index of the gateway's HTTP surface. The canonical prose
# reference — auth modes, scopes, object-level authorization, dual-mux agent
# dispatch — is api-surface.md in this directory; keep both in sync (routes
# are registered in gateway/backend/internal/gateway/server.go).
#
# Scope: this spec is deliberately PATH-LEVEL. It lists every registered
# route with its verified methods, auth requirements, and purpose. Request/
# response bodies are typed loosely (the DTOs live in the Go code and change
# with it); only small, stable payloads are modeled as concrete schemas.
# Sub-resources that api-surface.md summarizes as "+ sub-paths" are
# enumerated in the parent path's description instead of being guessed here.
openapi: 3.1.0
info:
  title: OnPrem AI Gateway HTTP API
  version: 0.1.0
  description: >
    HTTP surface of the OnPrem AI Gateway: OpenAI/Anthropic-compatible
    inference endpoints, the portal application API, system administration,
    and the ServerAgent ingest API. Error responses use the stable-code
    envelope `{"error":{"code","message","request_id?"}}`. Session-based
    non-GET/HEAD/OPTIONS requests additionally require the `X-OP-CSRF: 1`
    header. See docs/architecture/reference/api-surface.md for the canonical
    description of auth modes, scopes, and object-level authorization.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only

servers:
  - url: http://127.0.0.1:8080
    description: Local development gateway (make run-gateway / make dev)
  - url: /
    description: >
      Bundled deployment — nginx proxies /api/, /v1/, /openai/, /anthropic/,
      /healthz, and the ACME challenge path to the backend and serves the SPA
      at /portal/.

tags:
  - name: inference
    description: OpenAI/Anthropic/Codex/Claude-Code-compatible endpoints
  - name: auth
    description: Login, logout, session state, invite-token password set
  - name: portal
    description: Authenticated application API (/api/portal/*)
  - name: system
    description: System administration (scope `system` = system_admin role + step-up elevation)
  - name: agent
    description: ServerAgent ingest and distribution (/api/agent/v1/*, agent-token bearer)
  - name: health
    description: Liveness and public infrastructure endpoints

security: []

paths:
  # ── 1. Inference / compatibility ─────────────────────────────────────────
  /v1/chat/completions:
    post:
      tags: [inference]
      summary: OpenAI-compatible chat completions (streaming supported)
      description: >
        Session-or-bearer, scope `gateway:use` or `llm:invoke`. The only
        inference path that also accepts the portal session (portal chat runs
        use it over the internal loopback path). Alias: /openai/v1/chat/completions.
      security: [{ bearerAuth: [] }, { sessionCookie: [], csrfHeader: [] }]
      requestBody: { $ref: '#/components/requestBodies/OpaqueJSON' }
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /openai/v1/chat/completions:
    post:
      tags: [inference]
      summary: Alias of /v1/chat/completions
      security: [{ bearerAuth: [] }, { sessionCookie: [], csrfHeader: [] }]
      requestBody: { $ref: '#/components/requestBodies/OpaqueJSON' }
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/responses:
    post:
      tags: [inference]
      summary: OpenAI Responses API (Codex)
      description: >
        Bearer-only, scope `gateway:use` or `llm:invoke`. Attempts native
        passthrough to an upstream that speaks the Responses API before
        falling back to translation. Alias: /openai/v1/responses.
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/OpaqueJSON' }
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /openai/v1/responses:
    post:
      tags: [inference]
      summary: Alias of /v1/responses
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/OpaqueJSON' }
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/messages:
    post:
      tags: [inference]
      summary: Anthropic Messages API (Claude Code)
      description: >
        Bearer-only, scope `gateway:use` or `llm:invoke`. Native passthrough
        when the target application supports it — the only path where
        Anthropic streaming works end-to-end. Alias: /anthropic/v1/messages.
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/OpaqueJSON' }
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /anthropic/v1/messages:
    post:
      tags: [inference]
      summary: Alias of /v1/messages
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/OpaqueJSON' }
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/messages/count_tokens:
    post:
      tags: [inference]
      summary: Anthropic token counting (no upstream inference, no billing)
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/OpaqueJSON' }
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /anthropic/v1/messages/count_tokens:
    post:
      tags: [inference]
      summary: Alias of /v1/messages/count_tokens
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/OpaqueJSON' }
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/models:
    get:
      tags: [inference]
      summary: OpenAI-shaped model listing
      description: >
        Bearer-only. Discovery is unfiltered by a service token's own
        allowlist but IS filtered by resource-group provisioning visibility.
        Alias: /openai/v1/models.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /openai/v1/models:
    get:
      tags: [inference]
      summary: Alias of /v1/models
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /anthropic/v1/models:
    get:
      tags: [inference]
      summary: Anthropic-shaped model listing
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v0/models:
    get:
      tags: [inference]
      summary: LM Studio-shaped model listing (emulated metadata only)
      description: >
        For LM-Studio-aware clients such as opencode; actual chat still goes
        over /v1/chat/completions.
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ── 2. Auth ───────────────────────────────────────────────────────────────
  /api/auth/login:
    post:
      tags: [auth]
      summary: Password login; sets the session cookie on success
      description: 'Public, but requires the `X-OP-CSRF: 1` header.'
      security: [{ csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/auth/logout:
    post:
      tags: [auth]
      summary: Clears the current session
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
  /api/auth/session:
    get:
      tags: [auth]
      summary: Current auth state (never errors on "not logged in")
      description: >
        Reports `authenticated`, the current-user DTO, and the default
        language — used by the SPA on load.
      security: []
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
  /api/auth/set-password:
    post:
      tags: [auth]
      summary: Consume a one-time set-password/invite token to set a password
      security: [{ csrfHeader: [] }]
      requestBody: { $ref: '#/components/requestBodies/OpaqueJSON' }
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }

  # ── 3. Portal: account, session, preferences ─────────────────────────────
  /api/portal/me:
    get:
      tags: [portal]
      summary: Current user DTO (role, elevation state, TOTP mode, …)
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/portal/password:
    post:
      tags: [portal]
      summary: Change own password (CSRF-enforced)
      security: [{ sessionCookie: [], csrfHeader: [] }, { bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/OpaqueJSON' }
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
  /api/portal/language:
    get:
      tags: [portal]
      summary: Own preferred language
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
    put:
      tags: [portal]
      summary: Set own preferred language
      security: [{ sessionCookie: [], csrfHeader: [] }, { bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/OpaqueJSON' }
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
  /api/portal/currency:
    get:
      tags: [portal]
      summary: System-wide EUR→USD display factor
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
  /api/portal/preferences:
    get:
      tags: [portal]
      summary: All own per-key UI preferences
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
  /api/portal/preferences/{key}:
    parameters:
      - { name: key, in: path, required: true, schema: { type: string } }
    get:
      tags: [portal]
      summary: One opaque per-key UI preference
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
    put:
      tags: [portal]
      summary: Set one opaque per-key UI preference
      security: [{ sessionCookie: [], csrfHeader: [] }, { bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/OpaqueJSON' }
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
  /api/portal/chat-settings:
    put:
      tags: [portal]
      summary: Own default chat run settings
      security: [{ sessionCookie: [], csrfHeader: [] }, { bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/OpaqueJSON' }
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
  /api/portal/system-admin-mode:
    post:
      tags: [portal]
      summary: Enter System-Admin step-up elevation
      description: >
        Requires role `system_admin`; may require re-entering the password
        per system setting.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody: { $ref: '#/components/requestBodies/OpaqueJSON' }
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [portal]
      summary: Leave System-Admin step-up elevation
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
  /api/portal/totp:
    get:
      tags: [portal]
      summary: TOTP 2FA status
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
    delete:
      tags: [portal]
      summary: Disable TOTP 2FA
      security: [{ sessionCookie: [], csrfHeader: [] }, { bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
  /api/portal/totp/{action}:
    post:
      tags: [portal]
      summary: TOTP enroll/confirm
      parameters:
        - { name: action, in: path, required: true, schema: { type: string, enum: [enroll, confirm] } }
      security: [{ sessionCookie: [], csrfHeader: [] }, { bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/OpaqueJSON' }
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }

  # ── 3. Portal: tokens, chats, usage ───────────────────────────────────────
  /api/portal/tokens:
    get:
      tags: [portal]
      summary: List own API tokens
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
    post:
      tags: [portal]
      summary: Create an API token
      security: [{ sessionCookie: [], csrfHeader: [] }, { bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/OpaqueJSON' }
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
  /api/portal/tokens/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      tags: [portal]
      summary: Update an own API token
      security: [{ sessionCookie: [], csrfHeader: [] }, { bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/OpaqueJSON' }
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
    delete:
      tags: [portal]
      summary: Delete an own API token
      security: [{ sessionCookie: [], csrfHeader: [] }, { bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
  /api/portal/tokens/{id}/rotate:
    post:
      tags: [portal]
      summary: Rotate an own API token
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      security: [{ sessionCookie: [], csrfHeader: [] }, { bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
  /api/portal/chats:
    get:
      tags: [portal]
      summary: List own portal chats
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
    post:
      tags: [portal]
      summary: Create a portal chat
      security: [{ sessionCookie: [], csrfHeader: [] }, { bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/OpaqueJSON' }
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
  /api/portal/chats/{id}:
    description: >
      Chat detail plus run sub-paths (run start, SSE run events, run cancel)
      under /api/portal/chats/{id}/runs… — see api-surface.md.
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [portal]
      summary: Chat detail
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
    put:
      tags: [portal]
      summary: Update a chat
      security: [{ sessionCookie: [], csrfHeader: [] }, { bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/OpaqueJSON' }
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
    delete:
      tags: [portal]
      summary: Delete a chat
      security: [{ sessionCookie: [], csrfHeader: [] }, { bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
  /api/portal/usage:
    get:
      tags: [portal]
      summary: Own usage analytics (fleet-wide with `admin` scope + scope=all)
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
  /api/portal/usage/stats:
    get:
      tags: [portal]
      summary: Usage statistics
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
  /api/portal/usage/groups:
    get:
      tags: [portal]
      summary: Usage grouped (by model/server/…)
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
  /api/portal/usage/timeseries:
    get:
      tags: [portal]
      summary: Usage time series
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
  /api/portal/usage/events:
    get:
      tags: [portal]
      summary: Usage event list
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
  /api/portal/usage/active:
    get:
      tags: [portal]
      summary: Currently in-flight requests (own; all with `admin` scope)
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
  /api/portal/usage/captures/{id}:
    get:
      tags: [portal]
      summary: Read a captured request/response payload (capture must be enabled)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/portal/benchmarks/active:
    get:
      tags: [portal]
      summary: Currently running benchmark jobs (visibility-filtered)
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
  /api/portal/dashboard:
    get:
      tags: [portal]
      summary: Aggregated dashboard payload
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }

  # ── 3. Portal: models, servers, applications, mappings ───────────────────
  /api/portal/models:
    get:
      tags: [portal]
      summary: Model catalog visible to the caller
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
  /api/portal/model-servers:
    get:
      tags: [portal]
      summary: Servers offering a given model + live benchmark/loaded state
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
  /api/portal/model-servers/events:
    get:
      tags: [portal]
      summary: SSE push on model load-state change
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/SSE' }
  /api/portal/model-group-servers:
    get:
      tags: [portal]
      summary: Candidate servers for a model group, resolver-ranked
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
  /api/portal/model-groups:
    get:
      tags: [portal]
      summary: List model groups (admin)
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [portal]
      summary: Create a model group (admin)
      security: [{ sessionCookie: [], csrfHeader: [] }, { bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/OpaqueJSON' }
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/portal/model-groups/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [portal]
      summary: Model-group detail (admin)
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
    put:
      tags: [portal]
      summary: Update a model group (admin)
      security: [{ sessionCookie: [], csrfHeader: [] }, { bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/OpaqueJSON' }
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
    delete:
      tags: [portal]
      summary: Delete a model group (admin)
      security: [{ sessionCookie: [], csrfHeader: [] }, { bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
  /api/portal/model-settings/{name}:
    put:
      tags: [portal]
      summary: Set a model's visibility (admin)
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      security: [{ sessionCookie: [], csrfHeader: [] }, { bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/OpaqueJSON' }
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/portal/servers:
    get:
      tags: [portal]
      summary: List AI servers (object-level visibility inside portal.Service)
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
    post:
      tags: [portal]
      summary: Register an AI server
      security: [{ sessionCookie: [], csrfHeader: [] }, { bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/OpaqueJSON' }
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
  /api/portal/servers/{id}:
    description: >
      Per-server management surface. Sub-paths (see api-surface.md):
      energy, admin-groups, applications, agent-token, resource-groups,
      models, certificate, https-switch-override, ping.
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [portal]
      summary: Server detail (ownership-checked, no-existence-leak 404)
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [portal]
      summary: Update a server
      security: [{ sessionCookie: [], csrfHeader: [] }, { bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/OpaqueJSON' }
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
    delete:
      tags: [portal]
      summary: Delete a server
      security: [{ sessionCookie: [], csrfHeader: [] }, { bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
