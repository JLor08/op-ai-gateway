    get:
      tags: [portal]
      summary: Vendor accounts the caller may add to a resource group
      description: >
        Exactly what the PUT above would accept: the full accounts the caller
        operates (their own and the ones they co-manage) under the group's root,
        sorted by name then id; accounts already in the group are included so a
        picker shows the selection. Gated by the group (404 resource_group.not_found)
        and, like the PUT, a 409 while the module or sharing switch is off.
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: The candidate accounts (credential-free id and name only)
          content:
            application/json:
              schema:
