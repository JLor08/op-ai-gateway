# SPDX-License-Identifier: AGPL-3.0-only
# Copyright (C) 2026 OnPrem AI Gateway contributors
#
# Machine-readable index of the gateway's HTTP surface. The canonical prose
# reference — auth modes, scopes, object-level authorization, dual-mux agent
# dispatch — is api-surface.md in this directory; keep both in sync (routes
# are registered in gateway/backend/internal/gateway/server.go).
#
# Scope: this spec is deliberately PATH-LEVEL. It lists every registered
# route with its verified methods, auth requirements, and purpose. Request/
# response bodies are typed loosely (the DTOs live in the Go code and change
# with it); only small, stable payloads are modeled as concrete schemas.
# Sub-resources that api-surface.md summarizes as "+ sub-paths" are
# enumerated in the parent path's description instead of being guessed here.
openapi: 3.1.0
info:
  title: OnPrem AI Gateway HTTP API
  version: 0.1.0
  description: >
    HTTP surface of the OnPrem AI Gateway: OpenAI/Anthropic-compatible
    inference endpoints, the portal application API, system administration,
    and the ServerAgent ingest API. Error responses use the stable-code
    envelope `{"error":{"code","message","request_id?"}}`. Session-based
    non-GET/HEAD/OPTIONS requests additionally require the `X-OP-CSRF: 1`
    header. See docs/architecture/reference/api-surface.md for the canonical
    description of auth modes, scopes, and object-level authorization.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only

servers:
  - url: http://127.0.0.1:8080
    description: Local development gateway (make run-gateway / make dev)
  - url: /
    description: >
      Bundled deployment — nginx proxies /api/, /v1/, /openai/, /anthropic/,
      /healthz, and the ACME challenge path to the backend and serves the SPA
      at /portal/.

tags:
  - name: inference
    description: OpenAI/Anthropic/Codex/Claude-Code-compatible endpoints
  - name: auth
    description: Login, logout, session state, invite-token password set
  - name: portal
    description: Authenticated application API (/api/portal/*)
  - name: system
    description: System administration (scope `system` = system_admin role + step-up elevation)
  - name: agent
    description: ServerAgent ingest and distribution (/api/agent/v1/*, agent-token bearer)
  - name: health
    description: Liveness and public infrastructure endpoints

security: []

paths:
  # ── 1. Inference / compatibility ─────────────────────────────────────────
  /v1/chat/completions:
    post:
      tags: [inference]
      summary: OpenAI-compatible chat completions (streaming supported)
      description: >
        Session-or-bearer, scope `gateway:use` or `llm:invoke`. The only
        inference path that also accepts the portal session (portal chat runs
        use it over the internal loopback path). Alias: /openai/v1/chat/completions.
      security: [{ bearerAuth: [] }, { sessionCookie: [], csrfHeader: [] }]
      requestBody: { $ref: '#/components/requestBodies/OpaqueJSON' }
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /openai/v1/chat/completions:
    post:
      tags: [inference]
      summary: Alias of /v1/chat/completions
      security: [{ bearerAuth: [] }, { sessionCookie: [], csrfHeader: [] }]
      requestBody: { $ref: '#/components/requestBodies/OpaqueJSON' }
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/responses:
    post:
      tags: [inference]
      summary: OpenAI Responses API (Codex)
      description: >
        Bearer-only, scope `gateway:use` or `llm:invoke`. Attempts native
        passthrough to an upstream that speaks the Responses API before
        falling back to translation. Alias: /openai/v1/responses.
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/OpaqueJSON' }
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /openai/v1/responses:
    post:
      tags: [inference]
      summary: Alias of /v1/responses
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/OpaqueJSON' }
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/messages:
    post:
      tags: [inference]
      summary: Anthropic Messages API (Claude Code)
      description: >
        Bearer-only, scope `gateway:use` or `llm:invoke`. Native passthrough
        when the target application supports it — the only path where
        Anthropic streaming works end-to-end. Alias: /anthropic/v1/messages.
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/OpaqueJSON' }
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /anthropic/v1/messages:
    post:
      tags: [inference]
      summary: Alias of /v1/messages
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/OpaqueJSON' }
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/images/generations:
    post:
      tags: [inference]
      summary: OpenAI-compatible image generation (relay only, no translate path)
      description: >
        Scope `gateway:use` or `llm:invoke`. Authenticates with a bearer token
        OR the internal trusted-loopback header pair (X-OP-Internal-Auth +
        X-OP-Internal-User, blanked by nginx at the public edge and therefore
        unreachable by any external client, which is why only bearerAuth is
        modelled below); a portal session cookie is never accepted here.
        Always relayed to a natively image-shaped upstream; there is no
        translate fallback.
        Admission takes an application that declares the `openai_images` API
        flavor (otherwise 404 `routing.no_model_route`) and a mapping whose
        `image` verdict is `yes` (otherwise 404 `routing.model_not_capable`);
        an agent-launched model's runtime spec must declare the flavor too
        (otherwise 404 `routing.no_model_route`). Non-streaming only (a `stream: true`
        is refused with 400 `images.stream_unsupported`), and
        `response_format` must be `b64_json` or absent (400
        `images.response_format_unsupported` otherwise). Metered in images
        (`billing_unit: image`), not in tokens. Beyond those two it answers the
        same statuses as every other inference path (429/402 from the principal
        limiter, 503 from the capacity queue or no healthy host), which this
        path-level spec does not enumerate for any of them. Alias:
        /openai/v1/images/generations.
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/OpaqueJSON' }
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /openai/v1/images/generations:
    post:
      tags: [inference]
      summary: Alias of /v1/images/generations
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/OpaqueJSON' }
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/images/edits:
    post:
      tags: [inference]
      summary: OpenAI-compatible image edit (multipart relay, no translate path)
      description: >
        Same auth as /v1/images/generations: scope `gateway:use` or
        `llm:invoke`, a bearer token OR the internal trusted-loopback header
        pair (unreachable by any external client, which is why only bearerAuth
        is modelled below), never a portal session cookie. The body is
        `multipart/form-data` (the gateway's first multipart request path) and
        is relayed as multipart to a natively image-shaped upstream
        (`sd-server`); there is no translate fallback. Required: `model`,
        `prompt` and at least one non-empty source image under `image` or
        `image[]` (400 `images.model_required`, `images.prompt_required`,
        `images.image_required`); each of `model`, `prompt`, `response_format`,
        `stream` and `mask` may appear once (400 `request.invalid`), and a body
        that is not a well-formed multipart form is 400 `request.invalid`.
        Admission takes an application that declares the `openai_images` API
        flavor (otherwise 404 `routing.no_model_route`) and a mapping whose
        `image_edit` capability holds (404 `routing.model_not_capable`
        otherwise). That capability is derived: it holds wherever `image` is
        `yes`, unless an operator set an `image_edit: no` verdict on the
        mapping. An agent-launched model's runtime spec must declare the flavor
        too, and its agent must declare the `multipart_proxy` feature, else
        404 `images.edit_unavailable`. Non-streaming only (a `stream` of
        `true` is 400 `images.stream_unsupported`), and `response_format` must
        be `b64_json` or absent (400 `images.response_format_unsupported`).
        An OpenAI-style `mask` (an RGBA PNG whose TRANSPARENT pixels mark the
        region to edit) is converted to the luminance mask sd-server reads; it
        must be a PNG of exactly the first source image's size, at most 16
        megapixels, with at least one transparent pixel (400
        `images.mask_invalid`; 400 `images.edit_unsupported_format` for a mask
        that is not a readable PNG, or, when a mask is sent, a source that is
        not a readable PNG or JPEG). The whole body is held in memory and
        capped by `OP_AI_GATEWAY_MAX_IMAGE_EDIT_BODY_BYTES` (default 32 MiB;
        413 `request.body_too_large`); a body bound for an agent-launched model
        is checked against the agent's own 32 MiB after the gateway has
        prepared it, with the same refusal. Metered in output images
        (`billing_unit: image`); input images and the mask are not metered.
        Beyond those it answers the same statuses as every other inference
        path (429/402 from the principal limiter, 503 from the capacity queue
        or no healthy host), which this path-level spec does not enumerate.
        Alias: /openai/v1/images/edits.
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/ImageEditForm' }
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /openai/v1/images/edits:
    post:
      tags: [inference]
      summary: Alias of /v1/images/edits
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/ImageEditForm' }
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/messages/count_tokens:
    post:
      tags: [inference]
      summary: Anthropic token counting (no upstream inference, no billing)
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/OpaqueJSON' }
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /anthropic/v1/messages/count_tokens:
    post:
      tags: [inference]
      summary: Alias of /v1/messages/count_tokens
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/OpaqueJSON' }
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/models:
    get:
      tags: [inference]
      summary: OpenAI-shaped model listing
      description: >
        Bearer-only (scope `gateway:use` or `llm:invoke`). Discovery is
        unfiltered by a service token's own allowlist but IS filtered by
        resource-group provisioning visibility. Each entry carries the
        model's usable context window as `context_length` when it is known;
        the field is omitted, never 0, when no mapping reports one. Alias:
        /openai/v1/models.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The models offered under the `openai` flavor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpenAIModelList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /openai/v1/models:
    get:
      tags: [inference]
      summary: Alias of /v1/models
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The models offered under the `openai` flavor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpenAIModelList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /anthropic/v1/models:
    get:
      tags: [inference]
      summary: Anthropic-shaped model listing
      description: Bearer-only, scope `gateway:use`.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/models:
    get:
      tags: [inference]
      summary: LM Studio v2-shaped model listing (emulated metadata only)
      description: >
        The native listing LM Studio's own clients read each model's context
        window from; actual chat still goes over /v1/chat/completions.
        Bearer-only (scope `gateway:use` or `llm:invoke`), and it lists
        exactly the names /v1/models lists. Unlike /v1/models,
        `max_context_length` is always present (0 when the window is
        unknown). Alias: /openai/api/v1/models (there is no /anthropic/
        variant). LM Studio's earlier /api/v0/models is not served and
        answers 404.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The models offered under the `openai` flavor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LMStudioModelList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /openai/api/v1/models:
    get:
      tags: [inference]
      summary: Alias of /api/v1/models
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The models offered under the `openai` flavor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LMStudioModelList' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ── 2. Auth ───────────────────────────────────────────────────────────────
  /api/auth/login:
    post:
      tags: [auth]
      summary: Password login; sets the session cookie on success
      description: 'Public, but requires the `X-OP-CSRF: 1` header.'
      security: [{ csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/auth/logout:
    post:
      tags: [auth]
      summary: Clears the current session
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
  /api/auth/session:
    get:
      tags: [auth]
      summary: Current auth state (never errors on "not logged in")
      description: >
        Reports `authenticated`, the current-user DTO, and the default
        language — used by the SPA on load.
      security: []
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
  /api/auth/set-password:
    post:
      tags: [auth]
      summary: Consume a one-time set-password/invite token to set a password
      security: [{ csrfHeader: [] }]
      requestBody: { $ref: '#/components/requestBodies/OpaqueJSON' }
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }

  # ── 3. Portal: account, session, preferences ─────────────────────────────
  /api/portal/me:
    get:
      tags: [portal]
      summary: Current user DTO (role, elevation state, TOTP mode, …)
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/portal/password:
    post:
      tags: [portal]
      summary: Change own password (CSRF-enforced)
      security: [{ sessionCookie: [], csrfHeader: [] }, { bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/OpaqueJSON' }
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
  /api/portal/language:
    get:
      tags: [portal]
      summary: Own preferred language
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
    put:
      tags: [portal]
      summary: Set own preferred language
      security: [{ sessionCookie: [], csrfHeader: [] }, { bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/OpaqueJSON' }
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
  /api/portal/currency:
    get:
      tags: [portal]
      summary: System-wide EUR→USD display factor
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
  /api/portal/preferences:
    get:
      tags: [portal]
      summary: All own per-key UI preferences
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
  /api/portal/preferences/{key}:
    parameters:
      - { name: key, in: path, required: true, schema: { type: string } }
    get:
      tags: [portal]
      summary: One opaque per-key UI preference
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
    put:
      tags: [portal]
      summary: Set one opaque per-key UI preference
      security: [{ sessionCookie: [], csrfHeader: [] }, { bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/OpaqueJSON' }
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
  /api/portal/chat-settings:
    put:
      tags: [portal]
      summary: Own default chat run settings
      security: [{ sessionCookie: [], csrfHeader: [] }, { bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/OpaqueJSON' }
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
  /api/portal/system-admin-mode:
    post:
      tags: [portal]
      summary: Enter System-Admin step-up elevation
      description: >
        Requires role `system_admin`; may require re-entering the password
        per system setting.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody: { $ref: '#/components/requestBodies/OpaqueJSON' }
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [portal]
      summary: Leave System-Admin step-up elevation
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
  /api/portal/totp:
    get:
      tags: [portal]
      summary: TOTP 2FA status
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
    delete:
      tags: [portal]
      summary: Disable TOTP 2FA
      security: [{ sessionCookie: [], csrfHeader: [] }, { bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
  /api/portal/totp/{action}:
    post:
      tags: [portal]
      summary: TOTP enroll/confirm
      parameters:
        - { name: action, in: path, required: true, schema: { type: string, enum: [enroll, confirm] } }
      security: [{ sessionCookie: [], csrfHeader: [] }, { bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/OpaqueJSON' }
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }

  # ── 3. Portal: tokens, chats, usage ───────────────────────────────────────
  /api/portal/tokens:
    description: >
      Own API tokens. Besides the model-settings fields, a token carries a
      vendor_access policy (see the TokenVendorAccess schema): which of the
      owner's vendor ("Anbieter") accounts the token may use. Strict opt-in:
      a token without the field has NO vendor access. The same field is
      writable on create and update and readable on the list.
    get:
      tags: [portal]
      summary: List own API tokens (each row carries vendor_access when the token has any)
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: >
            The caller's tokens, the synthetic non-deletable chat-session row
            first. vendor_access is omitted for a token with no vendor access
            (and for the chat-session row, whose session always sees all of
            the owner's accounts). Other row fields are defined by the Go DTO
            (see api-surface.md).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      properties:
                        vendor_access: { $ref: '#/components/schemas/TokenVendorAccess' }
    post:
      tags: [portal]
      summary: Create an API token (optionally with a vendor_access policy)
      description: >
        An absent vendor_access is the strict default (no vendor access). A
        supplied policy with all=false is validated against the caller's own
        accounts: an unknown, foreign or repeated account id, or an enabled
        override prefix that is not a valid model prefix, is a 400
        portal.token_vendor_access_invalid; two selected accounts whose
        effective public model names collide is a 400
        portal.token_vendor_access_conflict. all=true is stored without
        per-account validation. A failure to read the caller's accounts is a
        500, not one of these; a failure to read one account's models is
        logged and skipped.
      security: [{ sessionCookie: [], csrfHeader: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: >
                Token fields as defined by the Go DTO (see api-surface.md);
                only vendor_access is modeled here.
              additionalProperties: true
              properties:
                vendor_access: { $ref: '#/components/schemas/TokenVendorAccess' }
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/portal/tokens/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      tags: [portal]
      summary: Update an own API token (vendor_access replaces the stored policy wholesale)
      description: >
        An absent vendor_access keeps the stored policy; a present one
        REPLACES it wholesale (an empty one resets to the strict default of no
        vendor access) after the same validation as on create
        (portal.token_vendor_access_invalid / portal.token_vendor_access_conflict,
        both 400).
      security: [{ sessionCookie: [], csrfHeader: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: >
                Token fields as defined by the Go DTO (see api-surface.md);
                only vendor_access is modeled here.
              additionalProperties: true
              properties:
                vendor_access: { $ref: '#/components/schemas/TokenVendorAccess' }
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
        '400': { $ref: '#/components/responses/BadRequest' }
    delete:
      tags: [portal]
      summary: Delete an own API token
      security: [{ sessionCookie: [], csrfHeader: [] }, { bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
  /api/portal/tokens/{id}/rotate:
    post:
      tags: [portal]
      summary: Rotate an own API token
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      security: [{ sessionCookie: [], csrfHeader: [] }, { bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
  /api/portal/chats:
    get:
      tags: [portal]
      summary: List own portal chats
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
    post:
      tags: [portal]
      summary: Create a portal chat
      security: [{ sessionCookie: [], csrfHeader: [] }, { bearerAuth: [] }]
