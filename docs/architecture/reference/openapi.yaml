  # ── 5. Agent (/api/agent/v1/*, agent-token bearer, dual-mux) ─────────────
  /api/agent/v1/telemetry:
    post:
      tags: [agent]
      summary: Ingest one telemetry sample (POST transport)
      security: [{ agentToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TelemetrySample' }
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/agent/v1/stream:
    get:
      tags: [agent]
      summary: Persistent telemetry stream (WebSocket upgrade)
      description: >
        WebSocket transport for telemetry plus server-pushed doorbells
        (e.g. certificate updates). Two frames carry payloads rather than
        acting as doorbells: gateway to agent `runtime_config` (the COMPLETE
        runtime-config document plus its etag, best-effort, never a delta) and
        agent to gateway `runtime_report` (no per-frame ack; a malformed frame
        is skipped with the connection kept open, an unknown server closes with
        1008, a store error with 1011).
      security: [{ agentToken: [] }]
      responses:
        '101': { description: Switching Protocols (WebSocket) }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/agent/v1/system-report:
    post:
      tags: [agent]
      summary: Ingest the static hardware inventory report
      security: [{ agentToken: [] }]
      requestBody: { $ref: '#/components/requestBodies/OpaqueJSON' }
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/agent/v1/certificate:
    get:
      tags: [agent]
      summary: Fetch the agent's current mesh leaf certificate (cert modes files/proxy)
      security: [{ agentToken: [] }]
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/agent/v1/ca:
    get:
      tags: [agent]
      summary: Fetch the internal CA bundle
      security: [{ agentToken: [] }]
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/agent/v1/proxy-routes:
    get:
      tags: [agent]
      summary: Gateway-provided TLS proxy route topology (cert mode proxy)
      security: [{ agentToken: [] }]
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/agent/v1/features:
    get:
      tags: [agent]
      summary: The gateway's declared feature list (capability negotiation)
      description: >
        {"features":[...]}. ETag-conditional; the validator is carried in the
        ETag HEADER ONLY (no in-body etag field), unlike /runtime-config. A 404
        from an older gateway is not an error — the agent reads it as the empty
        feature set. Cache-Control: no-store.
      security: [{ agentToken: [] }]
      parameters:
        - { name: If-None-Match, in: header, required: false, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
        '304': { description: Not modified (empty body) }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/agent/v1/runtime-config:
    get:
      tags: [agent]
      summary: Desired agent-managed runtime state for the caller's own server
      description: >
        The server id comes only from the agent token, never a parameter.
        ETag-conditional; the validator appears BOTH in the ETag header
        (quoted) and as an in-body `etag` field, because the same document is
        also pushed as a WebSocket `runtime_config` frame that has no headers.
        A server with no server_agent application gets a fully zeroed document
        as a normal 200, never an error. Cache-Control: no-store.
      security: [{ agentToken: [] }]
      parameters:
        - { name: If-None-Match, in: header, required: false, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
        '304': { description: Not modified (empty body) }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/agent/v1/runtime-report:
    post:
      tags: [agent]
      summary: Ingest a file-mode agent's effective runtime configuration
      description: >
        Env values, a literal api_token and config-file content are already
        masked agent-side; the gateway re-masks structurally as defence in
        depth (its ingest type carries neither api_token nor config_files,
        so both are dropped on arrival). An empty or unparseable config
        degrades rather than rejecting the report. Answers
        {"accepted":true,"server_id":"..."}.
      security: [{ agentToken: [] }]
      requestBody: { $ref: '#/components/requestBodies/OpaqueJSON' }
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/agent/v1/download/{path}:
    get:
      tags: [agent]
      summary: Download a ServerAgent release binary/manifest/config
      description: Fetched by operators or scripts; the agent does not update itself.
      parameters:
        - { name: path, in: path, required: true, schema: { type: string } }
      security: [{ agentToken: [] }]
      responses:
        '200': { description: Binary/manifest/config stream }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── 6. Health & public infrastructure ─────────────────────────────────────
  /healthz:
    get:
      tags: [health]
      summary: Liveness probe (always HTTP 200 with ok=true)
      description: >
        Registered on both the public mux and the agent mux; the Docker
        healthcheck keys off the status code only. A degraded usage store is
        surfaced as ADDITIONAL fields, never as a non-200.
      security: []
      responses:
        '200':
          description: Service is live
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Healthz' }
  /.well-known/acme-challenge/{token}:
    get:
      tags: [health]
      summary: ACME HTTP-01 challenge response
      description: >
        Public mux only — deliberately reachable over plaintext regardless of
        any HTTPS-require gate, since an ACME order cannot use TLS to prove
        domain control.
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      security: []
      responses:
        '200': { description: Key authorization }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: op_ai_gateway_session
      description: >
        Browser session. Non-GET/HEAD/OPTIONS requests additionally require
        the X-OP-CSRF header (modeled as csrfHeader).
    csrfHeader:
      type: apiKey
      in: header
      name: X-OP-CSRF
      description: 'CSRF guard header; send the literal value "1".'
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        User API token or service token. Scopes (enforced server-side, not
        via OAuth): gateway:use, llm:invoke, admin, system.
    agentToken:
      type: http
      scheme: bearer
      description: >
        Per-AI-server agent secret (hashed lookup against agent_tokens),
        unrelated to user/service API tokens.
  requestBodies:
    OpaqueJSON:
      required: true
      content:
        application/json:
          schema:
            type: object
            description: >
              DTO defined by the Go handler (see api-surface.md and the
              gateway source); intentionally not duplicated here.
    ImageEditForm:
      required: true
      description: >
        The multipart form of POST /v1/images/edits. Fields not named here
        reach the upstream unexamined, exactly as the generations endpoint
        treats the fields of its JSON body.
      content:
        multipart/form-data:
          schema:
            type: object
            required: [model, prompt]
            properties:
              image:
                type: string
                format: binary
                description: >
                  The source image. sd-server's edit route reads PNG and JPEG
                  only; the gateway passes the source through without checking
                  its type, except that a source sent with a mask must be a
                  readable PNG or JPEG (400 `images.edit_unsupported_format`).
                  Either this or `image[]` must carry at least one non-empty
                  part. Further `image[]` parts are references.
              image[]:
                type: array
                items: { type: string, format: binary }
                description: >
                  The repeated spelling of the source image(s); the first
                  non-empty part is the source a mask applies to (when a form
                  carries both spellings, the first `image[]` part wins, as in
                  sd-server).
              mask:
                type: string
                format: binary
                description: >
                  Optional OpenAI-style mask: an RGBA PNG of exactly the first
                  source image's size (at most 16 megapixels) whose
                  TRANSPARENT pixels mark the region to regenerate. Needs at
                  least one transparent pixel. The gateway converts it to the
                  luminance mask sd-server reads (white = regenerate), so the
                  edit is relayed as a rebuilt multipart body.
              model:
                type: string
                description: >
                  The gateway model name. Routing input; the gateway rewrites
                  the field to the mapping's own model name for the upstream.
              prompt:
                type: string
                description: >
                  What to edit. sd-server's native knobs ride in a trailing
                  `<sd_cpp_extra_args>{...}</sd_cpp_extra_args>` block, which is
                  also where an edit's `strength` goes
                  (`{"strength":0.9}`, sd-server's default is 0.75; a higher
                  value changes the image more). sd-server's edits route reads
                  no `strength` form field of its own.
              n:
                type: integer
                description: Number of images to produce.
              size:
                type: string
                description: >
                  Output size such as `1024x1024`. When absent sd-server derives
                  it from the source image.
              response_format:
                type: string
                enum: [b64_json]
                description: Only `b64_json` (or absent) is supported.
              output_format:
                type: string
                enum: [png, jpeg]
                description: >
                  The edit route produces png or jpeg only (a generation also
                  produces webp).
              output_compression:
                type: integer
                description: Compression of a jpeg output.
    SpeechRequest:
      required: true
      description: >
        The JSON body of POST /v1/audio/speech. Only the fields named here are
        examined by the gateway (`language` is named for documentation and is
        relayed unexamined); any other (`instructions`, `speed`, ...) reaches
        the upstream unexamined.
      content:
        application/json:
          schema:
            type: object
            required: [model, input]
            properties:
              model:
                type: string
                description: >
                  The gateway model name. Routing input; the gateway rewrites
                  the field to the mapping's own model name for the upstream.
              input:
                type: string
                minLength: 1
                description: The text to synthesize. Must be non-empty.
              voice:
                type: string
                description: >
                  The voice name, passed to the upstream as sent. The names a
                  model accepts are listed by `GET /v1/audio/voices` (the
                  gateway's cache of audio.cpp's own listing). It is also read,
                  never changed, as a fail-open routing preference: when some
                  candidate's cached list offers it, routing is restricted to
                  the candidates that do, otherwise it is unfiltered, so a
                  free-text or unknown voice still reaches the upstream, which
                  answers an unknown voice with HTTP 500.
              language:
                type: string
                description: >
                  The transcript language (for example `de`), passed to the
                  upstream as sent and never read by the gateway. audio.cpp
                  applies it per model, as the language of the text frontend, and
                  silently drops it for a model that declares no `language`
                  request param, so it may be sent unconditionally. A model's
                  own default differs (`auto` detects it from the text; a fixed
                  code such as `zh` does not). audio.cpp states only the default,
                  never the accepted values, so the gateway validates none. The
                  portal's speech composer offers it where
                  GET /api/portal/model-speech-language says the model takes one
                  (ADR-074).
              response_format:
                type: string
                enum: [wav, pcm]
                description: >
                  `wav`, `pcm` or absent (or `null`) for a request that does
                  not stream; `pcm` (or absent) for one that streams, because
                  audio.cpp serves streaming only as headerless PCM. On a
                  request that does not stream `pcm` is the upstream WAV with
                  its header stripped: raw signed 16-bit little-endian mono PCM
                  at the model's native sample rate (not stated on the wire),
                  `application/octet-stream`, refused after synthesis with 502
                  `speech.pcm_unavailable` when the clip is not 16-bit
                  mono PCM, is structurally unsound, over-declares its
                  data length, or carries no usable `Content-Length`.
                  `wav` beside `stream: true` is 400
                  `speech.stream_unsupported`, and every other value (`mp3`,
                  `opus`, `flac`, `aac`, `json`, `b64_json`) is 400
                  `speech.response_format_unsupported`. A route that is not
                  known to stream answers a stream request with a buffered WAV
                  whatever this says.
              stream:
                type: boolean
                description: >
                  `true` is served as an unbuffered stream when the mapped
                  model is `mode=streaming` (its `speech_streaming` verdict is
                  `yes`) and as one buffered `audio/wav` clip otherwise;
                  `false` or absent takes the one-shot. A non-boolean value is
                  400 `speech.stream_unsupported`.
              stream_format:
                type: string
                enum: [sse, audio]
                description: >
                  The shape of a streamed answer, relayed as audio.cpp emits it:
                  `sse` (the default) is an event stream, `audio` is raw
                  headerless PCM. Only meaningful with `stream: true`; on a
                  request that does not stream, or with any other value, it is
                  400 `speech.stream_unsupported`. `null` is absent.
    TranscriptionForm:
      required: true
      description: >
        The multipart form of POST /v1/audio/transcriptions. Only the fields
        named here are examined by the gateway; any other (`temperature`,
        `timestamp_granularities[]`, ...) reaches the upstream unexamined, as
        do `language` and `prompt`, which the gateway reads but does not check.
      content:
        multipart/form-data:
          schema:
            type: object
            required: [model, file]
            properties:
              file:
                type: string
                format: binary
                description: >
                  The audio to transcribe. Exactly one non-empty part with this
                  name is required (400 `transcription.file_required` for none,
                  400 `transcription.invalid` for more than one). Only `file`
                  counts; there is no `file[]` spelling. An empty `file` part
                  beside the real one is accepted and dropped before the relay.
              model:
                type: string
                description: >
                  The gateway model name. Routing input; the gateway rewrites
                  the field to the mapping's own model name for the upstream,
                  which means the form is rebuilt when the two differ.
              language:
                type: string
                description: Passed to the upstream as sent.
              prompt:
                type: string
                description: Passed to the upstream as sent.
              response_format:
                type: string
                enum: [json]
                description: >
                  Only `json` (or absent) is supported; every other value,
                  `verbose_json`, `text`, `srt` and `vtt` included, is 400
                  `transcription.response_format_unsupported`.
              stream:
                type: boolean
                description: >
                  `true` is served as an unbuffered SSE relay when the model is
                  `mode=streaming` (the `transcription_streaming` verdict is
                  `yes`), and served buffered otherwise; `false` or absent takes
                  the buffered one-shot. A non-boolean value is 400
                  `transcription.stream_unsupported`.
              stream_format:
                type: string
                description: >
                  Not supported. Any non-empty value is 400
                  `transcription.stream_unsupported`.
  responses:
    OpaqueJSON:
      description: >
        JSON DTO defined by the Go handler (see api-surface.md); errors use
        the Error envelope with a stable code.
      content:
        application/json:
          schema: { type: object }
    AudioWav:
      description: >
        The synthesized clip. A one-shot answer is one binary `audio/wav` body,
        streamed through without being buffered, with the upstream's
        `Content-Length` forwarded when it declared one, or, for
        `response_format: pcm`, the WAV's `data` chunk alone as headerless
        `application/octet-stream` (the `Content-Length` is the data size);
        the upstream's metering
        headers (`X-AudioCPP-*`) are not forwarded, and the gateway reads
        `X-AudioCPP-Audio-Duration-Ms` for the usage row. A STREAMED answer (a
        `mode=streaming` model asked with `stream: true`) is instead
        `text/event-stream` or `application/octet-stream`, chunked and without a
        `Content-Length`, relayed byte for byte and billed from the PCM bytes
        counted on a clean completion.
      content:
        audio/wav:
          schema: { type: string, format: binary }
        text/event-stream:
          schema:
            type: string
            description: >
              The streamed case with `stream_format: sse` (the default):
              audio.cpp's frames `speech.audio.delta` (base64 PCM, signed 16-bit
              little-endian mono, in `audio`) -> `speech.audio.done` (only
              `timing.ttft_ms`) -> `[DONE]`. The stream states no sample rate
              and no duration.
        application/octet-stream:
          schema:
            type: string
            format: binary
            description: >
              Headerless raw PCM (signed 16-bit little-endian mono), no
              container and no duration: the streamed case with
              `stream_format: audio`, and a one-shot `response_format: pcm`
              answer (the upstream WAV's data chunk, at the model's native
              sample rate, which the response does not state).
    AudioVoices:
      description: >
        The voice names cached for the model, as the deduplicated, sorted union
        across the mappings the token can reach, or an empty list for every
        "nothing to show" case. `voices` is never null. Each name is exactly
        what a speech request's `voice` field takes.
      content:
        application/json:
          schema:
            type: object
            required: [model, voices]
            properties:
              model:
                type: string
                description: The model name exactly as the client asked for it.
              voices:
                type: array
                items: { type: string }
    Transcription:
      description: >
        The buffered 200 is audio.cpp's transcription document, written through
        verbatim: `{"text": "...", "timing": {"wall_ms": ...,
        "audio_duration_ms": ..., "rtf": ...}}`. `timing` is an audio.cpp
        extension that the gateway keeps (OpenAI clients ignore unknown fields)
        and reads for the usage row. A STREAMED 200 (a `mode=streaming` model
        asked with `stream: true`) is instead `text/event-stream`: audio.cpp's
        own SSE, `transcript.text.delta` (incremental) -> `transcript.text.done`
        (the full `text` plus `timing.ttft_ms`, no `audio_duration_ms`) ->
        `[DONE]`, relayed unbuffered and billed from the uploaded WAV header.
      content:
        application/json:
          schema:
            type: object
            required: [text]
            properties:
              text:
                type: string
                description: The transcript.
              timing:
                type: object
                description: >
                  audio.cpp's own timing block. `audio_duration_ms` is the input
                  audio's duration in milliseconds, which the gateway bills as
                  `audio_second` (divided by 1000).
                properties:
                  wall_ms: { type: number }
                  audio_duration_ms: { type: number }
                  rtf: { type: number }
        text/event-stream:
          schema:
            type: string
            description: >
              The streamed case: audio.cpp's SSE frames `transcript.text.delta`
              -> `transcript.text.done` -> `[DONE]`, relayed byte for byte.
    BadRequest:
      description: >
        Invalid request payload — the Error envelope carries the stable
        validation code (see api-surface.md).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    OkTrue:
      description: The operation was applied (or already held); the body is ok true.
      content:
        application/json:
          schema:
            type: object
            required: [ok]
            properties:
              ok: { type: boolean }
    ChatRunActive:
      description: >
        A run is active for the chat -- the Error envelope carries
        portal.chat_run_active. Refused because the call replaces or rewrites the
        chat's whole stored document, which the live run owns (it would
        overwrite the run's checkpoint or terminal commit). The same refusal
        PUT /api/portal/chats/{id} answers. Retry once the run has finished.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    VendorAccountsUnavailable:
      description: >
        The vendor-accounts feature refuses the operation -- the Error envelope
        carries the stable code: vendor_accounts.module_disabled while the
        vendor_accounts_enabled master flag is off,
        vendor_accounts.subscriptions_disabled while the
        vendor_subscriptions_enabled switch is off and the operation creates or
        connects a subscription account,
        vendor_accounts.sharing_disabled while the
        vendor_account_sharing_enabled switch (default off) is off and the
        operation is a share-level, management-group or resource-group one (it is
        answered before any account or group is read, so it reveals nothing), or
        vendor_accounts.subscription_sharing_disabled when raising a subscription
        account while vendor_subscription_sharing_enabled is off. The
        subscriptions code is checked late (on a connect after the owner and
        subscription-only checks, on a create after the request validation), so
        a stranger still gets 404, an api-key account is never refused with it,
        and a malformed request keeps its 400.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    SSE:
      description: Server-sent event stream
      content:
        text/event-stream:
          schema: { type: string }
    Unauthorized:
      description: Missing/invalid credential
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated but lacking the required scope/role
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: >
        Not found — also returned for objects outside the caller's manageable
        set (no-existence-leak policy).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServiceUnavailable:
      description: >
        Temporarily refused — the Error envelope carries the stable code (see
        api-surface.md).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      description: Stable-code error envelope (internal/apierror).
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable code, e.g. request.not_found, auth.invalid_token
            message: { type: string }
            request_id: { type: string }
    ChatAudioSettings:
      type: object
      description: >
        The speech thread's knobs, stored under settings.audio of the chat
        document and sent under settings.audio of a run start (portal.ChatAudioSettings).
        Cleared server-side for every non-speech kind. Every member is optional
        and omitted when unset, so an existing chat's stored bytes do not move.
      properties:
        voice:
          type: string
          description: The voice name. Absent leaves the model on its default voice.
        speed:
          type: number
          description: Speech speed, passed through as given. The model applies its own range.
        passthrough:
          type: object
          additionalProperties: true
          description: >
            Advanced JSON merged into the speech request body. The keys model,
            input, stream, stream_format and response_format are reserved.
        stream:
          type: boolean
          description: >
            The thread's choice to hear the audio while it is generated.
            Default on; only an explicit false is stored (ADR-068).
        keep_last_audio:
          type: integer
          description: >
            The thread's retention of its assistant audio answers (ADR-071),
            three-valued. ABSENT keeps every answer (the default, and what a
            chat from before this field reads as). An integer N >= 1 keeps the
            audio of the newest N answers: when a new answer is committed, older
            answers beyond N are rewritten to the audio_removed marker and their
            blobs deleted in the same atomic commit. 0 stores no answer audio
            (the portal offers it only for a thread that streams): a run that
            streamed commits the answer as the marker with no blob, while a run
            that fell back to a buffered clip stores that one answer anyway (a
            paid answer that was never heard live must not vanish) and it
            supersedes any older stored audio of the chat. N counts answers, not
            blobs. A negative value is read as absent. It is never sent upstream.
        language:
          type: string
          description: >
            The language to speak in (an ISO-639-1-style code such as `de`),
            merged into the speech request as a top-level `language` when
            non-empty (ADR-074). Free text: audio.cpp publishes no accepted-value
            list, so the gateway validates none, and it silently drops the field
            for a model that takes none. Absent leaves the model on its own
            default. The portal composer offers it only for a model
            GET /api/portal/model-speech-language says takes one, and
            pre-fills an empty thread with the UI language when the model's
            declared default is not `auto`. A first-class language wins over a
            `language` key of the passthrough object. Declared after
            keep_last_audio, so an existing chat's stored bytes do not move.
    ChatAudioPruneRequest:
      type: object
      description: The body of POST /api/portal/chats/{id}/audio/prune.
      required: [keep_last]
      properties:
        keep_last:
          type: integer
          minimum: 0
          description: >
            How many of the newest answers that hold audio keep it; 0 removes all
            stored audio of the chat. Missing, null or negative is 400
            portal.chat_audio_keep_last_invalid.
    LiveTranscriptionTicketRequest:
      type: object
      description: The body of POST /api/portal/transcription-live-ticket.
      required: [model, sample_rate, channels, sample_format]
      properties:
        model:
          type: string
          minLength: 1
          description: The gateway model name (trimmed); blank is 400 `model.name_required`.
        sample_rate:
          type: integer
          minimum: 1000
          maximum: 384000
          description: The PCM sample rate in Hz the browser will stream (audio.cpp's own range).
        channels:
          type: integer
          minimum: 1
          maximum: 16
          description: The number of interleaved channels (audio.cpp's own range).
        sample_format:
          type: string
          enum: [s16le, f32le]
          description: >
            The sample encoding, 2 bytes per sample for `s16le` and 4 for `f32le`.
            The validated triple is forwarded to the backend AND is the rate the
            session bills at.
        language:
          type: string
          maxLength: 64
          pattern: '^[A-Za-z0-9_-]*$'
          description: Optional language tag or name; empty lets the backend detect the language.
    VoiceChatTicketRequest:
      type: object
      description: The body of POST /api/portal/voice-chat-ticket.
      required: [chat_id, asr_model, llm_model, tts_model]
      properties:
        chat_id:
          type: string
          description: >
            The portal chat the spoken turns are committed to. It must be the caller's
            own (owner-scoped): a blank, unknown or another user's chat is 404
            `portal.chat_not_found`, before any model is started. The chat's stored
            speech settings (`settings.audio`) are snapshotted into the ticket; a text
            thread carries none, so the speech model speaks in its default language (and
            in the voice the request names, or its own default voice).
        asr_model:
          type: string
          minLength: 1
          description: >
            The gateway model name (trimmed) of the live-transcription leg; blank is 400
            `model.name_required`. It must be a streaming transcription model.
        llm_model:
          type: string
          minLength: 1
          description: >
            The gateway model name (trimmed) of the chat leg; blank is 400
            `model.name_required`. It must serve chat.
        tts_model:
          type: string
          minLength: 1
          description: >
            The gateway model name (trimmed) of the speech leg; blank is 400
            `model.name_required`. It must be an offerable streaming speech model.
        voice:
          type: string
          description: >
            Optional (issue #318): the voice the speech model answers in, trimmed; blank
            or absent is none. When it names one it becomes the ticket's speech voice,
            over the stored `settings.audio` voice, and counts against the 1 KiB cap on
            the ticket's speech settings (over it is 400
            `portal.voice_chat_audio_settings_invalid`). With none, a preset-clone speech
            model is minted on its first preset voice (it has no default of its own) and
            any other model speaks in its own default voice.
    ModelCapabilities:
      type: object
      description: >
        The capability flags both /v1/models and /api/v1/models carry per model,
        built by one shared helper so the two listings stay identical (issue
        #222). vision/image/image_edit are the portal's fail-closed AND-folds;
        trained_for_tool_use is always true. vision and trained_for_tool_use are
        the keys the LM Studio v2 shape / opencode read; image and image_edit are
        gateway extensions beyond those two keys.
      required: [vision, image, image_edit, trained_for_tool_use]
      properties:
        vision: { type: boolean, description: True only when every offering mapping accepts image input (fail-closed). }
        image: { type: boolean, description: True only when every offering mapping generates images (fail-closed). }
        image_edit: { type: boolean, description: True only when every offering mapping can edit images (fail-closed). }
        trained_for_tool_use:
          type: boolean
          const: true
          description: >
            Always true: the gateway tracks no per-model tool support
            (ADR-045 (h)); making it truthful is issue #219.
    OriginalModelId:
      type: string
      description: >
        Present ONLY on a generated Claude alias row (a token with the
        claude_model_aliases setting): the real gateway model or group id the
        `anthropic-local-<hash>` id resolves to. A top-level sibling of
        `capabilities`, never nested. The row's display_name is then the honest
        label (the target's own listing label, never a Claude model name). No
        other row, a manual override alias included, carries it.
    OpenAIModelList:
      type: object
      description: The OpenAI-shaped model listing of /v1/models.
      required: [object, data]
      properties:
        object: { type: string, const: list }
        data:
          type: array
          items:
            type: object
            required: [id, object, owned_by, capabilities]
            properties:
              id: { type: string, description: The gateway model name. }
              object: { type: string, const: model }
              owned_by: { type: string, const: op-ai-gateway }
              capabilities: { $ref: '#/components/schemas/ModelCapabilities' }
              context_length:
                type: integer
                minimum: 1
                description: >
                  The model's usable context window in tokens: the minimum
                  known across its offering mappings. Omitted, never 0, when no
                  mapping reports one.
              original_model_id: { $ref: '#/components/schemas/OriginalModelId' }
              display_name:
                type: string
                description: >
                  Present only on a generated Claude alias row: the honest label
                  (the target's own listing label). Ordinary rows carry none.
    LMStudioModelList:
      type: object
      description: >
        The LM Studio v2-shaped model listing of /api/v1/models. Clients decode
        it strictly: `models` and every `loaded_instances` are arrays, never
        null.
      required: [models]
      properties:
        models:
          type: array
          items:
            type: object
            required: [type, key, display_name, max_context_length, loaded_instances, capabilities]
            properties:
              type: { type: string, const: llm }
              key: { type: string, description: The gateway model name (the same ids as /v1/models). }
              display_name: { type: string }
              max_context_length:
                type: integer
                minimum: 0
                description: >
                  The model's usable context window in tokens: the minimum
                  known across its offering mappings. Always present; 0 when
                  unknown.
              loaded_instances:
                type: array
                description: One entry while the model is loaded on an offering server, else empty.
                items:
                  type: object
                  required: [config]
                  properties:
                    config:
                      type: object
                      required: [context_length]
                      properties:
                        context_length: { type: integer, minimum: 0 }
              capabilities: { $ref: '#/components/schemas/ModelCapabilities' }
              original_model_id: { $ref: '#/components/schemas/OriginalModelId' }
    AnthropicModelList:
      type: object
      description: The Anthropic-shaped model listing of /anthropic/v1/models.
      required: [data]
      properties:
        data:
          type: array
          items:
            type: object
            required: [id, type, display_name, created_at]
            properties:
              id: { type: string, description: The gateway model name, or a generated Claude alias id. }
              type: { type: string, const: model }
              display_name:
                type: string
                description: >
                  The id for an ordinary row; the honest label on a generated
                  Claude alias row.
              created_at:
                type: string
                format: date-time
                description: A fixed placeholder; model mappings carry no creation time.
              original_model_id: { $ref: '#/components/schemas/OriginalModelId' }
    TokenVendorAccess:
      type: object
      description: >
        An API token's vendor-account ("Anbieter") access policy, on a user
        token (create and update) and, create-only, on a service token. Strict
        opt-in: a token with no policy (field absent on a response, absent or
        null on create) has no vendor access. all=true lets the token use
        EVERY active account its principal OWNS (future accounts included)
        under each account's own model_prefix; it never covers an account
        shared with the principal, which is used only when an accounts entry
        names it (the per-account opt-in). all=false limits it to the listed
        accounts; an empty list means no vendor access. A response always
        carries accounts as an array. The public model name a token sees for an
        account's model is the effective prefix plus the vendor's own model id,
        in both the model listing and routing.
      properties:
        all: { type: boolean }
        accounts:
          type: array
          items: { $ref: '#/components/schemas/TokenVendorAccessEntry' }
    TokenVendorAccessEntry:
      type: object
      required: [account_id]
      properties:
        account_id:
          type: string
          description: >
            Id of a vendor account (va_...) the token's principal can reach: one it
            owns, or one shared with it through a resource group it is
            provisioned into (for a user token the owning user; for a service
            token the service, provisioned directly into a containing group). The
            save-time check is advisory; routing re-evaluates the grant on every
            request.
        prefix_override:
          type: object
          description: >
            Optional per-token replacement for the account's model_prefix.
            Counts only while enabled is true. enabled with an empty value
            serves the account's models under their original vendor names,
            with no prefix. A non-empty value follows the same rules as
            vendor_account.model_prefix (at most 64 bytes from
            A-Z a-z 0-9 - _ . ~ : / @ +, no "..").
          properties:
            enabled: { type: boolean }
            value: { type: string }
    Healthz:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean, const: true }
        usage_store_degraded:
          type: boolean
          description: Present only while the usage store reports a last error.
        usage_store_error:
          type: string
          description: Present only while the usage store reports a last error.
    TelemetrySample:
      type: object
      description: >
        One ServerAgent telemetry sample (core fields; the agent may send
        additional metrics such as per-GPU and per-interface samples — see
        internal/routing.TelemetrySample and the agent source).
      additionalProperties: true
      properties:
        agent_version: { type: string }
        reported_at: { type: string, format: date-time }
        os: { type: string }
        arch: { type: string }
        cpu_load: { type: number }
        active_requests: { type: integer }
        queue_depth: { type: integer }
        latency_ms: { type: number }
        error_rate: { type: number }
        provider_health: { type: object, additionalProperties: true }
        capabilities:
          type: object
          additionalProperties: true
          description: >
            Capability negotiation, agent to gateway. Exactly one key is read:
            {"features":[...]}. Everything else is ignored, so a new key is a
            backward-compatible addition. Do NOT put agent_version here — the
            version rides on the top-level agent_version field, which is the
            only one the gateway persists and the portal renders.
        loaded_models:
          type: array
          items: { type: string }
          description: >
            When an agent-managed model runtime is active this is overridden
            authoritatively to contain only specs in state "running";
            "starting" deliberately does not count.
        runtimes:
          type: array
          description: >
            Per-managed-spec runtime status. ABSENT entirely (not null, not [])
            when the agent has no runtime driver — the compatibility guarantee
            for agents that never negotiate the feature. An agent that DOES
            support it must send the full current snapshot on EVERY sample: the
            gateway replaces its per-server snapshot from each sample, so
            sending the key only when something changed makes the portal's live
            table flicker empty.
          items:
            type: object
            additionalProperties: true
            properties:
              spec_id: { type: string }
              model: { type: string }
              state:
                type: string
                enum: [stopped, starting, running, draining, backoff, start_failed, crashed, pending_vram_unknown, not_permitted]
              since: { type: string, format: date-time }
              pid: { type: integer }
              port: { type: integer }
              in_flight: { type: integer }
              restarts: { type: integer }
              gpus:
                type: array
                items:
                  type: object
                  properties:
                    index: { type: integer }
                    vram_measured_mb: { type: integer }
              last_error:
                type: object
                properties:
                  message: { type: string }
                  at: { type: string, format: date-time }
                  exit_code: { type: integer }
                  failures: { type: integer }
                  stderr_tail: { type: string }
    ModelImageOptions:
      type: object
      description: >
        The image options one gateway model offers (gateway.ModelImageOptionsDTO),
        the aggregate of what every sd-server backing the model states. EVERY
        field is omitted when unknown or not agreed, and an empty object is a
        normal answer. Absent or empty means UNKNOWN (fail-open), never
        "none supported": a client falls back to its static sd-cpp superset
        for that field, which also covers backing servers whose supported sets
        are disjoint (the intersection is empty and is omitted). Defaults are
        hints for placeholders, not values to pre-fill.
      properties:
        samplers:
          type: array
          items: { type: string }
          description: Intersection of the sampler names every stating sd-server accepts, in the first stated list's order.
        schedulers:
          type: array
          items: { type: string }
          description: Intersection of the scheduler names every stating sd-server accepts.
        output_formats:
          type: array
          items: { type: string }
          description: Intersection of the output formats img_gen can encode (output_formats_by_mode.img_gen).
        size_limits:
          type: object
          description: >
            The tightest size envelope across the servers (largest stated
            minimum, smallest stated maximum, per axis). A bound is omitted
            when unstated. Any emitted min/max pair on one axis satisfies
            min <= max (an inverted axis is dropped whole), and no bound is
            negative or zero.
          properties:
            min_width: { type: integer, minimum: 1 }
            max_width: { type: integer, minimum: 1 }
            min_height: { type: integer, minimum: 1 }
            max_height: { type: integer, minimum: 1 }
        max_batch_count:
          type: integer
          minimum: 1
          description: >
            Smallest positive batch ceiling the servers state. A client's own
            hard cap of 8 images per request still applies; this value may only
            narrow it.
        defaults:
          type: object
          description: >
            Defaults every server that states one agrees on; a field the
            servers disagree on, or none states, is omitted (zero and empty
            are "not stated", not values). clip_skip and seed carry the
            servers' own -1 faithfully ("model default" / "random").
          properties:
            sampler: { type: string }
            scheduler: { type: string }
            output_format: { type: string }
            negative_prompt: { type: string }
            steps: { type: integer }
            clip_skip: { type: integer, description: '-1 = the model default.' }
            seed: { type: integer, description: '-1 = random.' }
            width: { type: integer }
            height: { type: integer }
            cfg: { type: number, description: 'Classifier-free guidance scale (guidance.txt_cfg).' }
    VendorAccountsEnabled:
      type: object
      description: >
        GET /api/portal/vendor-accounts/enabled: four booleans and nothing
        else. sharing_enabled is the vendor_account_sharing_enabled master switch
        as stored (the module flag is checked first by the endpoints themselves,
        and the consumer combines the two); subscription_sharing_enabled is the
        subordinate vendor_subscription_sharing_enabled switch as stored, which
        only narrows sharing_enabled.
      required: [module_enabled, subscriptions_enabled, sharing_enabled, subscription_sharing_enabled]
      properties:
        module_enabled: { type: boolean, description: The vendor_accounts_enabled master flag. }
        subscriptions_enabled: { type: boolean, description: The vendor_subscriptions_enabled switch (default true). }
        sharing_enabled: { type: boolean, description: The vendor_account_sharing_enabled master switch (default false). }
        subscription_sharing_enabled: { type: boolean, description: The vendor_subscription_sharing_enabled switch (default false), whether a subscription account may be raised to shared. }
    VendorAccountShareLevelRequest:
      type: object
      description: portal.SetVendorAccountShareLevelRequest.
      required: [level]
      properties:
        level:
          type: string
          enum: [none, shared, full]
          description: The TARGET level. A level above the stored one is a raise, anything else a lower.
        admin_group_ids:
          type: array
          items: { type: string }
          description: >
            The management groups. Required (at least one) when the request raises
            the account; ignored when it lowers it.
    VendorAccountAdminGroupsRequest:
      type: object
      description: The body of PUT /api/portal/vendor-accounts/{id}/admin-groups.
      required: [admin_group_ids]
      properties:
        admin_group_ids:
          type: array
          items: { type: string }
          description: The new management-group set (at least one), replacing the stored one.
    AdminGroupCandidate:
      type: object
      description: portal.AdminGroupCandidateDTO, an admin-tier group the caller may name as a management group.
      required: [id, name, parent_group_id, parent_group_name]
      properties:
        id: { type: string }
        name: { type: string }
        parent_group_id: { type: string, description: "The parent system group, the account's future containment root." }
        parent_group_name: { type: string }
    GroupRef:
      type: object
      description: portal.GroupRefDTO, a group by id and name.
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    VendorAccountResourceGroup:
      type: object
      description: >
        portal.VendorAccountResourceGroupDTO, one resource group the owner may
        self-service enter or leave the account into or from. Nothing else about
        the group is exposed.
      required: [id, name, member]
      properties:
        id: { type: string }
        name: { type: string }
        member: { type: boolean, description: The account is currently in this group. }
    ServiceResourceGroup:
      type: object
      description: >
        portal.ServiceResourceGroupDTO, one resource group a service manager may
        self-service enter or leave the service into or from.
      required: [id, name, member]
      properties:
        id: { type: string }
        name: { type: string }
        member: { type: boolean, description: The service is currently provisioned into this group. }
    ResourceGroupVendorAccountRef:
      type: object
      description: >
        portal.ResourceGroupVendorAccountRefDTO, a minimal credential-free
        vendor-account reference (id and display name only; never the owner, the
        level or any credential flag).
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    VendorAccountModel:
      type: object
      description: >
        One model a vendor account serves (portal.VendorAccountModelDTO, a row
        of vendor_account_models): the id a client requests, the id the vendor
        is sent, the wire flavor and the vendor's display name. A member's view
        of an account carries upstream_model as an empty string (the vendor's own
        id is withheld; the member requests the gateway name).
      required: [gateway_model, upstream_model, api_flavor, display_name]
      properties:
        gateway_model:
          type: string
          description: The id a client lists and requests -- the account's model_prefix plus upstream_model.
        upstream_model:
          type: string
          description: The vendor's own model id (slug), the one the vendor is sent.
        api_flavor:
          type: string
          enum: [openai, anthropic]
        display_name:
          type: string
          description: >
            The vendor's human-readable model name; empty when it supplied none
            or one that is not printable ASCII. At most 128 characters.
    VendorAccount:
      type: object
      description: >
        The credential-free view of a vendor account (portal.VendorAccountDTO),
        rendered for the viewer. The sealed api key and OAuth token set are
        reduced to the api_key_set / subscription_connected booleans; no
        response carries a secret, for any viewer. There are two views. The
        management view (the owner, a CM of a shared or full account, system
        scope) carries every field. The member view (a principal that can only
        route to the account through a resource group it is provisioned into) is
        a minimal allowlist: id, vendor, auth_type, name, status, model_prefix,
        models (gateway_model, api_flavor and display_name only), the two
        credential booleans, is_owner false and shared_by. Everything else is
        withheld and reads as its zero value (usage is omitted): share_level,
        admin_groups, system_group_id and system_group_name, base_url, usage, each
        model's upstream_model and the two timestamps.
      required: [id, vendor, auth_type, name, status, model_prefix, base_url, api_key_set, subscription_connected, models, created_at, updated_at, share_level, admin_groups, system_group_id, system_group_name, is_owner, shared_by]
      properties:
        id: { type: string, description: 'va_-prefixed, random hex.' }
        vendor: { type: string, enum: [openai, anthropic, xai, openrouter, kilo, google, google_native, openai_compatible] }
        auth_type: { type: string, enum: [api_key, subscription] }
        name: { type: string }
        status:
          type: string
          enum: [active, disabled, needs_reconnect]
          description: needs_reconnect is system-managed (a rejected token refresh sets it); a client cannot set it.
        model_prefix:
          type: string
          description: >
            The account's model-id namespace, empty for none. Every model the
            account serves is requested as model_prefix + upstream_model.
        base_url:
          type: string
          description: >
            The upstream root URL of an OpenAI-compatible or native Gemini account
            (xai, openrouter, kilo, google, google_native, openai_compatible), stored
            without /v1 or any other path prefix (the gateway adds the vendor's own
            prefix). Always present, empty
            for the openai and anthropic vendors. Immutable after creation.
        api_key_set: { type: boolean }
        subscription_connected: { type: boolean }
        models:
          type: array
          description: The models the account serves; always an array, never null.
          items: { $ref: '#/components/schemas/VendorAccountModel' }
        usage:
          $ref: '#/components/schemas/VendorAccountUsage'
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        share_level:
          type: string
          enum: ['', none, shared, full]
          description: >
            The stored share level (anything the service does not recognise reads
            none; an empty string only in the member view, which withholds it).
            With the sharing master switch off it keeps reporting what is stored.
        admin_groups:
          type: array
          description: The management groups; always an array, empty for an account not stored as shared.
          items: { $ref: '#/components/schemas/GroupRef' }
        system_group_id: { type: string, description: 'The containment root, empty until the account is first raised.' }
        system_group_name: { type: string, description: "The root's name, best effort." }
        is_owner: { type: boolean, description: Whether the viewer owns the account. }
        shared_by:
          type: string
          description: >
            The owner's display name (never the e-mail address) for a viewer who
            is not the owner; empty for the owner and when it cannot be resolved.
    VendorAccountUsage:
      type: object
      description: >
        The account's rate-limit usage snapshot (portal.VendorAccountUsageDTO).
        Present as VendorAccount.usage on the detail read and on every row of
        the list, and only once one has been stored (the key is omitted
        otherwise); also the usage of the usage-refresh answer. The rate-limit
        windows are percentages and reset times only; a Codex Business plan's
        spend control and credit state ride along as the spend_* fields and
        credit_status, and so does an OpenRouter key's USD limit (spend_unit
        USD; a key without a cap reads credit_status unlimited). A Kilo
        balance rides in credit_balance. Every field is always on the wire, with an unknown one
        reading -1 (a percent), null (a time) or "" (a string), never a
        fabricated 0. A client shows only the limits it knows (a -1 window is
        hidden, not drawn as zero).
      properties:
        five_hour_pct: { type: number, description: 'Used share of the five-hour window, 0..100; -1 = unknown.' }
        five_hour_reset_at: { type: [string, 'null'], format: date-time }
        weekly_pct: { type: number, description: 'Used share of the weekly window, 0..100; -1 = unknown.' }
        weekly_reset_at: { type: [string, 'null'], format: date-time }
        credit_balance: { type: string, description: 'The vendor''s raw credit-balance string; empty = none or unknown.' }
        spend_unit: { type: string, description: 'Unit of the spend-control figures, e.g. credit; empty = unknown.' }
        spend_limit: { type: string, description: 'The vendor''s raw spend-control limit string; empty = unknown.' }
        spend_used: { type: string, description: 'The vendor''s raw spend-control used string; empty = unknown.' }
        spend_remaining: { type: string, description: 'The vendor''s raw spend-control remaining string; empty = unknown.' }
        spend_used_pct: { type: number, description: 'Used share of the spend-control limit, 0..100; -1 = unknown.' }
        spend_reset_at: { type: [string, 'null'], format: date-time }
        credit_status:
          type: string
          enum: ['', unlimited, has_credits, none]
          description: The credit state the vendor's credit flags report; empty = unknown.
        updated_at: { type: string, format: date-time }
    VendorUsageRefreshResult:
      type: object
      description: >
        What POST /api/portal/vendor-accounts/{id}/usage/refresh did
        (portal.VendorUsageRefreshResult). Credential-free.
      required: [status, detail]
      properties:
        status:
          type: string
          enum: [ok, fresh, unverifiable, unsupported]
          description: >
            ok - the vendor was asked and the snapshot was stored (merged for
            an OpenAI subscription, as fetched for an OpenRouter or Kilo api
            key). fresh - the
            lazy TTL (the account's last active pull was younger than 5 minutes)
            skipped the pull: the vendor was not called and the stored snapshot
            is answered as it is (never with ?force=1). unverifiable - nothing
            usable could be had (no usable token or no api key set, vendor
            unreachable or unusable answer, snapshot not storable); the stored
            snapshot was kept; says nothing about the credential. unsupported -
            the account has no active usage pull (only an OpenAI subscription
            and an OpenRouter or Kilo api key have one); no credential was
            opened.
        detail:
          type: string
          description: Short English phrase (what happened, or why nothing was pulled). Never a credential or vendor text; key off status, not this.
    VendorAccountCreateRequest:
      type: object
      description: portal.CreateVendorAccountRequest.
      required: [vendor, auth_type, name]
      properties:
        vendor: { type: string, enum: [openai, anthropic, xai, openrouter, kilo, google, google_native, openai_compatible] }
        auth_type: { type: string, enum: [api_key, subscription] }
        name: { type: string }
        status:
          type: string
          enum: [active, disabled]
          description: Defaults to active.
        api_key:
          type: string
          description: Write-only; meaningful for an api_key account only (a subscription account is created unconnected).
        model_prefix:
          type: string
          maxLength: 64
          pattern: '^[A-Za-z0-9._~:/@+-]*$'
          description: >
            Optional namespace for the account's model ids (trimmed; no "..").
            An invalid value is a 400 vendor_account.model_prefix_invalid.
        base_url:
          type: string
          description: >
            The upstream root URL of an OpenAI-compatible or native Gemini account,
            without /v1 or any other path prefix. Optional for xai, openrouter, kilo,
            google and google_native (empty means the vendor's default root) and required for
            openai_compatible (400 vendor_account.base_url_required). It must be an
            https URL with a host and no userinfo, query or fragment (400
            vendor_account.base_url_invalid). Ignored for openai and anthropic.
            Immutable after creation: the update request has no such field. An
            OpenAI-compatible vendor, like google_native, accepts auth_type api_key
            only (400 vendor_account.auth_type_invalid otherwise).
    VendorAccountUpdateRequest:
      type: object
      description: portal.UpdateVendorAccountRequest; an absent field keeps the stored value.
      properties:
        name: { type: string }
        status:
          type: string
          enum: [active, disabled]
          description: needs_reconnect cannot be set; a status equal to the stored one is a no-op.
        api_key:
          type: [string, 'null']
          description: Write-only keep (absent or null) / clear ("") / replace (a value) sentinel.
        model_prefix:
          type: [string, 'null']
          maxLength: 64
          pattern: '^[A-Za-z0-9._~:/@+-]*$'
          description: >
            Keep (absent or null) / clear ("") / replace (a value). A request
            that carries it re-labels the stored model rows.
    VendorModelsRefreshResult:
      type: object
      description: >
        What POST /api/portal/vendor-accounts/{id}/models/refresh did
        (portal.RefreshResult). Credential-free.
      required: [status, discovered, detail]
      properties:
        status:
          type: string
          enum: [ok, unverifiable]
          description: >
            ok - the vendor served a usable list and it replaced the account's
            models. unverifiable - nothing usable could be had (no credential,
            expired token that could not be renewed, vendor unreachable or
            unexpected answer, no usable model); the models were kept.
        discovered:
          type: integer
          description: Number of models now served from the discovery (0 when unverifiable).
        detail:
          type: string
          description: Short English phrase (what was stored, or why nothing was). Never a credential.
    VendorConnectionCheck:
      type: object
      description: >
        Verdict of POST /api/portal/vendor-accounts/{id}/check on an account's
        stored credential (portal.VendorConnectionCheck). The check names no
        model, so it speaks to authentication only, never to whether a model is
        served. Never carries a credential.
      required: [status, detail, checked_at]
      properties:
        status:
          type: string
          enum: [valid, invalid, unverifiable]
          description: >
            valid - the vendor accepted the credential. invalid - it was
            definitively rejected (HTTP 401). unverifiable - no clean answer
            (vendor unreachable, rate-limited or unexpected) or nothing to test
            (no API key set, subscription not connected, access token expired but
            refreshable); says nothing about the credential.
        detail:
          type: string
          description: >
            Short English status phrase (HTTP status and, when sent, the vendor's
            short error code). Credential-free; may be empty.
        checked_at: { type: string, format: date-time }
