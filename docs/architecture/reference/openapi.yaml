      tags: [portal]
      summary: List ServerAgent release binaries for manual install
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
  /api/portal/agent-binaries/{path}:
