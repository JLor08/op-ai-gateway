# SPDX-License-Identifier: AGPL-3.0-only
# Copyright (C) 2026 OnPrem AI Gateway contributors
#
# Machine-readable index of the gateway's HTTP surface. The canonical prose
# reference — auth modes, scopes, object-level authorization, dual-mux agent
# dispatch — is api-surface.md in this directory; keep both in sync (routes
# are registered in gateway/backend/internal/gateway/server.go).
#
# Scope: this spec is deliberately PATH-LEVEL. It lists every registered
# route with its verified methods, auth requirements, and purpose. Request/
# response bodies are typed loosely (the DTOs live in the Go code and change
# with it); only small, stable payloads are modeled as concrete schemas.
# Sub-resources that api-surface.md summarizes as "+ sub-paths" are
# enumerated in the parent path's description instead of being guessed here.
openapi: 3.1.0
info:
  title: OnPrem AI Gateway HTTP API
  version: 0.1.0
  description: >
    HTTP surface of the OnPrem AI Gateway: OpenAI/Anthropic-compatible
    inference endpoints, the portal application API, system administration,
    and the ServerAgent ingest API. Error responses use the stable-code
    envelope `{"error":{"code","message","request_id?"}}`. Session-based
    non-GET/HEAD/OPTIONS requests additionally require the `X-OP-CSRF: 1`
    header. See docs/architecture/reference/api-surface.md for the canonical
    description of auth modes, scopes, and object-level authorization.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only

servers:
  - url: http://127.0.0.1:8080
    description: Local development gateway (make run-gateway / make dev)
  - url: /
    description: >
      Bundled deployment — nginx proxies /api/, /v1/, /openai/, /anthropic/,
      /healthz, and the ACME challenge path to the backend and serves the SPA
      at /portal/.

tags:
  - name: inference
    description: OpenAI/Anthropic/Codex/Claude-Code-compatible endpoints
  - name: auth
    description: Login, logout, session state, invite-token password set
  - name: portal
    description: Authenticated application API (/api/portal/*)
  - name: system
    description: System administration (scope `system` = system_admin role + step-up elevation)
  - name: agent
    description: ServerAgent ingest and distribution (/api/agent/v1/*, agent-token bearer)
  - name: health
    description: Liveness and public infrastructure endpoints

security: []

paths:
  # ── 1. Inference / compatibility ─────────────────────────────────────────
  /v1/chat/completions:
    post:
      tags: [inference]
      summary: OpenAI-compatible chat completions (streaming supported)
      description: >
        Session-or-bearer, scope `gateway:use` or `llm:invoke`. The only
        inference path that also accepts the portal session (portal chat runs
        use it over the internal loopback path). Alias: /openai/v1/chat/completions.
      security: [{ bearerAuth: [] }, { sessionCookie: [], csrfHeader: [] }]
      requestBody: { $ref: '#/components/requestBodies/OpaqueJSON' }
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /openai/v1/chat/completions:
    post:
      tags: [inference]
      summary: Alias of /v1/chat/completions
      security: [{ bearerAuth: [] }, { sessionCookie: [], csrfHeader: [] }]
      requestBody: { $ref: '#/components/requestBodies/OpaqueJSON' }
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/responses:
    post:
      tags: [inference]
      summary: OpenAI Responses API (Codex)
      description: >
        Bearer-only, scope `gateway:use` or `llm:invoke`. Attempts native
        passthrough to an upstream that speaks the Responses API before
        falling back to translation. Alias: /openai/v1/responses.
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/OpaqueJSON' }
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /openai/v1/responses:
    post:
      tags: [inference]
      summary: Alias of /v1/responses
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/OpaqueJSON' }
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/messages:
    post:
      tags: [inference]
      summary: Anthropic Messages API (Claude Code)
      description: >
        Bearer-only, scope `gateway:use` or `llm:invoke`. Native passthrough
        when the target application supports it — the only path where
        Anthropic streaming works end-to-end. Alias: /anthropic/v1/messages.
        A token with the claude_effort_compatibility setting additionally has
        the request's `output_config.effort` delivered to a llama.cpp or vLLM
        target as `chat_template_kwargs.reasoning_effort` (on native
        passthrough and on translation alike; the value is forwarded
        verbatim). On that opted-in route a non-string effort, a
        non-object `chat_template_kwargs` or a `chat_template_kwargs.reasoning_effort`
        that conflicts with the effort is a 400 `messages.invalid_output_config`;
        a token without the setting is never rejected for `output_config`.
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/OpaqueJSON' }
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /anthropic/v1/messages:
    post:
      tags: [inference]
      summary: Alias of /v1/messages
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/OpaqueJSON' }
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/images/generations:
    post:
      tags: [inference]
      summary: OpenAI-compatible image generation (relay only, no translate path)
      description: >
        Scope `gateway:use` or `llm:invoke`. Authenticates with a bearer token
        OR the internal trusted-loopback header pair (X-OP-Internal-Auth +
        X-OP-Internal-User, blanked by nginx at the public edge and therefore
        unreachable by any external client, which is why only bearerAuth is
        modelled below); a portal session cookie is never accepted here.
        Always relayed to a natively image-shaped upstream; there is no
        translate fallback.
        Admission takes an application that declares the `openai_images` API
        flavor (otherwise 404 `routing.no_model_route`) and a mapping whose
        `image` verdict is `yes` (otherwise 404 `routing.model_not_capable`);
        an agent-launched model's runtime spec must declare the flavor too
        (otherwise 404 `routing.no_model_route`). Non-streaming only (a `stream: true`
        is refused with 400 `images.stream_unsupported`), and
        `response_format` must be `b64_json` or absent (400
        `images.response_format_unsupported` otherwise). Metered in images
        (`billing_unit: image`), not in tokens. Beyond those two it answers the
        same statuses as every other inference path (429/402 from the principal
        limiter, 503 from the capacity queue or no healthy host), which this
        path-level spec does not enumerate for any of them. Alias:
        /openai/v1/images/generations.
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/OpaqueJSON' }
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /openai/v1/images/generations:
    post:
      tags: [inference]
      summary: Alias of /v1/images/generations
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/OpaqueJSON' }
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/images/edits:
    post:
      tags: [inference]
      summary: OpenAI-compatible image edit (multipart relay, no translate path)
      description: >
        Same auth as /v1/images/generations: scope `gateway:use` or
        `llm:invoke`, a bearer token OR the internal trusted-loopback header
        pair (unreachable by any external client, which is why only bearerAuth
        is modelled below), never a portal session cookie. The body is
        `multipart/form-data` (the gateway's first multipart request path) and
        is relayed as multipart to a natively image-shaped upstream
        (`sd-server`); there is no translate fallback. Required: `model`,
        `prompt` and at least one non-empty source image under `image` or
        `image[]` (400 `images.model_required`, `images.prompt_required`,
        `images.image_required`); each of `model`, `prompt`, `response_format`,
        `stream` and `mask` may appear once (400 `request.invalid`), and a body
        that is not a well-formed multipart form is 400 `request.invalid`.
        Admission takes an application that declares the `openai_images` API
        flavor (otherwise 404 `routing.no_model_route`) and a mapping whose
        `image_edit` capability holds (404 `routing.model_not_capable`
        otherwise). That capability is derived: it holds wherever `image` is
        `yes`, unless an operator set an `image_edit: no` verdict on the
        mapping. An agent-launched model's runtime spec must declare the flavor
        too, and its agent must declare the `multipart_proxy` feature, else
        404 `images.edit_unavailable`. Non-streaming only (a `stream` of
        `true` is 400 `images.stream_unsupported`), and `response_format` must
        be `b64_json` or absent (400 `images.response_format_unsupported`).
        An OpenAI-style `mask` (an RGBA PNG whose TRANSPARENT pixels mark the
        region to edit) is converted to the luminance mask sd-server reads; it
        must be a PNG of exactly the first source image's size, at most 16
        megapixels, with at least one transparent pixel (400
        `images.mask_invalid`; 400 `images.edit_unsupported_format` for a mask
        that is not a readable PNG, or, when a mask is sent, a source that is
        not a readable PNG or JPEG). The whole body is held in memory and
        capped by `OP_AI_GATEWAY_MAX_IMAGE_EDIT_BODY_BYTES` (default 32 MiB;
        413 `request.body_too_large`); a body bound for an agent-launched model
        is checked against the agent's own 32 MiB after the gateway has
        prepared it, with the same refusal. Metered in output images
        (`billing_unit: image`); input images and the mask are not metered.
        Beyond those it answers the same statuses as every other inference
        path (429/402 from the principal limiter, 503 from the capacity queue
        or no healthy host), which this path-level spec does not enumerate.
        Alias: /openai/v1/images/edits.
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/ImageEditForm' }
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /openai/v1/images/edits:
    post:
      tags: [inference]
      summary: Alias of /v1/images/edits
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/ImageEditForm' }
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/audio/speech:
    post:
      tags: [inference]
      summary: OpenAI-compatible text-to-speech (binary audio/wav relay, no translate path)
      description: >
        Same auth as /v1/images/generations: scope `gateway:use` or
        `llm:invoke`, a bearer token OR the internal trusted-loopback header
        pair (unreachable by any external client, which is why only bearerAuth
        is modelled below), never a portal session cookie. Always relayed to a
        natively OpenAI-shaped speech upstream (audio.cpp's `audiocpp_server`);
        there is no translate fallback. Required: a non-empty `model` (400
        `speech.model_required`) and a non-empty `input` (400
        `speech.input_required`).
        Admission takes an application that declares the `openai_audio` API
        flavor (otherwise 404 `routing.no_model_route`) and a mapping whose
        `speech` capability verdict is `yes` (otherwise 404
        `routing.model_not_capable`); an agent-launched model's runtime spec
        must declare the flavor too (otherwise 404
        `routing.no_model_route`). A request that does not stream accepts
        `wav`, `pcm` or an absent `response_format`: every other value, `mp3`,
        `opus`, `flac`, `aac`, `json` and `b64_json`, is refused with 400
        `speech.response_format_unsupported` (audio.cpp has no encoder: it
        answers a plain WAV for every format, so the compressed ones wait for
        server-side transcoding, issue #264). `pcm` is the upstream WAV with
        its RIFF/WAVE header stripped (a header strip, not a transcode, ADR-069):
        headerless signed 16-bit little-endian mono PCM at the model's native
        sample rate, as `application/octet-stream` with a `Content-Length` of
        the data chunk alone. A clip that is not 16-bit mono PCM, is
        structurally unsound, overruns the upstream's declared length or came
        with no usable `Content-Length` is refused after synthesis with 502
        `speech.pcm_unavailable`. A `stream: true` request answered buffered
        (below) is still a one-shot `audio/wav` even with `response_format:
        pcm`. Streaming is served for a
        `mode=streaming` model (ADR-068): `stream: true` against a mapping whose
        `speech_streaming` capability verdict is `yes` is relayed as audio.cpp's
        own stream, unbuffered and without a `Content-Length` - by default (or
        with `stream_format: sse`) the SSE frames `speech.audio.delta` (base64
        PCM in `audio`, signed 16-bit little-endian mono, headerless; the stream
        states neither a sample rate nor a duration) then `speech.audio.done`
        (only `timing.ttft_ms`) then `[DONE]`, and with `stream_format: audio`
        the raw PCM as `application/octet-stream`. A streamed request must ask
        `response_format` `pcm` or omit it: `wav` beside a stream is 400
        `speech.stream_unsupported` (audio.cpp serves streaming only as `pcm`)
        and any other value is 400 `speech.response_format_unsupported`. Against
        an offline, unprobed or not-yet-reported model the same `stream: true`
        is answered buffered, as one complete `audio/wav` clip whatever
        `response_format` was named, never as an error, and on a stale-`yes`
        mode-mismatch 500 the gateway retries buffered once. A non-boolean
        `stream`, a `stream_format` other than `sse` or `audio`, and a
        `stream_format` on a request that does not stream are 400
        `speech.stream_unsupported`. A one-shot 200 is the synthesized clip as
        one binary `audio/wav` body, relayed without buffering and with the
        upstream's own `Content-Length`. A non-2xx upstream answer keeps the
        upstream's status and is normalised to the OpenAI error shape: an OpenAI
        error object passes through unchanged, a plain-string `error` is
        wrapped with `type: upstream_error` and `code: speech.upstream_error`,
        and any other body is relayed as it came. Metered in seconds of audio
        (`billing_unit: audio_second`, read from the upstream's
        `X-AudioCPP-Audio-Duration-Ms` header, a one-shot `pcm` answer
        included), not in tokens; a `speech.pcm_unavailable` row is
        `audio_second` with quantity 0. A streamed call
        has no such header: on a clean completion (`speech.audio.done` then
        `[DONE]`, or a raw body closed cleanly) it is billed from the PCM bytes
        the relay counted, as `audio_second` equal to the bytes divided by the
        mapping's cached output byte rate, or, while no rate is cached, as
        `audio_bytes` with the byte count; every other streamed outcome is
        `audio_second` with quantity 0. A requested
        `voice` is a fail-open routing preference: when at least one candidate
        mapping's cached voice list (see GET /v1/audio/voices) offers it,
        routing is restricted to the candidates that do, and otherwise it is
        unfiltered, so a free-text or unknown voice reaches the upstream as
        before (audio.cpp answers an unknown voice with HTTP 500). When the
        voice narrowed the candidates and none of those is usable the answer
        is 503 `routing.voice_unavailable`, in place of
        `routing.no_healthy_host` and only then. A top-level `language` is the
        client's own field: audio.cpp applies it per model as the transcript
        language and silently drops it for a model that takes none, so the
        gateway neither reads nor gates on it (ADR-074; the portal composer
        learns which models take one from GET /api/portal/model-speech-language).
        Beyond those it answers the
        same statuses as every other inference path (429/402 from the
        principal limiter, 503 from the capacity queue or no healthy host),
        which this path-level spec does not enumerate. Alias:
        /openai/v1/audio/speech.
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/SpeechRequest' }
      responses:
        '200': { $ref: '#/components/responses/AudioWav' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502':
          description: >
            The Error envelope with code `speech.pcm_unavailable` when a
            one-shot `response_format: pcm` request's synthesized clip cannot
            be served as raw PCM (not 16-bit mono PCM, structurally unsound,
            over the upstream's declared length, or no usable
            `Content-Length`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: >
            The Error envelope with code `routing.voice_unavailable` when the
            requested `voice` narrowed the candidates to the servers that offer
            it and every one of them is unreachable, unhealthy or busy;
            otherwise `routing.no_healthy_host` or a capacity-queue code.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /openai/v1/audio/speech:
    post:
      tags: [inference]
      summary: Alias of /v1/audio/speech
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/SpeechRequest' }
      responses:
        '200': { $ref: '#/components/responses/AudioWav' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502':
          description: >
            The Error envelope with code `speech.pcm_unavailable` when a
            one-shot `response_format: pcm` request's synthesized clip cannot
            be served as raw PCM (not 16-bit mono PCM, structurally unsound,
            over the upstream's declared length, or no usable
            `Content-Length`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: >
            The Error envelope with code `routing.voice_unavailable` when the
            requested `voice` narrowed the candidates to the servers that offer
            it and every one of them is unreachable, unhealthy or busy;
            otherwise `routing.no_healthy_host` or a capacity-queue code.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/audio/voices:
    get:
      tags: [inference]
      summary: The voice names the gateway has cached for a speech model (a read of the cache, never an upstream call)
      description: >
        Scope `gateway:use` or `llm:invoke`: a bearer token OR the internal
        trusted-loopback header pair (unreachable by any external client, which
        is why only bearerAuth is modelled below), never a portal session
        cookie (a browser uses GET /api/portal/model-voices). The `model` query
        parameter is the gateway model name (a group name is expanded to its
        members); it selects which cached rows are read, and audio.cpp's own
        `?model=` is moot (it ignores it and lists the model it has loaded).
        The answer is the deduplicated, sorted union of the voices cached for
        the mappings a speech dispatch for this token could reach (the token's
        model override and a service token's allowlist applied first, then
        resource-group provisioning and the locked/group-only rule), restricted
        to mappings that are offerable NOW (`speech` yes and either not
        `speech_clone` yes or a non-empty cached list, read at request time, so a
        voice-clone model with configured presets lists its preset names, ADR-075).
        Nothing is loaded and no
        upstream is contacted, so the list is available while the model is
        unloaded. Every "nothing to show" case (an unknown name, a model the
        token cannot route to or may not use, a non-speech model, a clone model
        without presets, one
        with nothing cached yet) is the same 200 with an empty `voices` list,
        so the answer cannot be used to probe which models exist. A missing or
        blank `model` is 400 `model.name_required`; a store failure is 500
        `model.voices_failed`, never read as an empty list. Voices are not part
        of /v1/models. Alias: /openai/v1/audio/voices.
      parameters:
        - name: model
          in: query
          required: true
          description: The gateway model name (or group name).
          schema: { type: string, minLength: 1 }
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/AudioVoices' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500':
          description: The Error envelope with code `model.voices_failed` (a store failure).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /openai/v1/audio/voices:
    get:
      tags: [inference]
      summary: Alias of /v1/audio/voices
      parameters:
        - name: model
          in: query
          required: true
          description: The gateway model name (or group name).
          schema: { type: string, minLength: 1 }
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/AudioVoices' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/audio/transcriptions:
    post:
      tags: [inference]
      summary: OpenAI-compatible speech-to-text (multipart in, JSON out, no translate path)
      description: >
        Same auth as /v1/images/generations: scope `gateway:use` or
        `llm:invoke`, a bearer token OR the internal trusted-loopback header
        pair (unreachable by any external client, which is why only bearerAuth
        is modelled below), never a portal session cookie. The body is
        `multipart/form-data` and is relayed as multipart to a natively
        OpenAI-shaped speech-to-text upstream (audio.cpp's `audiocpp_server`);
        there is no translate fallback. Required: a non-empty `model` (400
        `transcription.model_required`) and exactly one non-empty part named
        `file` (400 `transcription.file_required` for none, 400
        `transcription.invalid` for more than one). Only `file` counts: there is
        no `file[]` spelling, and an empty `file` part is dropped before the
        relay. A body that is not a well-formed multipart form (a JSON body
        included), or that repeats `model`, `language`, `prompt`,
        `response_format`, `stream` or `stream_format`, is 400
        `transcription.invalid`.
        Admission takes an application that declares the `openai_audio` API
        flavor (otherwise 404 `routing.no_model_route`) and a mapping whose
        `transcription` capability verdict is `yes` (otherwise 404
        `routing.model_not_capable`); an agent-launched model's runtime spec
        must declare the flavor too (otherwise 404 `routing.no_model_route`),
        and its agent must declare the `multipart_proxy` feature, else 404
        `transcription.unavailable`. The only accepted `response_format` is
        `json` or absent: `verbose_json`, `text`, `srt`, `vtt` and every other
        value is refused with 400 `transcription.response_format_unsupported`.
        `stream: true` against a mapping whose `transcription_streaming`
        capability verdict is `yes` (the model is `mode=streaming`) is served:
        the gateway relays audio.cpp's own OpenAI-style SSE unbuffered
        (`Content-Type: text/event-stream`; `transcript.text.delta` ->
        `transcript.text.done` -> `[DONE]`). Against an offline, unprobed or
        not-yet-reported model the same `stream: true` is served buffered (the
        complete JSON, never an error), and a stale-`yes` `500` is retried
        buffered once. Only a non-boolean `stream`, or any `stream_format`, is
        refused with 400 `transcription.stream_unsupported`. The buffered 200
        response is audio.cpp's `application/json` document, written through
        verbatim with its `timing` extension: the gateway buffers the whole
        body, up to the upload cap, to read the trailing
        `timing.audio_duration_ms`, so a 2xx response over that bound, or one
        that breaks off mid-read, is 502 `transcription.upstream_error` with
        nothing written. A non-2xx upstream
        answer keeps the upstream's status and is normalised to the OpenAI
        error shape: an OpenAI error object passes through unchanged, a
        plain-string `error` is wrapped with `type: upstream_error` and `code:
        transcription.upstream_error`, and any other body is relayed as it
        came. The whole upload is held in memory and capped by
        `OP_AI_GATEWAY_MAX_AUDIO_TRANSCRIPTION_BODY_BYTES` (default 32 MiB; 413
        `request.body_too_large`); a body bound for an agent-launched model is
        checked against the agent's own 32 MiB after the gateway has prepared
        it, with the same refusal. Metered in seconds of audio
        (`billing_unit: audio_second`), not in tokens: a buffered call reads the
        duration from the response body's `timing.audio_duration_ms` (not a
        header); a streamed call, which carries no such field, reads it from the
        uploaded WAV header and bills only on a clean completion. Beyond those
        it answers the same statuses as every other inference path (429/402
        from the principal limiter, 503 from the capacity queue or no healthy
        host), which this path-level spec does not enumerate. Alias:
        /openai/v1/audio/transcriptions.
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/TranscriptionForm' }
      responses:
        '200': { $ref: '#/components/responses/Transcription' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /openai/v1/audio/transcriptions:
    post:
      tags: [inference]
      summary: Alias of /v1/audio/transcriptions
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/TranscriptionForm' }
      responses:
        '200': { $ref: '#/components/responses/Transcription' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/audio/transcriptions/live:
    post:
      tags: [inference]
      summary: Live transcription, chunked full-duplex (raw PCM body in, SSE out; the canonical live relay)
      description: >
        Live transcription (ADR-073, ADR-072, issue #266): a chunked,
        full-duplex HTTP/1.1 request that mirrors audio.cpp's own native `/live`,
        so a programmatic client can treat the gateway as a drop-in. The BODY is
        raw interleaved PCM, streamed chunked; the client ends the session by
        finishing it (the terminating chunk): there is no WebSocket, no ticket and
        no `{"type":"end"}`. The parameters (`model`, `sample_rate`, `channels`,
        `sample_format`, `language`) are in the QUERY string. The response is
        the upstream's SSE, relayed verbatim and flushed with the headers first
        (a full-duplex client waits for them before it sends audio).
        Auth is the same as /v1/audio/transcriptions: scope `gateway:use` or
        `llm:invoke`, a bearer token (a user's or a service's) OR the internal
        trusted-loopback header pair (unreachable by any external client, which is
        why only bearerAuth is modelled below), never a portal session cookie, so
        there is no CSRF step. This is the CANONICAL relay of live transcription:
        the portal's WebSocket (GET /api/portal/transcription-live) loops back
        to it over the loopback pair, so a portal session is one more client of
        this endpoint and bills here, as the loopback user.
        In order, each a refusal before any PCM moves: a method other than POST
        is 405; no or an invalid bearer (a session cookie alone included) is 401;
        a missing scope 403 `auth.insufficient_scope`; a blank `model` 400
        `transcription.model_required`; params outside the accepted set 400
        `transcription.live_params_invalid`; then the buffered transcription's own
        gate and the principal's ONE rate/quota/budget admission (403
        `model.not_allowed` or `server_override.forbidden`, 429 `limit.rate_limited`
        (with Retry-After), `limit.request_quota_exceeded` or
        `limit.token_quota_exceeded`, 402 `limit.cost_budget_exceeded`), the
        resolve (404 `routing.no_model_route` or `routing.model_not_capable`, 503
        `routing.no_healthy_host` or `routing.admission_queue_timeout`/`_full`),
        the mapping's stored `transcription_streaming = yes` verdict (409
        `transcription.live_not_streaming`) and, for a `server_agent` target,
        positive evidence the agent declared `fullduplex_proxy` (409
        `transcription.live_agent_unsupported`; a direct `audio_cpp` target is
        exempt), and finally the per-route session slot (audio.cpp serves one
        `/live` per model: a second session is 503 `transcription.live_busy`,
        refused before a byte moves, with no usage row). A dial failure is the
        mapped provider error and a non-2xx upstream answer (the agent's 404 or
        503, a child error) is relayed under the upstream's own status.
        The 30 s deadlines are lifted and the streaming idle watchdog
        (OP_AI_GATEWAY_STREAM_IDLE_TIMEOUT) applies: a client that stops reading
        the SSE is cut, its slot released and its session billed a loud zero.
        Metered in seconds of audio (`billing_unit: audio_second`): the PCM bytes
        received over the byte rate of the validated params, on a clean end only
        (the terminating chunk, then `transcript.text.done` and `[DONE]`); any
        other end (a truncated body, an idle reap, an upstream error) is
        `audio_second` 0 with an Error log line. The row is attributed to the
        bearer token (its service and project for a service token). A reverse
        proxy in front must not buffer the request body. Alias:
        /openai/v1/audio/transcriptions/live. See api-surface.md and
        compatibility-and-inference.md section 3.8.
      parameters:
        - name: model
          in: query
          required: true
          description: The gateway model name (trimmed, non-empty; blank is 400 `transcription.model_required`).
          schema: { type: string, minLength: 1 }
        - name: sample_rate
          in: query
          required: true
          description: The PCM sample rate in Hz of the request body (audio.cpp's own range).
          schema: { type: integer, minimum: 1000, maximum: 384000 }
        - name: channels
          in: query
          required: true
          description: The number of interleaved channels in the request body (audio.cpp's own range).
          schema: { type: integer, minimum: 1, maximum: 16 }
        - name: sample_format
          in: query
          required: true
          description: >
            The sample encoding, 2 bytes per sample for `s16le` and 4 for `f32le`.
            The validated triple is forwarded to the backend AND is the rate the
            session bills at.
          schema: { type: string, enum: [s16le, f32le] }
        - name: language
          in: query
          required: false
          description: Optional language tag or name; empty or absent lets the backend detect the language.
          schema: { type: string, maxLength: 64, pattern: '^[A-Za-z0-9_-]*$' }
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        description: >
          Raw interleaved PCM in the query's `sample_rate`/`channels`/`sample_format`,
          sent with `Transfer-Encoding: chunked` and finished with the terminating
          chunk, which is what ends the session cleanly.
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: >
            The upstream's own SSE, relayed verbatim and flushed (the response
            headers are flushed before any body byte): `transcript.text.delta`
            (append), `transcript.text.partial` (replace the provisional
            transcript), `transcript.text.done` (the final transcript), an `error`
            event, then `data: [DONE]`.
          content:
            text/event-stream:
              schema: { type: string }
        '400':
          description: >
            The Error envelope with code `transcription.model_required` (a blank
            `model`) or `transcription.live_params_invalid` (`sample_rate`,
            `channels`, `sample_format` or `language` outside the accepted set).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402':
          description: The Error envelope with code `limit.cost_budget_exceeded` (the principal's cost budget).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: >
            The Error envelope: `auth.insufficient_scope`, `model.not_allowed` (the
            effective model is outside a service account's allowlist) or
            `server_override.forbidden`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { description: 'Any method other than POST (Allow: POST).' }
        '409':
          description: >
            The Error envelope with code `transcription.live_not_streaming` (the
            mapping has no transcription_streaming = yes verdict) or
            `transcription.live_agent_unsupported` (the agent has not declared
            fullduplex_proxy: older than 0.12.0, or not reported since the gateway
            restarted or the agent was upgraded).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: >
            The Error envelope with code `limit.rate_limited` (with a Retry-After
            header), `limit.request_quota_exceeded` or `limit.token_quota_exceeded`:
            the one admission a live session spends.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: >
            The Error envelope with code `transcription.live_busy` (the route
            already has an active live session; retry when it ends),
            `routing.no_healthy_host` (every candidate is gated) or
            `routing.admission_queue_timeout` / `routing.admission_queue_full`.
            A non-2xx answer from the agent or the child is relayed under the
            upstream's own status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
