  /v1/models:
    get:
      tags: [inference]
      summary: OpenAI-shaped model listing
      description: >
        Bearer-only (scope `gateway:use` or `llm:invoke`). Discovery is
        unfiltered by a service token's own allowlist but IS filtered by
        resource-group provisioning visibility. Each entry carries the
        model's usable context window as `context_length` when it is known;
        the field is omitted, never 0, when no mapping reports one. A token
        with the claude_model_aliases setting also sees its generated Claude
        alias rows (`anthropic-local-<hash>` ids), which alone carry
        original_model_id and the honest display_name as siblings of
        `capabilities` (see the OriginalModelId schema). Alias:
        /openai/v1/models.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The models offered under the `openai` flavor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpenAIModelList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /openai/v1/models:
    get:
      tags: [inference]
      summary: Alias of /v1/models
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The models offered under the `openai` flavor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpenAIModelList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /anthropic/v1/models:
    get:
      tags: [inference]
      summary: Anthropic-shaped model listing
      description: >
        Bearer-only, scope `gateway:use`. Lists the models offered under the
        `anthropic` flavor. A token with the claude_model_aliases setting also
        sees its generated Claude alias rows (`anthropic-local-<hash>` ids),
        whose display_name is the honest label and which alone carry
        original_model_id (see the OriginalModelId schema).
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The models offered under the `anthropic` flavor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnthropicModelList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/models:
    get:
      tags: [inference]
      summary: LM Studio v2-shaped model listing (emulated metadata only)
      description: >
        The native listing LM Studio's own clients read each model's context
        window from; actual chat still goes over /v1/chat/completions.
        Bearer-only (scope `gateway:use` or `llm:invoke`), and it lists
        exactly the names /v1/models lists. Unlike /v1/models,
        `max_context_length` is always present (0 when the window is
        unknown). A generated Claude alias row alone carries
        original_model_id. Alias: /openai/api/v1/models (there is no /anthropic/
        variant). LM Studio's earlier /api/v0/models is not served and
        answers 404.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The models offered under the `openai` flavor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LMStudioModelList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /openai/api/v1/models:
    get:
