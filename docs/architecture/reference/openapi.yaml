  # ── 3. Portal: tokens, chats, usage ───────────────────────────────────────
  /api/portal/tokens:
    description: >
      Own API tokens. Besides the model-settings fields, a token carries a
      vendor_access policy (see the TokenVendorAccess schema): which of the
      owner's vendor ("Anbieter") accounts the token may use. Strict opt-in:
      a token without the field has NO vendor access. The same field is
      writable on create and update and readable on the list. A token also
      carries the opt-in claude_model_aliases flag (default false, always
      present on a read): when true, its eligible local models and groups are
      additionally listed and resolved under generated `anthropic-local-<hash>`
      ids (see the OriginalModelId schema and api-surface.md). A token also
      carries the opt-in claude_effort_compatibility flag (default false,
      always present on a read): when true, Claude Code's output_config.effort
      is delivered to a llama.cpp or vLLM target as
      chat_template_kwargs.reasoning_effort. Unlike claude_model_aliases it is
      MANAGEMENT-ONLY to set: only a portal session or an admin-scope bearer
      may create a token with it true or send it on an update; an
      inference-only bearer (even on its own token) gets 403
      portal.principal_forbidden and nothing is written.
    get:
      tags: [portal]
      summary: List own API tokens (each row carries vendor_access when the token has any)
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: >
            The caller's tokens, the synthetic non-deletable chat-session row
            first. vendor_access is omitted for a token with no vendor access
            (and for the chat-session row, whose session always sees all of
            the owner's accounts). Other row fields are defined by the Go DTO
            (see api-surface.md).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      properties:
                        vendor_access: { $ref: '#/components/schemas/TokenVendorAccess' }
                        claude_model_aliases: { type: boolean }
                        claude_effort_compatibility: { type: boolean }
    post:
      tags: [portal]
      summary: Create an API token (optionally with a vendor_access policy)
      description: >
        An absent vendor_access is the strict default (no vendor access). A
        supplied policy with all=false is validated against the caller's own
        accounts: an unknown, foreign or repeated account id, or an enabled
        override prefix that is not a valid model prefix, is a 400
        portal.token_vendor_access_invalid; two selected accounts whose
        effective public model names collide is a 400
        portal.token_vendor_access_conflict. all=true is stored without
        per-account validation. A failure to read the caller's accounts is a
        500, not one of these; a failure to read one account's models is
        logged and skipped. A claude_effort_compatibility of true is a
        management setting: an inference-only bearer is refused with 403
        portal.principal_forbidden and no token is created.
      security: [{ sessionCookie: [], csrfHeader: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: >
                Token fields as defined by the Go DTO (see api-surface.md);
                only vendor_access, claude_model_aliases and
                claude_effort_compatibility are modeled here.
              additionalProperties: true
              properties:
                vendor_access: { $ref: '#/components/schemas/TokenVendorAccess' }
                claude_model_aliases:
                  type: boolean
                  description: Opt into the generated Claude model aliases. Absent means off.
                claude_effort_compatibility:
                  type: boolean
                  description: >
                    Opt into Claude Code effort compatibility. Absent means
                    off. MANAGEMENT-ONLY: true is accepted only from a portal
                    session or an admin-scope bearer (otherwise 403
                    portal.principal_forbidden); false needs no privilege.
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/portal/tokens/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      tags: [portal]
      summary: Update an own API token (vendor_access replaces the stored policy wholesale)
      description: >
        An absent vendor_access keeps the stored policy; a present one
        REPLACES it wholesale (an empty one resets to the strict default of no
        vendor access) after the same validation as on create
        (portal.token_vendor_access_invalid / portal.token_vendor_access_conflict,
        both 400). A present claude_effort_compatibility is a management
        setting: an inference-only bearer is refused with 403
        portal.principal_forbidden before any field is applied.
      security: [{ sessionCookie: [], csrfHeader: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: >
                Token fields as defined by the Go DTO (see api-surface.md);
                only vendor_access, claude_model_aliases and
                claude_effort_compatibility are modeled here.
              additionalProperties: true
              properties:
                vendor_access: { $ref: '#/components/schemas/TokenVendorAccess' }
                claude_model_aliases:
                  type: boolean
                  description: Replaces the stored flag when present; absent keeps it.
                claude_effort_compatibility:
                  type: boolean
                  description: >
                    Replaces the stored flag when present (true or false);
                    absent keeps it. MANAGEMENT-ONLY: ANY present value, on
                    this token or another, is accepted only from a portal
                    session or an admin-scope bearer (otherwise 403
                    portal.principal_forbidden, and no other field of the same
                    request is applied either).
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [portal]
      summary: Delete an own API token
      security: [{ sessionCookie: [], csrfHeader: [] }, { bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
  /api/portal/tokens/{id}/rotate:
    post:
      tags: [portal]
      summary: Rotate an own API token
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      security: [{ sessionCookie: [], csrfHeader: [] }, { bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
  /api/portal/chats:
    get:
      tags: [portal]
      summary: List own portal chats
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
    post:
      tags: [portal]
      summary: Create a portal chat
      security: [{ sessionCookie: [], csrfHeader: [] }, { bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/OpaqueJSON' }
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
  /api/portal/chats/{id}:
    description: >
      Chat detail plus run sub-paths (run start, SSE run events, run cancel)
      under /api/portal/chats/{id}/runs… — see api-surface.md. The chat
      document's settings.audio (a speech thread) is a ChatAudioSettings
      (below), including the retention keep_last_audio of the audio answer
      lifecycle (ADR-071); PUT is refused with 409 portal.chat_run_active while
      a run is active for the chat. The audio of a stored answer is removed
      through the two audio sub-paths below, never by writing the document.
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [portal]
      summary: Chat detail
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
    put:
      tags: [portal]
      summary: Update a chat
      security: [{ sessionCookie: [], csrfHeader: [] }, { bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/OpaqueJSON' }
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
    delete:
      tags: [portal]
      summary: Delete a chat
      security: [{ sessionCookie: [], csrfHeader: [] }, { bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
  /api/portal/chats/{id}/messages/{messageID}/audio:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: 'Chat id, "chat_" + hex.' }
      - { name: messageID, in: path, required: true, schema: { type: string }, description: 'The id of a stored message of the chat (the assistant answer whose audio is deleted).' }
    delete:
      tags: [portal]
      summary: Delete the stored audio of one spoken answer (leaves the audio_removed marker)
      description: >
        Removes the audio of ONE assistant answer of an owned chat (ADR-071, the
        audio answer lifecycle): every audio_url part of the message, however
        many ordered parts a long ADR-070 answer spans, is dropped and the
        message gains one audio_removed content part, while the message itself
        keeps its id, its place and every other member. The rewritten document
        and the delete of the answer's chat_blobs rows are ONE atomic save
        (SaveChatWithBlobs with deleteBlobIDs), so the stored document never
        points at a deleted blob and a failed save changes neither. A message
        with no stored audio of its own (a text answer, an answer whose audio is
        already gone, a user turn, whose audio is a transcription clip and never
        an answer's) is a 200 no-op that writes nothing, so the call is safe to
        repeat. Standard portal auth (a session cookie also needs the CSRF
        header, a bearer token does not; scope gateway:use). 404
        portal.chat_not_found is the answer for a missing chat, another owner's
        chat AND a message id the chat does not hold (no existence leak). 409
        portal.chat_run_active while a run is active for that chat, the guard of
        PUT /api/portal/chats/{id}: the call rewrites the whole document and
        would race the run's checkpoint or terminal commit. See api-surface.md.
      security: [{ sessionCookie: [], csrfHeader: [] }, { bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/OkTrue' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { description: 'Any method other than DELETE (Allow: DELETE).' }
        '409': { $ref: '#/components/responses/ChatRunActive' }
  /api/portal/chats/{id}/audio/prune:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: 'Chat id, "chat_" + hex.' }
    post:
      tags: [portal]
      summary: Prune a chat's stored audio down to the newest N answers (the retroactive half of the retention setting)
      description: >
        Prunes an owned chat's stored audio to the newest keep_last assistant
        answers that hold audio (ADR-071). Every older answer becomes the
        not-stored audio_removed marker and ALL of its blobs are deleted, in one
        atomic save; keep_last 0 removes every answer's audio. The client states
        only the count: which answers and blobs go is computed server-side from
        the stored document, so a stale or hostile client cannot name another
        answer's audio. N counts answers, not blobs, and an answer already in the
        not-stored state takes no slot. The call does NOT change the thread's
        stored keep_last_audio setting (the portal saves that itself, after the
        prune succeeded). A chat already within the count is a 200 no-op. A
        missing, null or negative keep_last is 400
        portal.chat_audio_keep_last_invalid; a value that is not a whole number
        is the decoder's 400 request.invalid_json. Same auth, 404 and 409
        behavior as DELETE /api/portal/chats/{id}/messages/{messageID}/audio.
        See api-surface.md.
      security: [{ sessionCookie: [], csrfHeader: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatAudioPruneRequest' }
      responses:
        '200': { $ref: '#/components/responses/OkTrue' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { description: 'Any method other than POST (Allow: POST).' }
        '409': { $ref: '#/components/responses/ChatRunActive' }
  /api/portal/chat-blobs/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: 'Blob id, "blob_" + 32 hex digits, as it appears in an image_url.url or audio_url.url of a stored chat transcript.' }
    get:
      tags: [portal]
      summary: Raw bytes of one stored chat image, speech WAV or transcription clip (owner-scoped, hardened)
      description: >
        Serves a chat binary payload (an image, a speech reply's WAV, or a
        transcription run's input audio clip)
        referenced from a transcript by image_url.url or audio_url.url
        "/api/portal/chat-blobs/{id}" (ADR-056, ADR-063, ADR-064). Standard portal
        auth (session cookie, else bearer or internal loopback, scope
        gateway:use); the browser's <img> uses the cookie, through the passive
        variant of the session check (the session is validated but its idle
        window is not extended). Ownership applies whatever the credential.
        Authorization is on the blob's own chat: it must belong to
        the session's user, otherwise 404 portal.chat_blob_not_found, which is
        also the answer for a missing, deleted, evicted or non-servable blob (no
        existence leak). The response Content-Type is always one of the
        allow-listed image/png, image/jpeg, image/webp, image/gif, audio/wav
        (a speech reply) and the transcription clip input types audio/webm,
        audio/mpeg, audio/mp4, audio/ogg,
        and the response carries X-Content-Type-Options nosniff, a
        Content-Security-Policy of default-src 'none', Content-Disposition
        inline and Cache-Control private, no-store. The body is written whole
        with a Content-Length and no Range request is answered. 500
        portal.chat_blob_failed when the store or the cipher fails.
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: The decrypted image, speech WAV or transcription clip bytes.
          headers:
            X-Content-Type-Options: { schema: { type: string, enum: [nosniff] } }
            Content-Security-Policy: { schema: { type: string, enum: ["default-src 'none'"] } }
            Content-Disposition: { schema: { type: string, enum: [inline] } }
            Cache-Control: { schema: { type: string, enum: ['private, no-store'] } }
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
            image/gif: { schema: { type: string, format: binary } }
            audio/wav: { schema: { type: string, format: binary } }
            audio/webm: { schema: { type: string, format: binary } }
            audio/mpeg: { schema: { type: string, format: binary } }
            audio/mp4: { schema: { type: string, format: binary } }
            audio/ogg: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { description: 'Any method other than GET (Allow: GET).' }
        '500':
          description: >
            The Error envelope with code portal.chat_blob_failed (store or
            cipher failure; never reported as a 404).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/portal/usage:
    get:
      tags: [portal]
      summary: Own usage analytics (fleet-wide with `admin` scope + scope=all)
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
