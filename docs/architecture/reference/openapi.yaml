  /api/portal/servers/{id}/runtime/events:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [portal]
      summary: Live per-spec runtime status (SSE)
      description: >
        text/event-stream. Events "snapshot" and "update" both carry the
        COMPLETE row set wrapped as {"runtimes":[...]} — not {"data":[...]}
        like the other portal streams — so a consumer replaces, never appends.
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/SSE' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/portal/servers/{id}/runtime/logs:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [portal]
      summary: Live stdout+stderr of one managed model process (SSE)
      description: >
        text/event-stream. A "status" event states whether a live stream is
        possible at all -- {"state":"streaming"|"unsupported"|"offline"} -- and
        is re-sent whenever that changes, so an empty window always carries a
        reason. Then a "log" event per agent flush:
        {"spec_id","scrollback","entries":[...]}. The FIRST log event carries
        scrollback=true and replays the agent's retained history (possibly
        empty, which means the agent's buffer holds nothing); a consumer must
        RESET on it, never append, because a reconnect delivers a fresh one.
        That guarantee is per subscriber and does not depend on the size of the
        history: a large one crosses the agent-to-gateway hop as several frames,
        but the gateway always forwards it as ONE scrollback=true event followed
        by ordinary appends, so a consumer needs no notion of chunking.
        Each entry is either verbatim process output ("text") or a boundary
        marker from the closed set ("event": started|exited|start_failed).
        "start_failed" opens a generation whose exec itself failed, so it has no
        pid, no exit code, and no output will follow it.
        An OPENING marker ("started" or "start_failed") additionally carries
        "command": the launch command that generation actually ran, resolved --
        {"binary","args","work_dir","env","masked","env_redacted","truncated"}.
        Every ${AGENT_ENV:NAME}-derived value is replaced agent-side by its
        own placeholder ("masked": true); on a file-mode agent every value
        the spec sets in "env" is additionally withheld in full, keys intact
        ("env_redacted": true). The two are independent reasons and both can
        be set at once. The masking covers the REPORTED COMMAND only -- a
        model server that prints its own argv at startup puts the resolved
        value into this stream, and nothing agent-side can mask that. The
        gateway drops over-long entries whole ("truncated": true) and never
        re-masks, and the field is stripped from any entry that is not an
        opening marker. On a spec that fails to start
        it is the entire content of this view. "dropped_bytes" on an entry means
        N bytes the process printed are missing immediately
        before it. Nothing on this path is persisted -- not to disk, not to the
        database. Subscribing is what makes the agent stream this spec, and
        unsubscribing is what stops it.
        Error codes: 400 runtime_logs.spec_required (spec_id absent),
        400 runtime_logs.spec_invalid (spec_id too long -- the id is also
        shipped to the agent inside the watch command, so it is rejected rather
        than clamped), 503 runtime_logs.too_many_specs (this server already has
        the maximum number of distinct specs under view).
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      parameters:
        - { name: spec_id, in: query, required: true, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/SSE' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
