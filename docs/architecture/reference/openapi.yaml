  # ── 3. Portal: vendor accounts (Anbieter) ─────────────────────────────────
  /api/portal/vendor-accounts:
    description: >
      External vendor accounts ("Anbieter"), each owned by one user. Authorization
      is by share level inside portal.Service: an account is personal (share_level
      none) until its owner, an admin, raises it to shared or full; then a
      co-manager (CM, a holder of can_manage_vendor_accounts in a management group
      the account is assigned to) may operate it at shared and manage it fully at
      full, and a member (provisioned into a resource group that contains it) gets
      a minimal key-free read and may use it once a token opts in. A stranger gets
      the 404 of an unknown id; a CM who can see the account but may not do the
      thing gets 403 vendor_account.forbidden. Secrets are write-only for every
      viewer; the whole surface 409s with vendor_accounts.module_disabled while
      vendor_accounts_enabled is off. The narrower vendor_subscriptions_enabled
      switch (default on) additionally 409s creating a subscription account and
      every connect operation with vendor_accounts.subscriptions_disabled while it
      is off, and the sharing endpoints 409 with vendor_accounts.sharing_disabled
      while vendor_account_sharing_enabled (default off) is off.
      See api-surface.md for the request/response shapes and error codes.
    get:
      tags: [portal]
      summary: List the vendor accounts the caller can see (own, managed, routable as a member)
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: >
            The accounts the caller owns (oldest first), then, for a non-system
            caller, the shared accounts they manage as a CM, then the shared
            accounts they can only route to as a member (each arm oldest first,
            an account listed once in the first arm that holds it; system scope
            does not widen the list; with the sharing switch off it is the
            caller's own accounts only). An own or managed row is the management
            view and carries its rate-limit usage snapshot when one has been
            stored (omitted otherwise, and omitted for a row whose snapshot could
            not be read: the list never fails over it). A member-only row is the
            minimal key-free view (see the VendorAccount schema).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/VendorAccount' }
    post:
      tags: [portal]
      summary: Create a vendor account (seeded with a static model set under its prefix; an OpenAI-compatible or google_native one is filled by a best-effort discovery)
      security: [{ sessionCookie: [], csrfHeader: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VendorAccountCreateRequest' }
      responses:
        '201':
          description: The credential-free account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorAccount' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/VendorAccountsUnavailable' }
  /api/portal/vendor-accounts/enabled:
    get:
      tags: [portal]
      summary: Whether the vendor-accounts module is enabled, whether subscription accounts are allowed, and whether sharing (and subscription sharing) is on
      description: >
        Four booleans and nothing else: module_enabled (the vendor_accounts_enabled
        master flag), subscriptions_enabled (the vendor_subscriptions_enabled
        switch, default true), sharing_enabled (the
        vendor_account_sharing_enabled master switch as stored, default false) and
        subscription_sharing_enabled (the vendor_subscription_sharing_enabled
        switch as stored, default false). The routing mode and every other
        setting are never reported. Answers for any portal user even while the
        module is off, so the portal can show or hide the nav item and the
        sharing controls (including the raise of a subscription account to
        shared) without the system-scoped settings read.
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: The four switches
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorAccountsEnabled' }
  /api/portal/vendor-accounts/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [portal]
      summary: Vendor-account detail (includes the usage snapshot for a management view)
      description: >
        Rendered in the view the caller's relation to the account earns: the
        management view for the owner, a CM of a shared or full account and
        system scope; the minimal key-free member view for a principal that can
        only route to it through a resource group (reach, not the token opt-in,
        is what admits it); anyone else gets the 404 of an unknown id.
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: The credential-free account, with its rate-limit usage snapshot when one has been scraped (management view only)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorAccount' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VendorAccountsUnavailable' }
    patch:
      tags: [portal]
      summary: Update a vendor account (write-only api_key sentinel; a model_prefix re-labels the stored models)
      description: >
        Partial update; an absent field keeps its stored value. api_key and
        model_prefix take the keep (absent or null) / clear ("") / replace
        (value) sentinel. A request that carries model_prefix re-labels the
        account's stored model rows to the prefix plus each vendor id without
        asking the vendor again. A prefix longer than 64 characters, containing
        "..", or containing anything but A-Z a-z 0-9 - _ . ~ : / @ + is a 400
        vendor_account.model_prefix_invalid. Authorization is per field, deny by
        default: a body whose every present field is name, status or model_prefix
        needs the operate gate (the owner, or a CM of a shared or full account);
        a body that carries anything else (api_key above all, and base_url or
        auth_type even when merely echoed) needs the credential gate (the owner,
        or a CM of a full account; a CM of a shared account gets 403
        vendor_account.forbidden and nothing is written), and a mixed body takes
        the stricter. base_url and auth_type are create-only: changing either is a
        400 vendor_account.field_immutable (a value equal to the stored one is not
        a change). An operate-only PATCH writes only the columns it names, never
        a credential column.
      security: [{ sessionCookie: [], csrfHeader: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VendorAccountUpdateRequest' }
      responses:
        '200':
          description: The credential-free account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorAccount' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [portal]
      summary: Delete a vendor account (credential gate)
      description: >
        The credential gate: the owner at every level, a CM of a full account; a
        CM of a shared account gets 403 vendor_account.forbidden, anyone else the
        404 of an unknown id (system scope included). The delete cascades the
        account's models, usage, management-group links and resource-group links,
        and so revokes every borrower. Answers ok true. A 409
        vendor_accounts.module_disabled while the vendor_accounts_enabled master
        flag is off, whoever asks.
      security: [{ sessionCookie: [], csrfHeader: [] }, { bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/OkTrue' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VendorAccountsUnavailable' }
  /api/portal/vendor-accounts/{id}/connect/import:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [portal]
      summary: Connect a subscription account from imported OAuth tokens (validated fail-soft)
      description: >
        Body {access_token, refresh_token?, expires_at?}. The access token is
        checked against the vendor before it is stored; a definitive rejection
        is a 400 with vendor_account.connect_invalid_credentials and nothing is
        stored, an unreachable or inconclusive vendor still stores. Once the
        tokens are stored a best-effort model discovery (bounded to 5 seconds,
        never failing the connect) replaces the seeded models with the vendor's
        real list; the answer carries them when it succeeded. Every connect route
        is the credential gate: the owner, or a CM of a full account (a CM of a
        shared account gets 403 vendor_account.forbidden, anyone else 404).
      security: [{ sessionCookie: [], csrfHeader: [] }, { bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/OpaqueJSON' }
      responses:
        '200':
          description: The credential-free account, with the discovered models when the discovery succeeded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorAccount' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VendorAccountsUnavailable' }
  /api/portal/vendor-accounts/{id}/check:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [portal]
      summary: Test the connection (model-independent credential check)
      description: >
        No request body. Asks the vendor whether the account's stored credential
        is accepted and answers a VendorConnectionCheck. An operate call: the
        owner, or a CM of a shared or full account, never system scope alone (a
        stranger gets the same 404 as an unknown id). On a subscription account
        it is owner-only even at shared, because it opens the single-use OAuth
        token set (403 vendor_account.forbidden for a CM). Changes nothing and
        never returns a credential (the detail is scrubbed of it). A rejected
        credential is a 200 with status invalid, not an error; a stored
        credential that cannot be opened (lost encryption key, corrupt blob) is
        a 409 vendor_account.credential_unreadable.
      security: [{ sessionCookie: [], csrfHeader: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: The verdict on the account's stored credential
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorConnectionCheck' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >
            The account cannot be checked -- vendor_account.credential_unreadable
            (the stored credential cannot be opened; reconnect the account) or
            vendor_accounts.module_disabled while the master flag is off. The
            Error envelope carries the stable code.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/portal/vendor-accounts/{id}/models/refresh:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [portal]
      summary: Refresh the account's models from the vendor
      description: >
        No request body. Asks the vendor which models the account's stored
        credential can use and, when it answers with a usable list, replaces the
        account's models with it (each served as the account's model_prefix plus
        the vendor's id; at most 1000 models, each slug and display name validated
        and capped). A subscription access token already past its expiry is
        renewed first through the gateway's own locked token refresh. Answers the
        credential-free account and a VendorModelsRefreshResult. Fail-soft: when
        nothing usable can be had the models are kept and the answer is still a
        200 with refresh.status unverifiable (the account then already reads
        needs_reconnect when the vendor rejected the refresh token). An operate
        call gated like the connection test: the owner, or a CM of a shared or
        full account, never system scope alone (404 for a stranger), and
        owner-only even at shared for a subscription account, because the refresh
        can rotate its single-use token (403 vendor_account.forbidden for a CM).
        A stored credential that cannot be opened is a 409
        vendor_account.credential_unreadable; an uncategorized failure (a store
        error) is a 500 vendor_account.refresh_failed.
      security: [{ sessionCookie: [], csrfHeader: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: The account as it now serves its models, and what the refresh did
          content:
            application/json:
              schema:
                type: object
                required: [account, refresh]
                properties:
                  account: { $ref: '#/components/schemas/VendorAccount' }
                  refresh: { $ref: '#/components/schemas/VendorModelsRefreshResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >
            The account cannot be refreshed -- vendor_account.credential_unreadable
            (the stored credential cannot be opened; reconnect the account) or
            vendor_accounts.module_disabled while the master flag is off. The
            Error envelope carries the stable code.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: >
            vendor_account.refresh_failed -- the refresh failed for a reason
            outside the known states (a store failure). A vendor that cannot be
            asked is not this: it is a 200 with refresh.status unverifiable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/portal/vendor-accounts/{id}/usage/refresh:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [portal]
      summary: Refresh the account's usage snapshot from the vendor (OpenAI subscription, OpenRouter and Kilo api keys)
      description: >
        No request body. Pulls the account's usage snapshot from the vendor
        without re-listing its models and answers the stored snapshot as it is
        after the pull, plus a VendorUsageRefreshResult. Only an OpenAI
        subscription and an OpenRouter or Kilo api-key account have an active
        pull (OpenRouter asks GET {base_url}/v1/key for the key's own limit and
        usage in USD, Kilo asks the undocumented GET {base_url}/profile/balance
        for a credit balance, best effort); any other account answers
        refresh.status unsupported and no credential is opened. An api-key
        account with no key set answers unverifiable. Without a query
        it is the on-view-lazy call: when the account's last active pull (held
        in memory per account, recorded only when the vendor was actually
        reached) is younger than the server's TTL of 5 minutes the vendor is not
        asked and the answer is fresh. force=1 (the manual refresh button)
        bypasses the TTL and always asks. An expired subscription token is
        renewed first through the gateway's own locked token refresh; an
        api-key account has nothing to renew. Fail-soft: a vendor that cannot be asked is a 200 with refresh.status
        unverifiable and the stored snapshot kept. An operate call gated like
        the connection test: the owner, or a CM of a shared or full account,
        never system scope alone (404 for a stranger), and owner-only even at
        shared for a subscription account (the pull renews the token first, the
        lazy on-view pull included; 403 vendor_account.forbidden for a CM). A
        stored credential (a token set or an api key) that cannot be opened is
        a 409 vendor_account.credential_unreadable; an uncategorized failure (a store
        error) is a 500 vendor_account.usage_refresh_failed.
      security: [{ sessionCookie: [], csrfHeader: [] }, { bearerAuth: [] }]
      parameters:
        - name: force
          in: query
          required: false
          description: >
            1 or true (also t, T, TRUE, True) bypasses the lazy TTL; absent,
            false or any other value is the lazy call.
          schema: { type: string }
      responses:
        '200':
          description: The stored usage snapshot after the call, and what the refresh did
          content:
            application/json:
              schema:
                type: object
                required: [usage, refresh]
                properties:
                  usage:
                    description: The account's stored usage snapshot (the same object as the detail read's usage), or null when none has been stored.
                    oneOf:
                      - { $ref: '#/components/schemas/VendorAccountUsage' }
                      - { type: 'null' }
                  refresh: { $ref: '#/components/schemas/VendorUsageRefreshResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { description: 'Any method other than POST (Allow: POST).' }
        '409':
          description: >
            The usage cannot be refreshed -- vendor_account.credential_unreadable
            (the stored credential cannot be opened; reconnect the account) or
            vendor_accounts.module_disabled while the master flag is off. The
            Error envelope carries the stable code.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: >
            vendor_account.usage_refresh_failed -- the refresh failed for a
            reason outside the known states (a store failure). A vendor that
            cannot be asked is not this: it is a 200 with refresh.status
            unverifiable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/portal/vendor-accounts/{id}/connect/begin:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [portal]
      summary: Start the OAuth code-paste connect (returns authorize_url)
      security: [{ sessionCookie: [], csrfHeader: [] }, { bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
        '409': { $ref: '#/components/responses/VendorAccountsUnavailable' }
  /api/portal/vendor-accounts/{id}/connect/complete:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [portal]
      summary: Finish the OAuth code-paste connect (exchange the pasted code)
      description: >
        Body {code}. Like the token import, a successful connect runs a
        best-effort model discovery and the answer carries the discovered models
        when it succeeded.
      security: [{ sessionCookie: [], csrfHeader: [] }, { bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/OpaqueJSON' }
      responses:
        '200':
          description: The credential-free account, with the discovered models when the discovery succeeded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorAccount' }
        '409': { $ref: '#/components/responses/VendorAccountsUnavailable' }
  /api/portal/vendor-accounts/{id}/connect/device/begin:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [portal]
      summary: Start the OpenAI-only device-code login (returns user_code)
      security: [{ sessionCookie: [], csrfHeader: [] }, { bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
        '409': { $ref: '#/components/responses/VendorAccountsUnavailable' }
  /api/portal/vendor-accounts/{id}/connect/device/poll:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [portal]
      summary: Poll a begun device login (returns {connected})
      security: [{ sessionCookie: [], csrfHeader: [] }, { bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
        '409': { $ref: '#/components/responses/VendorAccountsUnavailable' }
  /api/portal/vendor-accounts/{id}/share-level:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      tags: [portal]
      summary: Move a vendor account to a share level (raise or lower)
      description: >
        Body {level, admin_group_ids?}; level is the TARGET (none, shared or
        full). A level above the stored one is a raise, anything else a lower.
        Raise: the owner, who must be an admin right now (the token carries the
        admin scope and the user's current role is admin or system_admin),
        carrying admin_group_ids with at least one management group (existing
        admin-tier groups the caller may name, all under one parent system group,
        which becomes the account's immutable containment root). A subscription
        account may be raised to shared only (400
        vendor_account.subscription_share_capped for full) and only while
        vendor_subscription_sharing_enabled is on (409
        vendor_accounts.subscription_sharing_disabled). Lower: the credential
        gate, so the owner at every level (ownership alone) and a CM at full
        only; lowering to none runs ClearVendorAccountSharing, one transaction
        that sets the level to none first, then deletes the management-group and
        resource-group links and clears the root (idempotent); full to shared
        changes only the level. Refusals, in order: 409 for the module and
        sharing switches (global, before any account is read), 400
        vendor_account.share_level_invalid, then the account (404 for a
        stranger, an unknown id and system scope; 403 vendor_account.forbidden
        for a caller who can see the account but may not raise or lower it), 400
        vendor_account.share_level_unchanged, the subscription cap and flag, and
        the group validation (400 vendor_account.admin_group_required, .admin_group_invalid,
        .admin_group_parent_mismatch, .root_mismatch).
      security: [{ sessionCookie: [], csrfHeader: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VendorAccountShareLevelRequest' }
      responses:
        '200':
          description: The credential-free account at its new level
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorAccount' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VendorAccountsUnavailable' }
  /api/portal/vendor-accounts/{id}/admin-groups:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      tags: [portal]
      summary: Replace the management groups of a shared vendor account
      description: >
        Body {admin_group_ids}. The credential gate's shape: the owner at every
        level, a CM at full only (403 vendor_account.forbidden for a CM of a
        shared account, 404 for a stranger, system scope included). The account
        must be shared or full (400 vendor_account.not_shared), the set must hold
        at least one group (400 vendor_account.admin_group_required), each an
        existing admin-tier group the caller may name (400
        vendor_account.admin_group_invalid), all under one parent (400
        vendor_account.admin_group_parent_mismatch) which must be the account's
        retained root (400 vendor_account.root_mismatch, checked for every
        principal). Additions are written first, so the account never has zero
        groups mid-write. 409 while the module or sharing switch is off.
      security: [{ sessionCookie: [], csrfHeader: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VendorAccountAdminGroupsRequest' }
      responses:
        '200':
          description: The credential-free account with its new management groups
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorAccount' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VendorAccountsUnavailable' }
  /api/portal/vendor-account-admin-group-candidates:
    get:
      tags: [portal]
      summary: Admin-tier groups the caller may name as management groups of a vendor account
      description: >
        System scope gets every admin-tier group; anyone else exactly the groups
        they manage vendor accounts through (owner of the group, or a
        co-manager holding can_manage_vendor_accounts), so a plain user gets an
        empty list. Each candidate carries its parent system group, the account's
        future containment root. 409 while the module or sharing switch is off.
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: The candidate groups, sorted by name
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AdminGroupCandidate' }
        '409': { $ref: '#/components/responses/VendorAccountsUnavailable' }
  /api/portal/vendor-accounts/{id}/resource-groups:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [portal]
      summary: Resource groups the owner may enter a shared vendor account into
      description: >
        The owner's resource-group self-service (read): every group linked to an
        admin group the owner is a member of (system scope: every group) and
        whose root is the account's, each with member = the account is in it.
        Owner only (403 vendor_account.forbidden for a CM who can see the
        account, 404 for everyone else, system scope included), on a shared or
        full account (400 vendor_account.not_shared). 409 while the module or
        sharing switch is off.
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: The reachable resource groups, sorted by name
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/VendorAccountResourceGroup' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VendorAccountsUnavailable' }
  /api/portal/vendor-accounts/{id}/resource-groups/{rgId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: rgId, in: path, required: true, schema: { type: string } }
    put:
      tags: [portal]
      summary: Join a resource group (owner self-service, idempotent)
      description: >
        Writes the single resource_group_vendor_accounts row, never a whole-set
        replace. Same account gate as the GET (owner only, shared or full); the
        group must be reachable by the owner (404 resource_group.not_found, also
        what a non-existent id gets) and under the account's root (400
        resource_group.vendor_account_system_group_mismatch). A co-manager of a
        full account links through the resource-group manager side instead. This
        only links: whether a member can use the account is the routing grant's
        decision (live share level, provisioning and the member token's
        per-account opt-in).
      security: [{ sessionCookie: [], csrfHeader: [] }, { bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/OkTrue' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VendorAccountsUnavailable' }
    delete:
      tags: [portal]
      summary: Leave a resource group (owner self-service, idempotent)
      description: >
        The single-row inverse of the PUT, with the same gates and no root check,
        so a link to another root can always be dropped.
      security: [{ sessionCookie: [], csrfHeader: [] }, { bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/OkTrue' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VendorAccountsUnavailable' }

