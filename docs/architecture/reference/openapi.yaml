    get:
      tags: [portal]
      summary: Resource groups a service manager may enter the service into
      description: >
        The service-side resource-group self-service (read): every resource group
        linked to an admin group the caller is a member of (system scope: every
        group), each with member = the service is provisioned into it (a
        resource_group_provisions row of kind service). Provisioning a service
        into a group is what lets its tokens reach the shared vendor accounts
        the group offers. The caller must manage the service (system scope, or a
        can_manage_services owner or co-manager of a linked admin group; a
        delegate does not qualify); anything else is a 404 service.not_found.
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: The reachable resource groups, sorted by name
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ServiceResourceGroup' }
        '404': { $ref: '#/components/responses/NotFound' }
