  # ── 3. Portal: models, servers, applications, mappings ───────────────────
  /api/portal/models:
    get:
      tags: [portal]
      summary: Model catalog visible to the caller
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
  /api/portal/model-servers:
    get:
      tags: [portal]
      summary: Servers offering a given model + live benchmark/loaded state
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/OpaqueJSON' }
  /api/portal/model-servers/events:
    get:
      tags: [portal]
      summary: SSE push on model load-state change
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/SSE' }
  /api/portal/model-image-options:
    get:
      tags: [portal]
      summary: Image options the sd-server(s) behind a gateway model state (scope gateway:use)
      description: >
        What the portal image composer may offer for one gateway model: the
        sampler/scheduler/output-format values, size envelope, batch ceiling
        and defaults its backing stable-diffusion.cpp sd-servers state,
        aggregated across them (lists intersected, size limits the tightest
        envelope, a default only where the servers that state it agree).
        Served from two volatile in-memory caches (the health loop's read of
        external applications, the agent telemetry sample for agent-launched
        children) with no upstream probe on the request, so it can be empty
        right after a gateway restart. A model the caller cannot route to, an
        unknown model and a model with nothing cached all answer 200 with an
        empty `data` object. An empty or absent field means UNKNOWN, never
        "none supported": the client falls back to its static superset. A
        missing or empty `name` is 400 `model.name_required`; a failed
        visibility read is 500 `model.image_options_failed`. See
        api-surface.md and compatibility-and-inference.md section 3.4.
      parameters:
        - name: name
          in: query
          required: true
          description: The gateway model name (a query parameter because it may contain `/`).
          schema: { type: string, minLength: 1 }
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: The aggregated options, possibly an empty object.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ModelImageOptions' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/portal/model-voices:
    get:
      tags: [portal]
      summary: Voice names cached for a speech model, for the portal voice picker (scope gateway:use)
      description: >
        What the portal chat's speech composer may offer in its `voice`
        combobox for one gateway model: the deduplicated, sorted union of the
        voices the health loop cached for the model's visible mappings (a group
        name is expanded to its members). It reads the same persistent cache as
        GET /v1/audio/voices (which refuses the session cookie a browser holds)
        through one shared union core, and differs only in the visibility rule,
        which is the portal's: for a non-admin a requested name that is
        `hidden` or `locked` answers the empty list (an admin bypasses it), this
        suppression applying to the REQUESTED name only, and the members of a
        group are filtered by resource-group provisioning ONLY, never by their
        own visibility, so a locked member's voices are listed through its
        group. Only mappings that are offerable now (`speech` yes and either
        not `speech_clone` yes or a non-empty cached list, so a clone model with
        configured presets contributes its preset names, ADR-075) contribute.
        Nothing is loaded and no upstream
        is contacted. Every "nothing to show" case (an unknown, hidden, locked,
        restricted or not-yet-cached model, a non-speech model, a clone model
        without presets) is the same 200
        with an empty `voices` list. A missing or empty `name` is 400
        `model.name_required`; a failed read is 500 `model.voices_failed`, never
        reported as an empty list. See api-surface.md and
        compatibility-and-inference.md section 3.6.
      parameters:
        - name: name
          in: query
          required: true
          description: The gateway model name (a query parameter because it may contain `/`).
          schema: { type: string, minLength: 1 }
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: The cached voices, possibly an empty list.
          content:
            application/json:
              schema:
                type: object
                required: [voices]
                properties:
                  voices:
                    type: array
                    items: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500':
          description: The Error envelope with code `model.voices_failed`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/portal/model-speech-streaming:
    get:
      tags: [portal]
      summary: Whether the speech composer may stream a model's audio, and at what sample rate (scope gateway:use)
      description: >
        The gate of the portal chat's speech-streaming run (ADR-068), for one
        gateway model. `streaming: true` with a `sample_rate` in Hz means the
        composer may offer progressive playback; `streaming: false` means the
        buffered WAV run. The gate is open only when EVERY mapping a speech
        request for the model could be routed to (the portal-visible offerable
        ones, the voice picker's set: a plain tts model, or a configured clone
        model with cached preset voices, which is rate-benchmarked with a preset
        voice since ADR-076 and so streams once its rate is cached, and until
        then closes the gate for any name that can reach it, ADR-075) has a
        `speech_streaming` verdict of `yes` and a usable cached output byte rate, and they agree on it; the
        sample rate is half the byte rate (the cache only holds a rate read from
        a mono 16-bit PCM WAV). Every other case (an unknown, hidden, locked,
        restricted, non-speech, reference-only-clone, offline or not-yet-benchmarked model) is
        the same 200 with `streaming: false`, so the answer cannot probe which
        models exist. A missing or empty `name` is 400 `model.name_required`; a
        failed read is 500 `model.speech_streaming_failed`, never reported as
        `streaming: false`. Nothing is loaded and no upstream is contacted. The
        run evaluates the same gate again server-side when it starts. See
        api-surface.md and compatibility-and-inference.md section 12.
      parameters:
        - name: name
          in: query
          required: true
          description: The gateway model name (a query parameter because it may contain `/`).
          schema: { type: string, minLength: 1 }
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: The gate's answer; `sample_rate` is present only when `streaming` is true.
          content:
            application/json:
              schema:
                type: object
                required: [streaming]
                properties:
                  streaming: { type: boolean }
                  sample_rate:
                    type: integer
                    description: The rate, in Hz, the headerless PCM of a streamed answer is played at.
        '400': { $ref: '#/components/responses/BadRequest' }
        '500':
          description: The Error envelope with code `model.speech_streaming_failed`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/portal/model-speech-language:
    get:
      tags: [portal]
      summary: Whether the speech composer may offer a language control for a model, and the model's declared default (scope gateway:use)
      description: >
        The gate of the portal chat's speech language control (ADR-074, issue
        #282), for one gateway model. `accepts: true` means the composer may
        offer a `language` field (sent as a top-level `language` on
        POST /v1/audio/speech) and `default` carries the value the model
        declares for it (for example `auto`, or a fixed code such as `zh`),
        present only when the model declares one; `accepts: false` means it
        does not. It reads the `speech_language` cache the health loop writes
        while a model is loaded (a static audio_cpp application, or an
        agent-launched child through the router's /upstream/{model}/v1/models,
        agent 0.13.0) for the mappings a speech request for the model could be
        routed to (the portal-visible offerable ones: a plain tts model, or a
        clone model with cached preset voices, the set the voice picker offers,
        ADR-075; the streaming gate reads the same set, where a clone model closes it while it has no cached rate, ADR-076). The gate opens when ANY such mapping is
        known to accept a language, unlike /api/portal/model-speech-streaming,
        which needs every mapping to agree: audio.cpp silently drops a
        `language` a model does not take, so offering the control costs
        nothing where the request lands on another mapping. `default` is the
        first accepting mapping's, a pre-fill and not a promise. Every other
        case (an unknown, hidden, locked, restricted or non-speech model, a
        clone model without presets, one whose language no probe has stated yet, one that declares
        no such param) is the same 200 with `accepts: false`, so the answer
        cannot probe which models exist. A missing or empty `name` is 400
        `model.name_required`; a failed read is 500
        `model.speech_language_failed`, never reported as `accepts: false`.
        Nothing is loaded and no upstream is contacted, and the run injects the
        thread's `language` without consulting this answer. See api-surface.md
        and compatibility-and-inference.md sections 3.6 and 12.
      parameters:
        - name: name
          in: query
          required: true
          description: The gateway model name (a query parameter because it may contain `/`).
          schema: { type: string, minLength: 1 }
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: The gate's answer; `default` is present only when `accepts` is true and the model declares one.
          content:
            application/json:
              schema:
                type: object
                required: [accepts]
                properties:
                  accepts: { type: boolean }
                  default:
                    type: string
                    description: The default language the model declares for its `language` param.
        '400': { $ref: '#/components/responses/BadRequest' }
        '500':
          description: The Error envelope with code `model.speech_language_failed`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/portal/model-transcription-streaming:
    get:
      tags: [portal]
      summary: Whether the transcription composer may offer its live record mode for a model (scope gateway:use)
      description: >
        The gate of the portal chat's live transcription mode (ADR-072, ADR-073,
        issue #266), for one gateway model. `streaming: true` means the composer
        may offer "live"; `streaming: false` means it does not. The gate is open
        only when the model has at least one portal-visible mapping with a
        `transcription` verdict of `yes` AND every such mapping also carries
        `transcription_streaming = yes` (fail-closed). Unlike
        /api/portal/model-speech-streaming it carries no sample rate: the live
        client fixes 16 kHz mono s16le and the ticket validates it. Every other
        case (an unknown, hidden, locked, restricted, non-transcription, offline or
        not-yet-probed model) is the same 200 with `streaming: false`, so the
        answer cannot probe which models exist. A missing or empty `name` is 400
        `model.name_required`; a failed read is 500
        `model.transcription_streaming_failed`, never reported as
        `streaming: false`. Nothing is loaded and no upstream is contacted, and the
        ticket evaluates the model again when it is minted. See api-surface.md and
        compatibility-and-inference.md section 3.8.
      parameters:
        - name: name
          in: query
          required: true
          description: The gateway model name (a query parameter because it may contain `/`).
          schema: { type: string, minLength: 1 }
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: The gate's answer.
          content:
            application/json:
              schema:
                type: object
                required: [streaming]
                properties:
                  streaming: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500':
          description: The Error envelope with code `model.transcription_streaming_failed`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/portal/transcription-live-ticket:
    post:
      tags: [portal]
      summary: Mint a single-use ticket for a live transcription WebSocket (scope gateway:use, CSRF on a session)
      description: >
        Step one of the portal's live transcription (ADR-072, ADR-073, issue
        #266): the authenticated, CSRF-protected request that makes the routing
        decision the WebSocket (GET /api/portal/transcription-live) then redeems,
        because a browser WebSocket cannot send X-OP-CSRF. In order: the body is validated
        (a body that is not JSON is 400 `request.invalid_json`; a blank `model` is
        400 `model.name_required`; `sample_rate` outside 1000-384000, `channels`
        outside 1-16, a `sample_format` that is not `s16le` or `f32le`, or a
        `language` outside `[A-Za-z0-9_-]` of at most 64 characters is 400
        `transcription.live_params_invalid`); the model then goes through
        the buffered transcription endpoint's own gate and resolve (the token's
        model and server overrides, the user's reachable servers, the
        `transcription` capability and the effective-flavor rule), whose refusals
        are unchanged (404 `routing.no_model_route` or `routing.model_not_capable`,
        and the shared gate's 403 `model.not_allowed` or
        `server_override.forbidden`, and 503 `routing.no_healthy_host` or
        `routing.admission_queue_timeout`/`_full`). It spends NO rate/quota/budget
        admission: the session's one admission is spent at
        /v1/audio/transcriptions/live, which the WebSocket loops back to, so
        minting tickets costs the caller nothing against its limits. The mapping
        must carry a stored `transcription_streaming = yes` verdict (409
        `transcription.live_not_streaming`); and a `server_agent` target needs
        positive evidence its agent declared `fullduplex_proxy` (409
        `transcription.live_agent_unsupported`; a direct `audio_cpp` target is
        exempt). It is a gate, not a relay: no admission, no usage row, no
        capture, no upstream contact. The ticket lives about 30 seconds,
        is single-use, is AES-256-GCM encrypted under a per-process key (it
        carries the resolved target, the validated params and the user id, with
        the token id, service and project as a record, none of which the browser
        can read or alter) and opens only on the gateway process that minted it
        (issue #285). A failed mint is 500
        `portal.live_transcription_ticket_failed`; any method but POST is 405.
        See api-surface.md and compatibility-and-inference.md section 3.8.
      security: [{ sessionCookie: [], csrfHeader: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LiveTranscriptionTicketRequest' }
      responses:
        '200':
          description: The opaque ticket, and nothing of the decision it carries.
          content:
            application/json:
              schema:
                type: object
                required: [ticket]
                properties:
                  ticket:
                    type: string
                    description: >
                      Unpadded URL-safe base64, a valid Sec-WebSocket-Protocol
                      value. Present it as the second offered subprotocol on the
                      upgrade; never put it in a URL.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: >
            The Error envelope: `auth.csrf_required` (a session cookie without
            X-OP-CSRF), `auth.insufficient_scope` (no gateway:use),
            `model.not_allowed` (the effective model is outside a service
            account's allowlist) or `server_override.forbidden`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { description: 'Any method other than POST (Allow: POST).' }
        '503':
          description: >
            The Error envelope with code `routing.no_healthy_host` (every candidate
            is gated) or `routing.admission_queue_timeout` / `routing.admission_queue_full`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: >
            The Error envelope with code `transcription.live_not_streaming`
            (the mapping has no transcription_streaming = yes verdict) or
            `transcription.live_agent_unsupported` (the agent has not
            declared fullduplex_proxy: older than 0.12.0, or not reported since
            the gateway restarted or the agent was upgraded).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: The Error envelope with code `portal.live_transcription_ticket_failed`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/portal/transcription-live:
    get:
      tags: [portal]
      summary: Live transcription WebSocket (ticket-authenticated, same-origin; PCM up, typed transcript messages down)
      description: >
        Step two of the portal's live transcription (ADR-072, ADR-073, issue #266): a WebSocket upgrade
        whose ONLY credential is the single-use ticket minted by POST
        /api/portal/transcription-live-ticket, offered as a
        `Sec-WebSocket-Protocol` value (`new WebSocket(url,
        ['op-live-transcription', ticket])`) and never in the URL. The ticket is
        redeemed BEFORE the upgrade: an absent, malformed, expired, replayed or
        foreign-process ticket is 401 with NO upgrade; the upgrade keeps the
        library's default same-origin check (it compares Origin with Host, so a
        reverse proxy in front of the gateway must preserve the original Host), so
        a cross-origin request is 403; any method but GET is 405. No cookie and no CSRF header is read, and the
        handler takes no model, route or rate from the client. After 101 the
        subprotocol `op-live-transcription` is selected. The browser sends BINARY
        frames of raw interleaved PCM in the ticket's format (at most 1 MiB each; a
        larger frame closes the socket 1009) and ONE text control,
        `{"type":"end"}`, the explicit end-of-input (a close WITHOUT it is a
        truncated session that bills a loud zero). The gateway sends TEXT frames
        of JSON: `{"type":"delta","text":...}` (append),
        `{"type":"partial","text":...}` (replace the provisional transcript),
        `{"type":"done","text":...}` (the final transcript; if audio.cpp emits a
        done per utterance mid-stream, which is unconfirmed, it is not
        necessarily the last message) and
        `{"type":"error","message":...}` (terminal). The handler is a thin adapter: it
        LOOPS BACK over the internal trusted-loopback pair to
        POST /v1/audio/transcriptions/live (as the ticket's user, with
        `Expect: 100-continue`), which spends the one admission, takes the
        per-route session slot, relays upstream and records the one usage row, so
        a refusal there (a denied admission, a busy route, anything non-2xx) reaches
        the browser as ONE `error` message after the upgrade with a generic
        message, never as a status or a 1013 close. The session is billed there as
        `audio_second` (PCM payload bytes over the byte rate of the validated
        params) on a clean end only, to the loopback user (no token, service or
        project). The upgrade hijacks the connection, so the server's 30 s
        deadlines do not apply. See api-surface.md and
        compatibility-and-inference.md section 3.8.
      security: []
      parameters:
        - name: Sec-WebSocket-Protocol
          in: header
          required: true
          description: >
            `op-live-transcription, <ticket>`: the fixed subprotocol name and the
            ticket, in either order (the ticket is the one value that is not the
            fixed name).
          schema: { type: string }
      responses:
        '101':
          description: Switching Protocols; the WebSocket is open and `op-live-transcription` is the selected subprotocol.
        '401':
          description: No valid ticket (absent, malformed, expired, replayed or minted by another process); plain text, no upgrade.
        '403':
          description: A cross-origin upgrade, refused by the same-origin check.
        '405': { description: 'Any method other than GET.' }
  /api/portal/voice-chat-ticket:
    post:
      tags: [portal]
      summary: Run the Voice Chat co-load gate and mint a single-use ticket for the Voice Chat WebSocket (scope gateway:use, CSRF on a session)
      description: >
        Step one of the portal's Voice Chat (ADR-078, issue #312): the authenticated,
        CSRF-protected request that decides what the WebSocket (GET /api/portal/voice-chat)
        then redeems, because a browser WebSocket cannot send X-OP-CSRF. A session
        cookie needs X-OP-CSRF, a bearer does not, and a service token is refused 401.
        In order: a server with no ticket store or no portal service is 500
        `portal.voice_chat_ticket_failed`; the body is validated (a body that is not one
        JSON object of this shape is 400 `request.invalid_json`; a blank `asr_model`,
        `llm_model` or `tts_model` is 400 `model.name_required`, naming the field; models
        are trimmed); the caller's OWN chat is read (a blank id, an unknown chat and
        another user's chat are all 404 `portal.chat_not_found`, before any model is
        started) and its stored speech settings (`settings.audio`) are snapshotted into
        the ticket (settings that do not decode, or whose JSON is over 1 KiB, are 400
        `portal.voice_chat_audio_settings_invalid`: the ticket rides one header line);
        then the CO-LOAD GATE runs under the deadline OP_AI_GATEWAY_VOICE_COLOAD_TIMEOUT
        (default 120 s; the server's 30 s read and write deadlines are lifted first).
        Step 1 resolves and gates each leg for the shape it will be called on WITHOUT
        spending admission: the transcription model as the live relay is gated (the
        transcription capability, a transcription_streaming = yes verdict, and for an
        agent target a declared fullduplex_proxy), the chat model as chat completions is
        (an audio- or images-only target is refused), the speech model as the streaming
        speech relay is (the speech capability, a speech_streaming = yes verdict and an
        offerable model: a clone model only with a named preset voice); a refusal is 400
        `portal.voice_chat_asr_unavailable`, `portal.voice_chat_llm_unavailable` or
        `portal.voice_chat_tts_unavailable`, naming no internal model or server. Step 2
        ensures each agent-managed leg one at a time (a start failure is that leg's
        unavailable code; an agent that will not admit the model,
        runtime.admission_blocked, is 409 `portal.voice_chat_coload_failed`). Step 3
        reads each agent's LIVE loaded set after all the ensures and requires every
        agent-managed leg's model to be in it at once: a start that evicted another
        leg, or a residency that cannot be read, is 409 `portal.voice_chat_coload_failed`,
        as is a gate that outlives its deadline. A mint that fails, or a token over 7 KiB
        (it would not fit a proxy's header line), is 500 `portal.voice_chat_ticket_failed`.
        The ticket lives about 30 seconds, is single-use, is AES-256-GCM encrypted under
        a per-process key (it carries the three resolved targets, the chat, the
        attribution, the speech settings and the fixed PCM shape, none of which the
        browser can read or alter) and opens only on the gateway process that minted it.
        It is a gate, not a relay: no admission, no usage row, no capture. Any method but
        POST is 405. See api-surface.md and 06-runtime-view.md section 6.1.6.
      security: [{ sessionCookie: [], csrfHeader: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VoiceChatTicketRequest' }
      responses:
        '200':
          description: The opaque ticket, and nothing of the decision it carries.
          content:
            application/json:
              schema:
                type: object
                required: [ticket]
                properties:
                  ticket:
                    type: string
                    description: >
                      Unpadded URL-safe base64, a valid Sec-WebSocket-Protocol
                      value. Present it as the second offered subprotocol on the
                      upgrade (the first is `op-voice-chat`); never put it in a URL.
        '400':
          description: >
            The Error envelope: `request.invalid_json`, `model.name_required`,
            `portal.voice_chat_asr_unavailable`, `portal.voice_chat_llm_unavailable`,
            `portal.voice_chat_tts_unavailable` or
            `portal.voice_chat_audio_settings_invalid`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: >
            The Error envelope: `auth.csrf_required` (a session cookie without
            X-OP-CSRF) or `auth.insufficient_scope` (no gateway:use).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: The Error envelope with code `portal.chat_not_found`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '405': { description: 'Any method other than POST (Allow: POST).' }
        '409':
          description: >
            The Error envelope with code `portal.voice_chat_coload_failed`: the three
            models cannot be held resident together (an agent refused to admit one,
            starting one evicted another, residency could not be verified, or the gate
            outlived its deadline). The remedy is the operator's: the pairwise
            co-residency matrix and the GPU VRAM budgets.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: The Error envelope with code `portal.voice_chat_ticket_failed`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/portal/voice-chat:
    get:
      tags: [portal]
      summary: Voice Chat WebSocket (ticket-authenticated, same-origin; PCM and controls up, typed state, transcript, answer and audio frames down)
      description: >
        Step two of the portal's Voice Chat (ADR-078, issue #312): a WebSocket upgrade
        whose ONLY credential is the single-use ticket minted by POST
        /api/portal/voice-chat-ticket, offered as a `Sec-WebSocket-Protocol` value
        (`new WebSocket(url, ['op-voice-chat', ticket])`) and never in the URL. The
        ticket is redeemed BEFORE the upgrade: an absent, malformed, expired, replayed or
        foreign-process ticket is 401 with ONE body and NO upgrade (the cause is only
        logged); the upgrade keeps the library's default same-origin check (it compares
        Origin with Host, so a reverse proxy must preserve the original Host), so a
        cross-origin request is 403; any method but GET is 405. No cookie and no CSRF
        header is read, and the handler takes no model, chat or rate from the client.
        After 101 the subprotocol `op-voice-chat` is selected and the session opens in
        `listening`. The browser sends BINARY frames of raw s16le mono 16 kHz PCM (about
        100 ms each, at most 1 MiB; a larger frame closes the socket 1009) and TEXT
        control frames `{"type":"push_start"}`, `{"type":"push_end"}`,
        `{"type":"cancel"}`, `{"type":"playback_done"}` (with an optional integer
        `played_through`, the count of `audio_delta` frames the client has received for the
        turn; the server honors the signal as the end of audio only when it covers every
        frame relayed, and an absent or null count is accepted as before) and
        `{"type":"bye"}`; anything else is ignored. The gateway sends TEXT frames of JSON: `state` (`idle`,
        `listening`, `thinking`, `speaking` or `draining`), `asr_partial` (the CURRENT
        chunk's provisional text, replace), `asr_final` (one chunk's final text, append),
        `answer_delta` (append), `answer_done` (provisional, before the commit),
        `answer_reset` (the speculative run was cancelled because the user resumed),
        `audio_delta` (`seq` from 0, `rate`, base64 s16le PCM), `audio_done` (the audio is
        complete and the turn is committed: reload the chat thread) and `error` (`code`
        is the failing core's stable code; the session stays open and returns to `idle`).
        No frame carries a message id. The handler is a server-side state machine that
        loops back, as the ticket's user, to three /v1 cores: the live ASR relay (one
        fresh relay per chunk), chat completions and streaming speech, each of which
        admits, guards and bills for itself; the handler takes no admission and writes no
        usage row. Mic PCM is discarded in the state machine, before any ASR relay, in
        `speaking`, `draining` and `idle`, while a chunk finalizes and once the
        continuation window has closed (half-duplex, enforced server-side), and
        `draining` ends at max(the relayed audio's own duration, min(30 s ceiling, the
        client's playback_done)) plus the mic-resume tail (the ceiling never cuts below
        the audio's own duration). `cancel` is the user's immediate stop: it abandons the
        turn and returns the session to `listening` from ANY state, including `speaking`
        and `draining`, so a client stops its own playback before sending it. A user turn and its answer are
        persisted together, once, when the turn is committed; a speculative run that the
        user's resumed speech cancels persists nothing. The upgrade hijacks the connection,
        so the server's 30 s deadlines do not apply. See api-surface.md and
        06-runtime-view.md section 6.1.6.
      security: []
      parameters:
        - name: Sec-WebSocket-Protocol
          in: header
          required: true
          description: >
            `op-voice-chat, <ticket>`: the fixed subprotocol name and the ticket, in
            either order (the ticket is the one value that is not the fixed name).
          schema: { type: string }
      responses:
        '101':
          description: Switching Protocols; the WebSocket is open and `op-voice-chat` is the selected subprotocol.
        '401':
          description: No valid ticket (absent, malformed, expired, replayed or minted by another process); one plain-text body for every cause, no upgrade.
        '403':
          description: A cross-origin upgrade, refused by the same-origin check.
        '405': { description: 'Any method other than GET.' }
